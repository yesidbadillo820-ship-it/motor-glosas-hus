name: CI

on:
  push:
    # `motor-glosas` va en la lista desde el 21-08-2026. Es la rama de la
    # que el PC de cartera baja el codigo cada 5 minutos —o sea, la que de
    # verdad llega al hospital— y era la unica que NO se revisaba: todo se
    # comprobaba en las ramas de trabajo y despues se fusionaba aca a
    # ciegas. Ese dia el portal se cayo tras un reinicio y la correccion
    # entro sin que ningun CI llegara a terminar sobre el resultado
    # fusionado.
    branches: ["main", "develop", "motor-glosas", "claude/**"]
  pull_request:
    branches: ["main", "develop", "motor-glosas"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Versión FIJA a propósito: con `pip install ruff` a secas, cada release
      # de ruff cambia el formateador y rompe el gate de todas las ramas a la
      # vez, sin que nadie haya tocado el código. Ya pasó (0.16 empezó a
      # formatear los bloques ```python de los .md). Para subir de versión:
      # cambiar el pin acá, correr `ruff format .` y revisar el diff.
      - run: pip install ruff==0.16.0
      # Sólo reglas de alta señal: F (pyflakes), W6xx (escape sequences)
      # Las reglas de estilo/formato se habilitan gradualmente en el plan.
      - run: ruff check . --select F,W6
      - run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-do-not-use-in-production
      DATABASE_URL: sqlite:///./test_ci.db
      PYTHONPATH: ${{ github.workspace }}
      # Salta schedulers en background — sin esto, los TestClient acumulan
      # asyncio tasks hasta agotar memoria del runner.
      DISABLE_SCHEDULERS: "1"
      # En el CI, una prueba que se salta porque «falta LibreOffice» es un
      # fallo, no un aviso: el runner SÍ tiene que tenerlo. Sin esto, el día
      # que la instalación se rompa la suite seguiría dando verde con doce
      # pruebas saltadas y nadie lo notaría.
      EXIGIR_HERRAMIENTAS_DE_PRUEBA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # requirements-dev.txt incluye -r requirements.txt + pytest y
          # pytest-asyncio (sin esto el job fallaba con "No module named pytest"
          # y las pruebas nunca corrían).
          pip install -r requirements-dev.txt
          # cryptography from PyPI overrides any broken system package
          pip install "cryptography>=42.0.0"
          # pytest no está en requirements.txt; el runner lo necesita para correr
          # la suite. pytest-asyncio para los tests async (@pytest.mark.asyncio).
          pip install pytest pytest-asyncio

      # LibreOffice completo (Writer/Calc/Draw/Impress) y extract-msg. El
      # mismo script sirve en un contenedor de desarrollo, para que la suite
      # dé el mismo resultado en el PC del que trabaja y en el CI. Antes esta
      # instalación vivía solo acá y en local fallaban doce pruebas por
      # razones que no tenían nada que ver con el código.
      - name: Preparar herramientas de prueba (LibreOffice, extract-msg)
        run: bash scripts/preparar_entorno_pruebas.sh

      - name: Run tests
        run: |
          # -v + --tb=long para ver el error específico en CI sin acceso interactivo.
          # --maxfail=5 para no inundar logs si hay errores en cascada.
          # tee a /tmp para tener log aunque pytest crashee antes del junit.
          set -o pipefail
          python -m pytest tests/ -v --tb=long --maxfail=5 \
            --junitxml=junit.xml \
            -o "junit_family=xunit2" 2>&1 | tee /tmp/pytest-output.log

      - name: Show last 100 lines on failure
        if: failure()
        run: tail -100 /tmp/pytest-output.log || echo "no log file"

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-log
          path: /tmp/pytest-output.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit.xml
          retention-days: 7
          if-no-files-found: warn

  security:
    name: Security scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      # Antes esto terminaba en `|| true`: encontraba las 22 vulnerabilidades
      # que arrastran las dependencias fijadas y decía que todo estaba bien.
      # Un escáner que nunca falla no es un gate.
      #
      # Ahora falla ante cualquier vulnerabilidad NUEVA. Las ya conocidas
      # están anotadas en seguridad/vulnerabilidades_conocidas.txt, a la
      # vista, en vez de escondidas. Poner el gate en cero de una vez
      # dejaría el CI rojo permanentemente y bloquearía hasta los arreglos.
      - run: python scripts/revisar_vulnerabilidades.py

  # Una sola casilla para exigir en la protección de la rama. Sin esto hay
  # que marcar los tres jobs a mano, y el día que se agregue un cuarto queda
  # fuera del gate sin que nadie lo note.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: always()
    steps:
      - name: Comprobar que los tres pasaron
        run: |
          echo "lint     = ${{ needs.lint.result }}"
          echo "test     = ${{ needs.test.result }}"
          echo "security = ${{ needs.security.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] \
             || [ "${{ needs.test.result }}" != "success" ] \
             || [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::Alguno de los tres pasos no terminó bien. No se puede fusionar."
            exit 1
          fi
          echo "Los tres en verde."
