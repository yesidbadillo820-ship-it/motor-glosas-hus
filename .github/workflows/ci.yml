name: CI

on:
  push:
    branches: ["main", "develop", "claude/**"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      # Sólo reglas de alta señal: F (pyflakes), W6xx (escape sequences)
      # Las reglas de estilo/formato se habilitan gradualmente en el plan.
      - run: ruff check . --select F,W6
      - run: ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-do-not-use-in-production
      DATABASE_URL: sqlite:///./test_ci.db
      PYTHONPATH: ${{ github.workspace }}
      # Salta schedulers en background — sin esto, los TestClient acumulan
      # asyncio tasks hasta agotar memoria del runner.
      DISABLE_SCHEDULERS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # cryptography from PyPI overrides any broken system package
          pip install "cryptography>=42.0.0"

      - name: Run tests
        run: |
          python -m pytest tests/ -q --tb=short \
            --junitxml=junit.xml \
            -o "junit_family=xunit2"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: junit.xml
          retention-days: 7

  security:
    name: Security scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --ignore-vuln GHSA-h75v-3vvj-5mfj || true
