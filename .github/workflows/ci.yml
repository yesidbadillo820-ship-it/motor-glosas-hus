name: CI

on:
  push:
    # `motor-glosas` va en la lista desde el 21-08-2026. Es la rama de la
    # que el PC de cartera baja el codigo cada 5 minutos —o sea, la que de
    # verdad llega al hospital— y era la unica que NO se revisaba: todo se
    # comprobaba en las ramas de trabajo y despues se fusionaba aca a
    # ciegas. Ese dia el portal se cayo tras un reinicio y la correccion
    # entro sin que ningun CI llegara a terminar sobre el resultado
    # fusionado.
    branches: ["main", "develop", "motor-glosas", "claude/**"]
  pull_request:
    branches: ["main", "develop", "motor-glosas"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Versión FIJA a propósito: con `pip install ruff` a secas, cada release
      # de ruff cambia el formateador y rompe el gate de todas las ramas a la
      # vez, sin que nadie haya tocado el código. Ya pasó (0.16 empezó a
      # formatear los bloques ```python de los .md). Para subir de versión:
      # cambiar el pin acá, correr `ruff format .` y revisar el diff.
      - run: pip install ruff==0.16.0
      # Sólo reglas de alta señal: F (pyflakes), W6xx (escape sequences)
      # Las reglas de estilo/formato se habilitan gradualmente en el plan.
      - run: ruff check . --select F,W6
      - run: ruff format --check .

  test:
    # 10-09-2026 — CUATRO MÁQUINAS, Y EL REPARTO POR LO QUE CADA ARCHIVO TARDA.
    #
    # Primero se repartió en tres, por nombre de archivo (impares a un grupo,
    # pares al otro). Bajó de 13 minutos a unos 5, y ahí se atascó, porque los
    # archivos no duran lo mismo. Medido en el CI de verdad:
    #
    #     api-1 ....... 2 min 34 s
    #     api-2 ....... 3 min 51 s
    #     resto ....... 4 min 46 s   ← este marcaba el reloj
    #
    # Dos máquinas terminaban y se quedaban mirando a la tercera. El reloj lo
    # marca la más lenta, no el promedio: la mitad del tiempo comprado se
    # perdía esperando.
    #
    # Ahora el reparto lo hace `scripts/repartir_pruebas.py` con lo que cada
    # archivo TARDA de verdad —medido y guardado en
    # `tests/duraciones_pruebas.json`— dándole el más pesado a la máquina que
    # va más liviana. Las cuatro quedan dentro de un 1 % una de otra.
    #
    # Sigue siendo determinista (la misma lista sale siempre, así que un fallo
    # se reproduce corriendo ese grupo) y ningún archivo se queda sin correr:
    # `tests/test_ci/test_reparto_de_pruebas.py` lo comprueba archivo por
    # archivo en cada corrida, y un archivo nuevo todavía sin medir entra
    # igual, con la duración mediana de los demás.
    #
    # Dentro de cada máquina siguen siendo 2 procesos: el runner da 2 núcleos
    # —en el log solo aparecen gw0 y gw1— y poner más NO ayuda (medido: `-n 2`
    # da 4m35 y `-n 4` da 4m33). Estas pruebas gastan procesador, no espera.
    name: Tests (pytest · grupo ${{ matrix.grupo }} de 4)
    runs-on: ubuntu-latest
    strategy:
      # Que un grupo falle NO cancela los otros: si se caen dos cosas
      # distintas, el auditor quiere verlas las dos en la misma corrida y no
      # descubrir la segunda quince minutos después de arreglar la primera.
      fail-fast: false
      matrix:
        grupo: [1, 2, 3, 4]
    env:
      SECRET_KEY: ci-test-secret-do-not-use-in-production
      DATABASE_URL: sqlite:///./test_ci.db
      PYTHONPATH: ${{ github.workspace }}
      # Salta schedulers en background — sin esto, los TestClient acumulan
      # asyncio tasks hasta agotar memoria del runner.
      DISABLE_SCHEDULERS: "1"
      # En el CI, una prueba que se salta porque «falta LibreOffice» es un
      # fallo, no un aviso: el runner SÍ tiene que tenerlo. Sin esto, el día
      # que la instalación se rompa la suite seguiría dando verde con doce
      # pruebas saltadas y nadie lo notaría.
      EXIGIR_HERRAMIENTAS_DE_PRUEBA: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # requirements-dev.txt incluye -r requirements.txt + pytest y
          # pytest-asyncio (sin esto el job fallaba con "No module named pytest"
          # y las pruebas nunca corrían).
          pip install -r requirements-dev.txt
          # cryptography from PyPI overrides any broken system package
          pip install "cryptography>=42.0.0"
          # pytest no está en requirements.txt; el runner lo necesita para correr
          # la suite. pytest-asyncio para los tests async (@pytest.mark.asyncio).
          pip install pytest pytest-asyncio
          # 10-09-2026 — pytest-xdist reparte la suite entre los núcleos del
          # runner. Medido en la suite completa: de 13 min a 3 min 38 s.
          pip install pytest-xdist

      # LibreOffice completo (Writer/Calc/Draw/Impress) y extract-msg. El
      # mismo script sirve en un contenedor de desarrollo, para que la suite
      # dé el mismo resultado en el PC del que trabaja y en el CI. Antes esta
      # instalación vivía solo acá y en local fallaban doce pruebas por
      # razones que no tenían nada que ver con el código.
      - name: Preparar herramientas de prueba (LibreOffice, extract-msg)
        run: bash scripts/preparar_entorno_pruebas.sh

      - name: Run tests
        run: |
          # -v + --tb=long para ver el error específico en CI sin acceso interactivo.
          # --maxfail=5 para no inundar logs si hay errores en cascada.
          # tee a /tmp para tener log aunque pytest crashee antes del junit.
          #
          # `-n auto` reparte entre los núcleos del runner. `--dist loadfile`
          # NO es un adorno: reparte por ARCHIVO, así que todas las pruebas
          # de un mismo archivo caen en el mismo proceso. Sin eso, dos
          # pruebas que comparten la base de datos de prueba o un archivo
          # temporal se pisan y la suite empieza a fallar por razones que no
          # tienen nada que ver con el código — cambiar quince minutos de
          # espera por un verde poco fiable sería peor que no hacer nada.
          #
          # Medido en el CI (2 núcleos), no en la máquina de quien programa:
          #   en serie ......................................... ~13 min
          #   -n auto --dist loadfile, todo en una máquina ..... 6 min 07 s
          #   tres máquinas, reparto por nombre ................ 4 min 46 s
          #   cuatro máquinas, reparto por duración (esto) ..... ~1 min 50 s
          #
          # El reparto vive en `scripts/repartir_pruebas.py` y no acá adentro
          # a propósito: así se puede correr y PROBAR fuera del CI. La lógica
          # metida en el YAML es la que nadie revisa hasta que falla.
          set -o pipefail
          mapfile -t OBJETIVO < <(
            python scripts/repartir_pruebas.py --grupos 4 --grupo ${{ matrix.grupo }}
          )
          if [ ${#OBJETIVO[@]} -eq 0 ]; then
            echo "El grupo ${{ matrix.grupo }} se quedó sin archivos que correr. Eso es un error de reparto, no un éxito."
            exit 1
          fi
          echo "Grupo ${{ matrix.grupo }} de 4: ${#OBJETIVO[@]} archivos."
          python -m pytest "${OBJETIVO[@]}" -v --tb=long --maxfail=5 \
            -n auto --dist loadfile \
            --junitxml=junit.xml \
            -o "junit_family=xunit2" 2>&1 | tee /tmp/pytest-output.log

      - name: Show last 100 lines on failure
        if: failure()
        run: tail -100 /tmp/pytest-output.log || echo "no log file"

      # `continue-on-error` en los dos: estos archivos son para MIRAR qué pasó
      # cuando algo falla, no son el resultado de las pruebas. El 08-09-2026
      # el almacenamiento de artefactos de GitHub contestó 403 al guardar el
      # log, y eso tumbó un job donde la suite había pasado entera. Un
      # tropiezo del sitio donde se guarda el diagnóstico no dice NADA del
      # código, y no puede bloquear una fusión.
      #
      # Si algo falla de verdad, el paso «Show last 100 lines on failure» ya
      # deja el error en el propio log del job: el artefacto es comodidad,
      # no la única copia.
      - name: Upload pytest log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-log-${{ matrix.grupo }}
          path: /tmp/pytest-output.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ matrix.grupo }}
          path: junit.xml
          retention-days: 7
          if-no-files-found: warn

  # 10-09-2026 — ESTE TRABAJO EXISTE POR EL NOMBRE, NO POR LO QUE HACE.
  #
  # La protección de la rama exige un chequeo llamado EXACTAMENTE
  # «Tests (pytest)». Al repartir la suite en tres máquinas, los trabajos
  # pasaron a llamarse «Tests (pytest · api-1)», «… api-2» y «… resto», y
  # ese nombre dejó de existir: GitHub se quedaba esperando un chequeo que
  # ya nadie iba a reportar y la PR quedaba bloqueada PARA SIEMPRE, con
  # todo en verde.
  #
  # Este trabajo vuelve a producir ese nombre y reporta el resultado de los
  # tres. Así no hay que ir a tocar la configuración del repositorio —que
  # nadie recuerda dónde está el día que haga falta— y si mañana se agrega
  # un cuarto grupo, sigue funcionando sin cambiar nada más.
  test-ok:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: [test]
    # Igual que en `ci-ok`: sigue corriendo cuando algún grupo FALLA (que es
    # el caso que tiene que bloquear) y solo se salta si se canceló todo.
    if: ${{ !cancelled() }}
    steps:
      - name: Comprobar que todos los grupos pasaron
        run: |
          echo "resultado de los grupos = ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Alguno de los grupos de pruebas no pasó."
            exit 1
          fi
          echo "Los cuatro grupos en verde."

  security:
    name: Security scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      # Antes esto terminaba en `|| true`: encontraba las 22 vulnerabilidades
      # que arrastran las dependencias fijadas y decía que todo estaba bien.
      # Un escáner que nunca falla no es un gate.
      #
      # Ahora falla ante cualquier vulnerabilidad NUEVA. Las ya conocidas
      # están anotadas en seguridad/vulnerabilidades_conocidas.txt, a la
      # vista, en vez de escondidas. Poner el gate en cero de una vez
      # dejaría el CI rojo permanentemente y bloquearía hasta los arreglos.
      - run: python scripts/revisar_vulnerabilidades.py

  # Una sola casilla para exigir en la protección de la rama. Sin esto hay
  # que marcar los tres jobs a mano, y el día que se agregue un cuarto queda
  # fuera del gate sin que nadie lo note.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [lint, test-ok, security]
    # `!cancelled()` y no `always()`: con `cancel-in-progress`, un push nuevo
    # cancela la corrida anterior, y con `always()` esta casilla igual se
    # ejecutaba y la reportaba en ROJO. Eso pinta de rojo cada commit que se
    # queda atrás, por trabajar normal — y un tablero con rojos que no
    # significan nada acaba mirándose por encima, que es como se cuela el
    # rojo que sí importaba.
    #
    # Sigue corriendo cuando alguno de los tres FALLA (que es el caso que
    # tiene que bloquear); solo se salta cuando la corrida entera se canceló.
    if: ${{ !cancelled() }}
    steps:
      - name: Comprobar que los tres pasaron
        run: |
          echo "lint     = ${{ needs.lint.result }}"
          echo "test     = ${{ needs.test-ok.result }}"
          echo "security = ${{ needs.security.result }}"
          if [ "${{ needs.lint.result }}" != "success" ] \
             || [ "${{ needs.test-ok.result }}" != "success" ] \
             || [ "${{ needs.security.result }}" != "success" ]; then
            echo "::error::Alguno de los tres pasos no terminó bien. No se puede fusionar."
            exit 1
          fi
          echo "Los tres en verde."
