name: Deploy a Fly.io

on:
  # Despliega automáticamente al hacer push a main (típicamente tras merge de un PR)
  push:
    branches: ["main"]
  # Permite disparar manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

concurrency:
  group: fly-deploy-${{ github.ref }}
  # NO cancelar deploys en curso — un deploy interrumpido puede dejar máquinas zombie
  cancel-in-progress: false

jobs:
  deploy:
    name: fly deploy -a motor-glosas-hus
    runs-on: ubuntu-latest
    # Permite que el job acceda al secret FLY_API_TOKEN
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only -a motor-glosas-hus
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
