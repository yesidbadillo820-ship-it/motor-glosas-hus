[project]
name = "motor-glosas-hus"
version = "1.0.0"
description = "Motor de análisis y respuesta de glosas — ESE Hospital Universitario de Santander"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "alembic/versions/",
    "__pycache__",
    ".venv",
    # Documentación: desde ruff 0.16 el formateador entra a los bloques
    # ```python de los archivos Markdown. Los ejemplos de docs/ son bocetos de
    # API para leer (firmas de una línea con su comentario alineado), no
    # módulos compilables: reformatearlos los vuelve ilegibles y rompe el CI
    # de cualquier rama que solo agregue documentación.
    "docs/",
    "*.md",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # líneas largas — cubierto por ruff format
    "B008",   # function calls in default args (FastAPI Depends pattern)
    "SIM117", # nested with statements — legibilidad en contextos async
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

