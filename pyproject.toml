[project]
name = "motor-glosas-hus"
version = "1.0.0"
description = "Motor de análisis y respuesta de glosas — ESE Hospital Universitario de Santander"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "alembic/versions/",
    "__pycache__",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # líneas largas — cubierto por ruff format
    "B008",   # function calls in default args (FastAPI Depends pattern)
    "SIM117", # nested with statements — legibilidad en contextos async
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

