<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Preparación ICFES Saber 11</title>
<style>
/* ===========================================================================
   Sistema de diseño. Todo con tipografías del sistema operativo a propósito:
   la aplicación tiene que funcionar SIN INTERNET, y una tipografía traída de
   la web dejaría la página coja apenas se caiga la conexión.

   Los colores de las gráficas no son de gusto: salen de una paleta validada
   para daltonismo y contraste. Las barras de un mismo dato van todas del mismo
   tono (es UNA serie); el estado va en una etiqueta con texto, nunca en el
   color solo.
   =========================================================================== */
:root{
  /* superficies y tinta — modo claro */
  --plano:#F1F4F8; --sup:#FFFFFF; --sup2:#F7F9FC; --sup3:#EBF0F6;
  --tinta:#0F1621; --tinta2:#48546A; --tinta3:#74809A;
  --linea:#DEE5EE; --linea2:#EDF1F7;
  /* datos */
  --marca:#2a78d6; --marca-t:#1B5AA8; --marca-suave:#E9F1FC; --marca-borde:#BBD5F5;
  --rampa1:#86b6ef; --rampa2:#5598e7; --rampa3:#2a78d6; --rampa4:#184f95;
  --rejilla:#E8ECF2; --eje:#CBD4DF;
  /* estado (siempre acompañado de texto) */
  --bien:#0ca30c; --bien-t:#046604; --bien-f:#EAF7EA;
  --medio:#fab219; --medio-t:#7E5300; --medio-f:#FEF6E4;
  --serio:#ec835a; --serio-t:#96421C; --serio-f:#FDEFE8;
  --critico:#d03b3b; --critico-t:#981919; --critico-f:#FCECEC;
  /* forma */
  --r1:6px; --r2:10px; --r3:14px; --r4:20px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --e1:0 1px 2px rgba(15,22,33,.06);
  --e2:0 1px 2px rgba(15,22,33,.05), 0 4px 12px -4px rgba(15,22,33,.10);
  --e3:0 2px 4px rgba(15,22,33,.05), 0 12px 28px -10px rgba(15,22,33,.20);
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono","SF Mono",Menlo,Consolas,monospace;
  --rail:236px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --plano:#0C1017; --sup:#161B22; --sup2:#1B222C; --sup3:#232B37;
    --tinta:#E8EDF4; --tinta2:#A6B1C2; --tinta3:#7C889B;
    --linea:#28313D; --linea2:#1F2631;
    --marca:#3987e5; --marca-t:#84B4F2; --marca-suave:#15243A; --marca-borde:#24405F;
    --rampa1:#184f95; --rampa2:#2a78d6; --rampa3:#5598e7; --rampa4:#9ec5f4;
    --rejilla:#232B36; --eje:#3A4452;
    --bien:#0ca30c; --bien-t:#5FD05F; --bien-f:#0F2412;
    --medio:#fab219; --medio-t:#F7C948; --medio-f:#2A2110;
    --serio:#ec835a; --serio-t:#F3A183; --serio-f:#2A1A13;
    --critico:#d03b3b; --critico-t:#F07070; --critico-f:#2A1414;
    --e1:0 1px 2px rgba(0,0,0,.4);
    --e2:0 1px 2px rgba(0,0,0,.4), 0 4px 12px -4px rgba(0,0,0,.6);
    --e3:0 2px 4px rgba(0,0,0,.5), 0 14px 30px -10px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --plano:#0C1017; --sup:#161B22; --sup2:#1B222C; --sup3:#232B37;
  --tinta:#E8EDF4; --tinta2:#A6B1C2; --tinta3:#7C889B;
  --linea:#28313D; --linea2:#1F2631;
  --marca:#3987e5; --marca-t:#84B4F2; --marca-suave:#15243A; --marca-borde:#24405F;
  --rampa1:#184f95; --rampa2:#2a78d6; --rampa3:#5598e7; --rampa4:#9ec5f4;
  --rejilla:#232B36; --eje:#3A4452;
  --bien:#0ca30c; --bien-t:#5FD05F; --bien-f:#0F2412;
  --medio:#fab219; --medio-t:#F7C948; --medio-f:#2A2110;
  --serio:#ec835a; --serio-t:#F3A183; --serio-f:#2A1A13;
  --critico:#d03b3b; --critico-t:#F07070; --critico-f:#2A1414;
  --e1:0 1px 2px rgba(0,0,0,.4);
  --e2:0 1px 2px rgba(0,0,0,.4), 0 4px 12px -4px rgba(0,0,0,.6);
  --e3:0 2px 4px rgba(0,0,0,.5), 0 14px 30px -10px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--plano); color:var(--tinta);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3{margin:0; font-weight:650; letter-spacing:-.015em; text-wrap:balance}
h1{font-size:1.6rem; line-height:1.15}
h2{font-size:1.12rem; line-height:1.25}
h3{font-size:.95rem; line-height:1.3; font-weight:600}
p{margin:0 0 var(--s3)}
a{color:var(--marca-t)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.rot{font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; font-weight:650;
     color:var(--tinta3)}
.tenue{color:var(--tinta2)}
.mini{font-size:.82rem}
.serif{font-family:var(--serif)}

/* ------------------------------------------------------------ armazón ---- */
.app{display:grid; min-height:100vh; grid-template-columns:1fr}
.rail{display:none}
.zona{min-width:0; padding:0 var(--s4) 92px}
.limite{max-width:1000px; margin:0 auto}
.limite.lectura{max-width:760px}

.barra{position:sticky; top:0; z-index:30; background:color-mix(in srgb,var(--plano) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(10px); border-bottom:1px solid var(--linea);
  margin:0 calc(var(--s4)*-1) var(--s5); padding:var(--s3) var(--s4)}
.barra .fila{max-width:1000px; margin:0 auto; display:flex; align-items:center;
  justify-content:space-between; gap:var(--s3)}
.marcaapp{display:flex; align-items:center; gap:var(--s2); min-width:0}
.sello{width:30px; height:30px; border-radius:9px; flex:none; display:grid; place-items:center;
  background:var(--marca); color:#fff; font-weight:700; font-size:.78rem; letter-spacing:-.03em;
  box-shadow:var(--e1)}
.marcaapp b{font-size:.95rem; font-weight:650; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis}
.cuenta{display:flex; align-items:baseline; gap:6px; white-space:nowrap}
.cuenta b{font-family:var(--mono); font-size:1.05rem; font-weight:600}

/* ------------------------------------------------------------ tarjetas --- */
.tarjeta{background:var(--sup); border:1px solid var(--linea); border-radius:var(--r3);
  box-shadow:var(--e2); padding:var(--s4); margin-bottom:var(--s4)}
.tarjeta.plana{box-shadow:none}
.tarjeta.acento{border-color:var(--marca-borde); background:linear-gradient(180deg,
  var(--marca-suave) 0%, var(--sup) 60%)}
.enc{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s3);
  margin-bottom:var(--s3)}
.enc .rot{margin-bottom:2px}
.rejilla{display:grid; gap:var(--s4)}
@media(min-width:760px){ .rejilla.dos{grid-template-columns:1fr 1fr} }

/* --------------------------------------------------------------- kpis ---- */
.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px;
  background:var(--linea); border:1px solid var(--linea); border-radius:var(--r3);
  overflow:hidden; box-shadow:var(--e2); margin-bottom:var(--s4)}
.kpi{background:var(--sup); padding:var(--s3) var(--s4); min-width:0}
.kpi .v{font-family:var(--mono); font-size:1.7rem; font-weight:600; line-height:1.1;
  letter-spacing:-.03em; display:block; margin:2px 0 1px}
.kpi .d{font-size:.76rem; color:var(--tinta3); display:flex; align-items:center; gap:4px}
.kpi .delta{font-size:.75rem; font-weight:650; font-family:var(--mono)}
.kpi .delta.sube{color:var(--bien-t)} .kpi .delta.baja{color:var(--critico-t)}

/* ------------------------------------------------------------- botones --- */
button,.btn{font:inherit; font-weight:550; cursor:pointer; border-radius:var(--r2);
  border:1px solid var(--linea); background:var(--sup); color:var(--tinta);
  padding:10px 15px; transition:background .14s,border-color .14s,transform .08s;
  display:inline-flex; align-items:center; justify-content:center; gap:7px}
button:hover{border-color:var(--marca); background:var(--sup2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45; cursor:default; transform:none}
.pri{background:var(--marca); border-color:var(--marca); color:#fff; font-weight:600}
.pri:hover{background:var(--marca-t); border-color:var(--marca-t)}
.fantasma{border-color:transparent; background:transparent; color:var(--tinta2); padding:8px 10px}
.fantasma:hover{background:var(--sup3); border-color:transparent}
.bloque{width:100%}
.fila-btn{display:flex; gap:var(--s2); flex-wrap:wrap}

/* ------------------------------------------------------------- fichas ---- */
.ficha{display:inline-flex; align-items:center; gap:5px; font-size:.74rem; font-weight:650;
  padding:3px 9px; border-radius:99px; border:1px solid var(--linea); background:var(--sup2);
  color:var(--tinta2); white-space:nowrap}
.ficha .pt{width:7px; height:7px; border-radius:50%; flex:none}
.ficha.bien{background:var(--bien-f); border-color:transparent; color:var(--bien-t)}
.ficha.bien .pt{background:var(--bien)}
.ficha.medio{background:var(--medio-f); border-color:transparent; color:var(--medio-t)}
.ficha.medio .pt{background:var(--medio)}
.ficha.serio{background:var(--serio-f); border-color:transparent; color:var(--serio-t)}
.ficha.serio .pt{background:var(--serio)}
.ficha.critico{background:var(--critico-f); border-color:transparent; color:var(--critico-t)}
.ficha.critico .pt{background:var(--critico)}
.ficha.marca{background:var(--marca-suave); border-color:transparent; color:var(--marca-t)}
.ficha.marca .pt{background:var(--marca)}

/* ------------------------------------------------------------ gráficas --- */
.viz{margin-top:var(--s3)}
.viz-tit{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s3);
  margin-bottom:var(--s2)}
.viz svg{display:block; width:100%; height:auto; overflow:visible}
.rejilla-l{stroke:var(--rejilla); stroke-width:1}
.eje-l{stroke:var(--eje); stroke-width:1}
.eje-t{fill:var(--tinta3); font-size:10.5px; font-family:var(--mono)}
.serie-l{fill:none; stroke:var(--marca); stroke-width:2; stroke-linecap:round;
  stroke-linejoin:round}
.serie-a{fill:var(--marca); opacity:.10}
.pto{fill:var(--marca); stroke:var(--sup); stroke-width:2}
.pto.fin{r:5.5}
.meta-l{stroke:var(--tinta3); stroke-width:1.5; stroke-dasharray:5 4; fill:none}
.meta-t{fill:var(--tinta3); font-size:10.5px; font-weight:650}
.cruz{stroke:var(--tinta3); stroke-width:1; stroke-dasharray:3 3}

/* barras horizontales — una sola serie, el estado va en la ficha */
.barras{display:flex; flex-direction:column; gap:var(--s3)}
.br{display:grid; grid-template-columns:1fr auto; gap:15px var(--s3); align-items:center}
.br .n{font-size:.88rem; font-weight:550; min-width:0; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap}
.br .v{font-family:var(--mono); font-size:.85rem; color:var(--tinta2); white-space:nowrap;
  display:flex; align-items:center; gap:var(--s2)}
.br .pista{grid-column:1/-1; position:relative; height:12px; background:var(--sup3);
  border-radius:0 3px 3px 0}
.br .relleno{position:absolute; inset:0 auto 0 0; background:var(--marca);
  border-radius:0 4px 4px 0; transition:width .5s cubic-bezier(.2,.7,.3,1)}
.br .meta{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--tinta2);
  border-radius:1px}
.br .meta::after{content:attr(data-t); position:absolute; top:-15px; left:50%;
  transform:translateX(-50%); font-size:.62rem; font-weight:650; color:var(--tinta3);
  font-family:var(--mono); white-space:nowrap}

/* barras verticales pequeñas (pronóstico de repasos) */
.cols{display:flex; align-items:flex-end; gap:6px; height:78px; margin-top:var(--s2)}
.col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
  gap:5px; min-width:0}
.col .b{width:100%; background:var(--marca); border-radius:4px 4px 0 0; min-height:2px;
  transition:height .4s ease}
.col .b.vacio{background:var(--sup3)}
.col .e{font-size:.64rem; color:var(--tinta3); white-space:nowrap}
.col .q{font-size:.68rem; font-family:var(--mono); color:var(--tinta2); font-weight:600}

/* calendario de estudio (rampa secuencial validada) */
.cal{display:grid; grid-template-columns:repeat(53,1fr); gap:2px; margin-top:var(--s2)}
.cal i{aspect-ratio:1; border-radius:2px; background:var(--sup3); display:block}
.cal i[data-n="1"]{background:var(--rampa1)} .cal i[data-n="2"]{background:var(--rampa2)}
.cal i[data-n="3"]{background:var(--rampa3)} .cal i[data-n="4"]{background:var(--rampa4)}
.cal-ley{display:flex; align-items:center; gap:5px; justify-content:flex-end;
  margin-top:var(--s2); font-size:.68rem; color:var(--tinta3)}
.cal-ley i{width:10px; height:10px; border-radius:2px; background:var(--sup3); display:block}

/* mini gráficas por área */
.multis{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:var(--s3)}
.multi{border:1px solid var(--linea); border-radius:var(--r2); padding:var(--s3);
  background:var(--sup2)}
.multi .t{font-size:.76rem; color:var(--tinta2); font-weight:600; margin-bottom:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.multi .v{font-family:var(--mono); font-size:1.2rem; font-weight:600; letter-spacing:-.02em}

/* globo de datos */
.globo{position:fixed; z-index:60; pointer-events:none; background:var(--sup);
  border:1px solid var(--linea); border-radius:var(--r2); box-shadow:var(--e3);
  padding:8px 11px; font-size:.78rem; opacity:0; transition:opacity .12s; max-width:230px}
.globo.ver{opacity:1}
.globo b{font-family:var(--mono); font-size:.92rem; display:block}

/* ------------------------------------------------- bloques del plan ------ */
.bloques{display:flex; flex-direction:column; gap:var(--s2)}
.bloque-p{display:grid; grid-template-columns:auto 1fr auto; gap:var(--s3); align-items:center;
  padding:var(--s3); border:1px solid var(--linea); border-radius:var(--r2);
  background:var(--sup2); transition:border-color .14s,background .14s}
.bloque-p:hover{border-color:var(--marca-borde); background:var(--marca-suave)}
.bloque-p.hecho{opacity:.55}
.bloque-p .ic{width:34px; height:34px; border-radius:9px; display:grid; place-items:center;
  background:var(--marca-suave); color:var(--marca-t); font-size:1rem; flex:none}
.bloque-p .tx{min-width:0}
.bloque-p .tx b{display:block; font-size:.9rem; font-weight:600}
.bloque-p .tx span{display:block; font-size:.78rem; color:var(--tinta3); overflow:hidden;
  text-overflow:ellipsis}
@media(max-width:560px){
  .bloque-p{grid-template-columns:auto 1fr}
  .bloque-p .fila-btn{grid-column:1/-1; justify-content:flex-end}
  .bloque-p .fila-btn button:last-child{flex:1}
}

/* ------------------------------------------------------------ preguntas -- */
.hud{position:sticky; top:56px; z-index:20; background:var(--sup); border:1px solid var(--linea);
  border-radius:var(--r2); box-shadow:var(--e2); padding:9px var(--s3); margin-bottom:var(--s4);
  display:flex; align-items:center; justify-content:space-between; gap:var(--s3)}
.hud .paso{font-size:.78rem; color:var(--tinta2); font-weight:600; white-space:nowrap}
.hud .crono{font-family:var(--mono); font-size:1rem; font-weight:600; display:flex;
  align-items:center; gap:7px}
.hud .ritmo{width:8px; height:8px; border-radius:50%; background:var(--bien)}
.hud .ritmo.tarde{background:var(--medio)} .hud .ritmo.muytarde{background:var(--critico)}
.hud.rojo{border-color:var(--critico)} .hud.rojo .crono{color:var(--critico-t)}
.progreso{height:4px; background:var(--sup3); border-radius:99px; overflow:hidden;
  margin-bottom:var(--s4)}
.progreso i{display:block; height:100%; background:var(--marca); border-radius:99px;
  transition:width .3s ease}

.contexto{background:var(--sup2); border:1px solid var(--linea); border-left:3px solid var(--marca);
  border-radius:0 var(--r2) var(--r2) 0; padding:var(--s4); margin-bottom:var(--s4);
  font-family:var(--serif); font-size:1rem; line-height:1.7; white-space:pre-wrap;
  max-height:46vh; overflow:auto}
.contexto table{border-collapse:collapse; width:100%; font-family:var(--sans);
  font-size:.82rem; margin:var(--s2) 0; white-space:normal}
.contexto th,.contexto td{border:1px solid var(--linea); padding:5px 8px; text-align:left}
.contexto th{background:var(--sup3); font-weight:650}
.enunciado{font-family:var(--serif); font-size:1.12rem; line-height:1.55; margin-bottom:var(--s4)}

.opciones{display:flex; flex-direction:column; gap:var(--s2)}
.op{display:grid; grid-template-columns:auto 1fr auto; gap:var(--s3); text-align:left;
  align-items:flex-start; padding:13px var(--s3); line-height:1.5; width:100%;
  border-radius:var(--r2); font-family:var(--serif); font-size:1rem; font-weight:400}
.op .l{width:26px; height:26px; border-radius:8px; background:var(--sup3); color:var(--tinta2);
  font-family:var(--sans); font-weight:700; font-size:.8rem; display:grid; place-items:center;
  flex:none; margin-top:1px}
.op .mk{font-size:1rem; opacity:0}
.op:hover:not(:disabled) .l{background:var(--marca-suave); color:var(--marca-t)}
.op.buena{background:var(--bien-f); border-color:var(--bien)}
.op.buena .l{background:var(--bien); color:#fff}
.op.buena .mk{opacity:1; color:var(--bien-t)}
.op.mala{background:var(--critico-f); border-color:var(--critico)}
.op.mala .l{background:var(--critico); color:#fff}
.op.mala .mk{opacity:1; color:var(--critico-t)}
.op:disabled{opacity:1; cursor:default}
.teclas{font-size:.72rem; color:var(--tinta3); margin-top:var(--s2); text-align:center}
kbd{font-family:var(--mono); font-size:.7rem; background:var(--sup3); border:1px solid var(--linea);
  border-bottom-width:2px; border-radius:4px; padding:1px 5px}

.veredicto{display:flex; align-items:center; gap:var(--s2); font-weight:650; font-size:.95rem;
  margin:var(--s4) 0 var(--s3)}
.veredicto.si{color:var(--bien-t)} .veredicto.no{color:var(--critico-t)}
.explica{border-radius:var(--r2); padding:var(--s3) var(--s4); margin-bottom:var(--s3);
  font-size:.94rem; line-height:1.6; border:1px solid var(--linea); background:var(--sup2)}
.explica .rot{display:block; margin-bottom:4px}
.explica.trampa{background:var(--medio-f); border-color:transparent}
.explica.trampa .rot{color:var(--medio-t)}

/* --------------------------------------------------------- formularios -- */
label{display:block; font-size:.78rem; color:var(--tinta2); font-weight:600;
  margin:var(--s4) 0 5px}
input,select{font:inherit; width:100%; padding:10px 12px; border-radius:var(--r2);
  border:1px solid var(--linea); background:var(--sup2); color:var(--tinta)}
input:focus,select:focus{outline:2px solid var(--marca); outline-offset:1px;
  border-color:var(--marca)}
.opts{display:flex; gap:var(--s2); flex-wrap:wrap}
.opts button{font-size:.82rem; padding:7px 13px; border-radius:99px}
.opts button[aria-pressed="true"]{background:var(--marca); border-color:var(--marca); color:#fff}
.check{display:flex; align-items:center; gap:var(--s2); font-size:.88rem; color:var(--tinta);
  font-weight:500; margin-top:var(--s3); cursor:pointer}
.check input{width:auto; margin:0}

/* --------------------------------------------------------------- tablas -- */
.desliza{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.datos{width:100%; border-collapse:collapse; font-size:.87rem}
table.datos th{text-align:left; font-size:.68rem; text-transform:uppercase;
  letter-spacing:.08em; color:var(--tinta3); font-weight:650; padding:8px 10px;
  border-bottom:1px solid var(--linea); white-space:nowrap}
table.datos td{padding:9px 10px; border-bottom:1px solid var(--linea2)}
table.datos tr:last-child td{border-bottom:0}

<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <div class="zona">

<div class="globo" id="globo"></div>
<script>
"use strict";
const DATOS = /*<DATOS>*/{"preguntas":[],"areas":{},"plan":null,"escalas":null,"config":null}/*</DATOS>*/;
/* El bloque de arriba se reemplaza al exportar. Con los valores por defecto la
   plantilla sigue siendo un HTML válido que se puede abrir tal cual. */

/* ===========================================================================
   NUCLEO — cálculo puro, sin pantalla ni navegador.

   Estas funciones son la traducción exacta de icfes/puntaje.py y icfes/plan.py.
   Que sean exactas no es una promesa: hay una prueba (test_nucleo_web.py) que
   corre este mismo bloque con node y compara sus resultados contra los de
   Python. Si alguna se desvía, la prueba falla.

   Por eso NO pueden tocar el DOM ni leer variables globales: reciben todo por
   parámetro. Las marcas NUCLEO de abajo delimitan lo que la prueba extrae.
   =========================================================================== */
/* <NUCLEO> */

/** Redondeo de Python (mitad al par), que NO es el de JavaScript.
 *  Python: round(2.5) = 2.  JavaScript: Math.round(2.5) = 3.
 *  Sin esto, el plan de la app se desviaría del de la consola en los empates. */
function redondear(x){
  const piso = Math.floor(x), resto = x - piso;
  if (Math.abs(resto - 0.5) < 1e-9) return (piso % 2 === 0) ? piso : piso + 1;
  return Math.round(x);
}

function interpolar(x, curva){
  if (x <= curva[0][0]) return curva[0][1];
  if (x >= curva[curva.length-1][0]) return curva[curva.length-1][1];
  for (let i = 0; i < curva.length - 1; i++){
    const [x0,y0] = curva[i], [x1,y1] = curva[i+1];
    if (x >= x0 && x <= x1) return x1 === x0 ? y1 : y0 + (y1-y0)*(x-x0)/(x1-x0);
  }
  return curva[curva.length-1][1];
}

/** Estimación del puntaje de área (0 a 100). NO es el puntaje del ICFES. */
function puntajeArea(correctas, total, curva){
  if (total <= 0) return 0;
  return redondear(interpolar(correctas/total, curva));
}

/** Qué proporción hay que acertar para llegar a ese puntaje. */
function proporcionParaPuntaje(puntaje, curva){
  return interpolar(puntaje, curva.map(([x,y]) => [y,x]));
}

/** Puntaje global 0-500 con la fórmula oficial del ICFES. */
function puntajeGlobal(porArea, areas, orden){
  let num = 0, den = 0;
  for (const k of orden){
    if (porArea[k] === undefined || porArea[k] === null) return null;
    num += porArea[k] * areas[k].peso; den += areas[k].peso;
  }
  return den ? redondear(num/den*5) : null;
}

/** Reparte una meta global (0-500) en metas por área (0-100). */
function metaPorArea(metaGlobal, actuales, areas, orden){
  const objetivo = metaGlobal/5;
  if (!actuales) { const r = {}; for (const a of orden) r[a] = redondear(objetivo); return r; }
  const pesoTotal = orden.reduce((s,a) => s + areas[a].peso, 0);
  const igActual = orden.reduce((s,a) => s + actuales[a]*areas[a].peso, 0) / pesoTotal;
  if (objetivo - igActual <= 0){
    const r = {}; for (const a of orden) r[a] = redondear(Math.min(100, actuales[a])); return r;
  }
  const metas = {}; for (const a of orden) metas[a] = actuales[a];
  for (let vuelta = 0; vuelta < 20; vuelta++){
    const ig = orden.reduce((s,a) => s + metas[a]*areas[a].peso, 0) / pesoTotal;
    const falta = objetivo - ig;
    if (falta <= 0.01) break;
    const margen = {}; for (const a of orden) margen[a] = Math.max(0, 100 - metas[a]);
    const capacidad = orden.reduce((s,a) => s + margen[a]*areas[a].peso, 0) / pesoTotal;
    if (capacidad <= 0) break;
    const factor = Math.min(1, falta/capacidad);
    for (const a of orden) metas[a] = Math.min(100, metas[a] + margen[a]*factor);
  }
  const r = {}; for (const a of orden) r[a] = redondear(metas[a]); return r;
}

/** Reparte "total" unidades entre claves según sus pesos (método del resto mayor). */
function repartirEntero(pares, total){
  const claves = pares.map(p => p[0]);
  const salida = {}; for (const c of claves) salida[c] = 0;
  if (total <= 0 || !claves.length) return salida;
  const suma = pares.reduce((s,p) => s + p[1], 0);
  if (suma <= 0) return salida;
  const exactos = {};
  for (const [c,p] of pares){ exactos[c] = p/suma*total; salida[c] = Math.floor(exactos[c]); }
  const faltan = total - claves.reduce((s,c) => s + salida[c], 0);
  const orden = claves.slice().sort((a,b) => {
    const da = exactos[a]-salida[a], db = exactos[b]-salida[b];
    if (da !== db) return db - da;          // resto mayor primero
    return a < b ? 1 : a > b ? -1 : 0;      // desempate por nombre, al revés (reverse=True)
  });
  for (let i = 0; i < faltan; i++) salida[orden[i % orden.length]] += 1;
  return salida;
}

/** Qué parte del tiempo semanal se lleva cada área (suma 1). */
function repartirHoras(diagnostico, metaGlobal, areas, orden, piso){
  const metas = metaPorArea(metaGlobal, diagnostico, areas, orden);
  const prioridad = {};
  for (const a of orden){
    const brecha = Math.max(0, metas[a] - diagnostico[a]) / 100;
    prioridad[a] = areas[a].peso * (0.15 + brecha);
  }
  const total = orden.reduce((s,a) => s + prioridad[a], 0);
  if (total <= 0){ const r = {}; for (const a of orden) r[a] = 1/orden.length; return r; }
  let reparto = {}; for (const a of orden) reparto[a] = prioridad[a]/total;
  const bajos = orden.filter(a => reparto[a] < piso);
  if (bajos.length){
    const sobrante = 1 - piso*bajos.length;
    const resto = orden.filter(a => !bajos.includes(a))
                       .reduce((s,a) => s + reparto[a], 0);
    const ajustado = {};
    for (const a of orden){
      ajustado[a] = bajos.includes(a) ? piso : (reparto[a]/resto)*sobrante;
    }
    reparto = ajustado;
  }
  return reparto;
}

/** A qué fase pertenece la semana número N. */
function faseDeSemana(numero, totalSemanas, fases){
  let acumulado = 0;
  for (const fase of fases){
    acumulado += fase.proporcion;
    if (numero <= Math.max(1, redondear(acumulado*totalSemanas))) return fase;
  }
  return fases[fases.length-1];
}

/* --- fechas como número de día, en UTC, para no sufrir con los husos ------ */
function aDias(iso){ const [a,m,d] = iso.split("-").map(Number); return Date.UTC(a,m-1,d)/86400000; }
function deDias(n){ return new Date(n*86400000).toISOString().slice(0,10); }

/** Sobre qué se trabaja un bloque: una competencia o un componente. */
function focoDe(area, tipo, semilla, areas){
  const f = areas[area];
  if (tipo === "practica" || tipo === "simulacro_area")
    return f.competencias[semilla % f.competencias.length];
  if (tipo === "teoria") return f.componentes[semilla % f.componentes.length];
  if (tipo === "repaso") return "Lo que venza hoy en el repaso espaciado";
  if (tipo === "cuaderno_errores") return "Errores marcados sin resolver";
  return "Examen completo";
}

/** Arma el plan completo, semana por semana, hasta el día antes del examen. */
function generarPlan(diagnostico, examenISO, metaGlobal, horasSemana, inicioISO, cfg, diasPorSemana){
  diasPorSemana = diasPorSemana || 6;
  const areas = cfg.areasFicha, orden = cfg.orden_areas, fases = cfg.fases;
  const reparto = repartirHoras(diagnostico, metaGlobal, areas, orden, cfg.piso_area);
  const inicio = aDias(inicioISO), examen = aDias(examenISO);
  const totalSemanas = Math.max(1, Math.floor((examen - inicio)/7));
  const porSemana = Math.max(diasPorSemana, redondear(horasSemana*60/cfg.minutos_bloque));
  const semanas = [];

  for (let numero = 1; numero <= totalSemanas; numero++){
    const arranque = inicio + (numero-1)*7;
    const cierre = Math.min(arranque + 6, examen - 1);
    const fase = faseDeSemana(numero, totalSemanas, fases);
    const ultima = numero === totalSemanas;
    const cupo = ultima ? redondear(porSemana*0.6) : porSemana;
    const mezcla = ultima ? [["repaso",0.6],["cuaderno_errores",0.4]] : fase.mezcla;

    const porArea = repartirEntero(orden.map(a => [a, reparto[a]]), cupo);
    const porTipo = repartirEntero(mezcla, cupo);

    const tipos = [];
    for (const [t] of mezcla) for (let i = 0; i < (porTipo[t]||0); i++) tipos.push(t);

    const intercaladas = [];
    const pendiente = Object.assign({}, porArea);
    while (intercaladas.length < cupo){
      let movio = false;
      for (const a of orden){
        if (pendiente[a] > 0 && intercaladas.length < cupo){
          intercaladas.push(a); pendiente[a] -= 1; movio = true;
        }
      }
      if (!movio) break;
    }

    const bloques = [];
    const cuantos = Math.min(intercaladas.length, tipos.length);
    for (let i = 0; i < cuantos; i++){
      const area = intercaladas[i], tipo = tipos[i];
      let dia = arranque + (i % diasPorSemana);
      if (dia > cierre) dia = cierre;
      bloques.push({fecha:deDias(dia), tipo, minutos:cfg.minutos_bloque, area,
                    foco:focoDe(area, tipo, i + numero, areas)});
    }

    const cada = {"Entrenamiento de examen":2, "Afinamiento":1}[fase.nombre];
    if (cada && numero % cada === 0 && !ultima){
      const libre = Math.min(arranque + diasPorSemana, cierre);
      bloques.push({fecha:deDias(libre), tipo:"simulacro_completo",
                    minutos:cfg.minutos_simulacro, area:null,
                    foco: Math.floor(numero/cada) % 2 === 1 ? "Sesión 1" : "Sesión 2"});
    }
    bloques.sort((x,y) => x.fecha < y.fecha ? -1 : x.fecha > y.fecha ? 1
                          : (x.tipo < y.tipo ? -1 : x.tipo > y.tipo ? 1 : 0));
    semanas.push({numero, inicio:deDias(arranque), fin:deDias(cierre),
                  fase:fase.nombre, bloques});
  }
  return {inicio:inicioISO, examen:examenISO, meta:metaGlobal, horas:horasSemana,
          reparto, semanas};
}

/** Repetición espaciada (SM-2), igual que icfes/repaso.py. */
function calificarTarjeta(tarjeta, calidad, hoyISO, examenISO){
  const t = tarjeta || {reps:0, facilidad:2.5, intervalo:0, proxima:null};
  let reps, intervalo;
  if (calidad < 3){ reps = 0; intervalo = 1; }
  else {
    reps = t.reps + 1;
    intervalo = reps === 1 ? 1 : reps === 2 ? 6
              : Math.max(1, redondear(t.intervalo * t.facilidad));
  }
  const ajuste = 0.1 - (5-calidad)*(0.08 + (5-calidad)*0.02);
  const facilidad = Math.max(1.3, t.facilidad + ajuste);
  let proxima = deDias(aDias(hoyISO) + intervalo);
  if (examenISO && proxima >= examenISO){
    proxima = deDias(Math.max(aDias(hoyISO) + 1, aDias(examenISO) - 1));
  }
  return {reps, facilidad:Math.round(facilidad*10000)/10000, intervalo, proxima};
}

/** De lo que pasó al responder a una calificación de 0 a 5. */
function calidadDe(acerto, segundos, causa){
  if (!acerto) return (causa === "concepto" || causa === "adivine") ? 0
                    : (causa === "descuido" || causa === "tiempo") ? 2 : 1;
  if (segundos === null || segundos === undefined) return 4;
  if (segundos > 180) return 3;
  if (segundos > 72) return 4;
  return 5;
}
/* </NUCLEO> */

/* ===========================================================================
   Guardado en el navegador. Todo envuelto en try/catch porque en una ventana
   privada, o con las cookies bloqueadas, localStorage lanza excepción: un
   estudiante no puede quedarse sin app por eso.
   =========================================================================== */
const CLAVE = "icfes.v2";
const CFG = Object.assign({}, DATOS.plan, {areasFicha: DATOS.areas});
const ORDEN = DATOS.plan ? DATOS.plan.orden_areas : [];
const CURVA = DATOS.escalas ? DATOS.escalas.curva : [[0,0],[1,100]];
const BASE = {config:DATOS.config, intentos:[], tarjetas:{}, simulacros:[], marcadas:[], hechos:{}};

function leerGuardado(){
  try{ const c = localStorage.getItem(CLAVE); if(c) return JSON.parse(c); }catch(e){}
  try{ const v = localStorage.getItem("icfes.v1"); if(v) return JSON.parse(v); }catch(e){}
  return null;
}
let E = Object.assign({}, BASE, leerGuardado() || {});
if(!E.config) E.config = DATOS.config;
if(!E.marcadas) E.marcadas = [];
if(!E.hechos) E.hechos = {};
function guardar(){ try{ localStorage.setItem(CLAVE, JSON.stringify(E)); }catch(e){} }

/* ------------------------------------------------------------- utilidades */
const DIAS = ["lunes","martes","miércoles","jueves","viernes","sábado","domingo"];
const DIAS3 = ["lun","mar","mié","jue","vie","sáb","dom"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto",
               "septiembre","octubre","noviembre","diciembre"];
const MES3 = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function hoyISO(){ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function diaSem(iso){ return (new Date(aDias(iso)*86400000).getUTCDay()+6)%7; }
function fLarga(iso){ const [a,m,d]=iso.split("-").map(Number);
  return `${DIAS[diaSem(iso)]} ${d} de ${MESES[m-1]} de ${a}`; }
function fCorta(iso){ const [,m,d]=iso.split("-").map(Number); return `${DIAS3[diaSem(iso)]} ${d} ${MES3[m-1]}`; }
function fMini(iso){ const [,m,d]=iso.split("-").map(Number); return `${d} ${MES3[m-1]}`; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function neg(s){ return s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }
function txt(s){ return neg(esc(s)); }
function plural(n, uno, muchos){ return n === 1 ? uno : muchos; }

function semaforo(p){
  for(const [tope,etq,consejo] of (DATOS.escalas?DATOS.escalas.semaforo:[])){
    if(p < tope) return {etq, consejo, clase:{["crítico"]:"critico",["en construcción"]:"serio",
      ["sólido"]:"marca",["alto"]:"bien"}[etq] || "marca"};
  }
  return {etq:"alto", consejo:"", clase:"bien"};
}
function nivelIngles(p){
  for(const [tope,nivel,desc] of (DATOS.escalas?DATOS.escalas.ingles:[])) if(p<tope) return {nivel,desc};
  return {nivel:"B1", desc:""};
}
function nombreArea(k){ return DATOS.areas[k] ? DATOS.areas[k].nombre : k; }

/* -------------------------------------------------------------- consultas */
function diagnostico(){
  const conTodo = E.simulacros.filter(s => s.global !== null && s.global !== undefined);
  if(conTodo.length){
    const u = conTodo[conTodo.length-1];
    if(ORDEN.every(a => u.porArea[a] !== undefined)) return {datos:u.porArea, real:true};
  }
  const r = {}; for(const a of ORDEN) r[a] = 50;
  return {datos:r, real:false};
}
function planActual(){
  const c = E.config;
  if(!c || !c.examen) return null;
  const hoy = hoyISO();
  if(aDias(c.examen) <= aDias(hoy)) return null;
  const arranque = E.intentos.length ? E.intentos[0].fecha : hoy;
  const desde = aDias(arranque) < aDias(hoy) ? arranque : hoy;
  return generarPlan(diagnostico().datos, c.examen, c.meta || 400,
                     c.horas || 12, desde, CFG, c.dias || 6);
}
function bloquesDe(plan, iso){
  if(!plan) return [];
  for(const s of plan.semanas) if(s.inicio <= iso && iso <= s.fin)
    return s.bloques.filter(b => b.fecha === iso);
  return [];
}
function semanaDe(plan, iso){
  if(!plan) return null;
  return plan.semanas.find(s => s.inicio <= iso && iso <= s.fin) || null;
}
function vencidas(iso){
  return DATOS.preguntas.filter(p => { const t = E.tarjetas[p.id];
    return t && t.proxima && t.proxima <= iso; });
}
function racha(iso){
  const dias = new Set(E.intentos.map(i => i.fecha));
  if(!dias.size) return 0;
  let cursor = aDias(iso);
  if(!dias.has(deDias(cursor))) cursor -= 1;
  let n = 0;
  while(dias.has(deDias(cursor))){ n++; cursor -= 1; }
  return n;
}
function conGlobal(){ return E.simulacros.filter(s => s.global !== null && s.global !== undefined); }

/** La serie de puntaje global para las gráficas de tiempo.
 *  Si en un mismo día se hicieron varios simulacros, se queda el ÚLTIMO: dos
 *  puntos en la misma fecha se dibujan uno encima del otro y el globo de datos
 *  ya no sabe a cuál se refiere. La tabla («Ver tabla») sí los muestra todos,
 *  así que no se esconde ningún resultado. */
function serieGlobal(){
  const porDia = new Map();
  for(const s of conGlobal()) porDia.set(s.fecha, s.global);
  return [...porDia.entries()].sort((a,b) => a[0] < b[0] ? -1 : 1)
    .map(([fecha,v]) => ({fecha, v}));
}
function dominioPorCompetencia(minimo){
  const acum = {};
  for(const i of E.intentos){
    const a = acum[i.competencia] || (acum[i.competencia] = {bien:0, total:0, area:i.area});
    a.total++; if(i.acerto) a.bien++;
  }
  return Object.entries(acum).filter(([,v]) => v.total >= (minimo||4))
    .map(([k,v]) => ({nombre:k, p:v.bien/v.total, n:v.total, area:v.area}))
    .sort((x,y) => x.p - y.p);
}

/* ===========================================================================
   Gráficas. Colores desde los tokens validados: una sola serie va toda del
   mismo tono (es UN dato, no cinco categorías), y el estado se dice con texto
   además del color, para que un daltónico lea lo mismo.
   =========================================================================== */
const globo = () => document.getElementById("globo");
function mostrarGlobo(html, x, y){
  const g = globo(); if(!g) return;
  g.innerHTML = html; g.classList.add("ver");
  const r = g.getBoundingClientRect();
  let iz = x - r.width/2, ar = y - r.height - 12;
  iz = Math.max(8, Math.min(iz, window.innerWidth - r.width - 8));
  if(ar < 8) ar = y + 16;
  g.style.left = iz+"px"; g.style.top = ar+"px";
}
function ocultarGlobo(){ const g = globo(); if(g) g.classList.remove("ver"); }

/** Línea de progreso en el tiempo, con la meta como referencia punteada. */
function graficaLinea(puntos, meta, id){
  if(puntos.length < 2) return "";
  const An = 640, Al = 190, mI = 38, mD = 46, mA = 14, mB = 26;
  const x0 = aDias(puntos[0].fecha), x1 = aDias(puntos[puntos.length-1].fecha);
  const vals = puntos.map(p => p.v).concat(meta ? [meta] : []);
  let yMin = Math.max(0, Math.min(...vals) - 40), yMax = Math.min(500, Math.max(...vals) + 40);
  if(yMax - yMin < 80){ yMax = Math.min(500, yMin + 80); }
  const ex = v => mI + (x1 === x0 ? 0 : (aDias(v)-x0)/(x1-x0)) * (An-mI-mD);
  const ey = v => mA + (1 - (v-yMin)/(yMax-yMin)) * (Al-mA-mB);
  const d = puntos.map((p,i) => (i?"L":"M") + ex(p.fecha).toFixed(1) + " " + ey(p.v).toFixed(1)).join(" ");
  const area = d + ` L${ex(puntos[puntos.length-1].fecha).toFixed(1)} ${Al-mB} L${ex(puntos[0].fecha).toFixed(1)} ${Al-mB} Z`;
  const pasos = 4, lineas = [];
  for(let i = 0; i <= pasos; i++){
    const v = yMin + (yMax-yMin)*i/pasos, y = ey(v);
    lineas.push(`<line class="rejilla-l" x1="${mI}" y1="${y.toFixed(1)}" x2="${An-mD}" y2="${y.toFixed(1)}"/>
      <text class="eje-t" x="${mI-7}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${Math.round(v)}</text>`);
  }
  const metaL = meta ? `<line class="meta-l" x1="${mI}" y1="${ey(meta).toFixed(1)}" x2="${An-mD}" y2="${ey(meta).toFixed(1)}"/>
    <text class="meta-t" x="${An-mD+5}" y="${(ey(meta)+3.5).toFixed(1)}">meta ${meta}</text>` : "";
  const pts = puntos.map((p,i) => `<circle class="pto${i===puntos.length-1?" fin":""}" r="${i===puntos.length-1?5.5:3.5}"
    cx="${ex(p.fecha).toFixed(1)}" cy="${ey(p.v).toFixed(1)}"/>`).join("");
  const anchoZona = Math.max(6, Math.min(30, (An-mI-mD)/Math.max(1, puntos.length-1)));
  const zonas = puntos.map((p,i) => {
    const cx = ex(p.fecha);
    return `<rect x="${(cx-anchoZona/2).toFixed(1)}" y="${mA}" width="${anchoZona.toFixed(1)}"
      height="${Al-mA-mB}" fill="transparent" data-f="${p.fecha}" data-v="${p.v}"
      data-x="${cx.toFixed(1)}" class="zn" style="cursor:crosshair"/>`;
  }).join("");
  const primeros = `<text class="eje-t" x="${mI}" y="${Al-6}">${fMini(puntos[0].fecha)}</text>
    <text class="eje-t" x="${An-mD}" y="${Al-6}" text-anchor="end">${fMini(puntos[puntos.length-1].fecha)}</text>`;
  return `<svg viewBox="0 0 ${An} ${Al}" role="img" aria-label="Puntaje global en el tiempo" id="${id}">
    ${lineas.join("")}${metaL}
    <path class="serie-a" d="${area}"/><path class="serie-l" d="${d}"/>
    <line class="cruz" id="${id}-cruz" x1="0" y1="${mA}" x2="0" y2="${Al-mB}" style="opacity:0"/>
    ${pts}${primeros}${zonas}
  </svg>`;
}
function activarLinea(id){
  const svg = document.getElementById(id); if(!svg) return;
  const cruz = document.getElementById(id+"-cruz");
  svg.querySelectorAll(".zn").forEach(z => {
    const dentra = ev => {
      const r = (ev.touches ? ev.touches[0] : ev);
      cruz.setAttribute("x1", z.dataset.x); cruz.setAttribute("x2", z.dataset.x);
      cruz.style.opacity = "1";
      mostrarGlobo(`<b>${z.dataset.v} pts</b>${fCorta(z.dataset.f)}`, r.clientX, r.clientY);
    };
    z.addEventListener("mouseenter", dentra);
    z.addEventListener("mousemove", dentra);
    z.addEventListener("touchstart", dentra, {passive:true});
    z.addEventListener("mouseleave", () => { cruz.style.opacity="0"; ocultarGlobo(); });
  });
  svg.addEventListener("mouseleave", () => { cruz.style.opacity="0"; ocultarGlobo(); });
}

/** Barras por área. Una sola serie (todas del mismo tono) + marca de meta. */
function barrasAreas(porArea, metas){
  return `<div class="barras">` + ORDEN.map(k => {
    const v = porArea[k]; if(v === undefined) return "";
    const s = semaforo(v), m = metas ? metas[k] : null;
    return `<div class="br">
      <span class="n">${esc(nombreArea(k))}</span>
      <span class="v"><span class="num">${v}</span><span class="ficha ${s.clase}"><i class="pt"></i>${s.etq}</span></span>
      <span class="pista" data-globo="${esc(nombreArea(k))}: ${v} de 100${m?` · meta ${m}`:""}">
        <i class="relleno" style="width:${v}%"></i>
        ${m ? `<i class="meta" style="left:${m}%" data-t="${m}"></i>` : ""}
      </span></div>`;
  }).join("") + `</div>`;
}

/** Columnas pequeñas: cuántos repasos caen cada día de la próxima semana. */
function columnasRepaso(iso){
  const agenda = [];
  for(let i = 0; i < 7; i++){
    const f = deDias(aDias(iso)+i);
    let n = 0;
    for(const p of DATOS.preguntas){
      const t = E.tarjetas[p.id];
      if(!t || !t.proxima) continue;
      if(i === 0 ? t.proxima <= f : t.proxima === f) n++;
    }
    agenda.push({f, n});
  }
  const max = Math.max(1, ...agenda.map(a => a.n));
  return `<div class="cols">` + agenda.map(a => `<div class="col">
      <span class="q">${a.n || ""}</span>
      <span class="b${a.n?"":" vacio"}" style="height:${a.n?Math.max(6,a.n/max*58):3}px"
        data-globo="${a.n} ${plural(a.n,"repaso","repasos")} · ${fCorta(a.f)}"></span>
      <span class="e">${DIAS3[diaSem(a.f)]}</span></div>`).join("") + `</div>`;
}

/** Calendario de estudio: rampa secuencial de un solo tono (validada). */
function calendarioEstudio(iso){
  const porDia = {};
  for(const i of E.intentos) porDia[i.fecha] = (porDia[i.fecha]||0)+1;
  const ultimo = E.intentos.length
    ? E.intentos.reduce((m,i) => i.fecha > m ? i.fecha : m, E.intentos[0].fecha) : iso;
  const fin = Math.max(aDias(iso), aDias(ultimo));
  const ini = fin - 363 - diaSem(deDias(fin-363));
  const celdas = [];
  for(let d = ini; d <= fin; d++){
    const f = deDias(d), n = porDia[f] || 0;
    const nivel = n === 0 ? 0 : n < 5 ? 1 : n < 12 ? 2 : n < 25 ? 3 : 4;
    celdas.push(`<i data-n="${nivel}" data-globo="${n} ${plural(n,'pregunta','preguntas')} · ${fCorta(f)}"></i>`);
  }
  return `<div class="cal" style="grid-template-columns:repeat(${Math.ceil(celdas.length/7)},1fr);
    grid-auto-flow:column; grid-template-rows:repeat(7,1fr)">${celdas.join("")}</div>
    <div class="cal-ley">menos <i></i><i data-n="1" style="background:var(--rampa1)"></i>
      <i data-n="2" style="background:var(--rampa2)"></i><i data-n="3" style="background:var(--rampa3)"></i>
      <i data-n="4" style="background:var(--rampa4)"></i> más</div>`;
}

/** Mini gráfica por área: una serie por recuadro, sin colores que compitan. */
function sparkline(valores){
  if(valores.length < 2) return `<svg viewBox="0 0 90 26"></svg>`;
  const mn = Math.min(...valores), mx = Math.max(...valores), rango = mx-mn || 1;
  const d = valores.map((v,i) => (i?"L":"M") + (i/(valores.length-1)*86+2).toFixed(1) + " "
    + (23 - (v-mn)/rango*20).toFixed(1)).join(" ");
  return `<svg viewBox="0 0 90 26" aria-hidden="true"><path class="serie-l" d="${d}"/>
    <circle class="pto" r="3" cx="88" cy="${(23-(valores[valores.length-1]-mn)/rango*20).toFixed(1)}"/></svg>`;
}
function multiplesPorArea(){
  const hist = conGlobal();
  if(hist.length < 2) return "";
  return `<div class="multis">` + ORDEN.map(k => {
    const vals = hist.map(s => s.porArea[k]).filter(v => v !== undefined);
    if(!vals.length) return "";
    const ult = vals[vals.length-1], prim = vals[0], dif = ult - prim;
    return `<div class="multi"><div class="t">${esc(nombreArea(k))}</div>
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px">
        <span class="v">${ult}</span>
        <span class="mini num" style="color:var(--${dif>0?'bien-t':dif<0?'critico-t':'tinta3'})">
          ${dif>0?"+":""}${dif}</span></div>
      ${sparkline(vals)}</div>`;
  }).join("") + `</div>`;
}

/* Globos de datos para cualquier elemento con data-globo */
function activarGlobos(raiz){
  raiz.querySelectorAll("[data-globo]").forEach(el => {
    const ver = ev => { const r = ev.touches ? ev.touches[0] : ev;
      mostrarGlobo(esc(el.dataset.globo), r.clientX, r.clientY); };
    el.addEventListener("mouseenter", ver);
    el.addEventListener("mousemove", ver);
    el.addEventListener("touchstart", ver, {passive:true});
    el.addEventListener("mouseleave", ocultarGlobo);
  });
}

      `<button aria-pressed="${filtro.fuente===v}" onclick="filtro.fuente='${v}'; pintar()">${t}</button>`).join("")
    + `</div>`;

    <button class="pri" ${pool.length?"":"disabled"} onclick="iniciarPractica()">

    ese filtro. Prueba con «Todas» en «De dónde».</p>`;
  h += `</div></div>`;
  return h;
}

function filtrarPreguntas(){
  const vistos = new Set(E.intentos.map(i => i.id));
  const falladas = new Set(E.intentos.filter(i => !i.acerto).map(i => i.id));
  const difs = filtro.dificultad ? filtro.dificultad.split(",").map(Number) : null;
  return DATOS.preguntas.filter(p => {
    if(filtro.area && p.area !== filtro.area) return false;
    if(filtro.competencia && p.competencia !== filtro.competencia) return false;
    if(difs && !difs.includes(p.dificultad)) return false;
    if(filtro.fuente === "nuevas" && vistos.has(p.id)) return false;
    if(filtro.fuente === "falladas" && !falladas.has(p.id)) return false;
    return true;
  });
}
function muestra(lista, n){
  const c = lista.slice();
  for(let i = c.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [c[i],c[j]]=[c[j],c[i]]; }
  return c.slice(0, n);
}
function nuevaSesion(preguntas, extra){
  return Object.assign({preguntas, i:0, bien:0, respuestas:{}, inicio:Date.now(),
    marcaPregunta:Date.now(), crono:false, mostrando:false, elegida:undefined,
    barajado:null, causaPedida:false, modo:"practica"}, extra||{});
}
function iniciarPractica(){
  const pool = filtrarPreguntas();
  if(!pool.length) return;
  vista = "estudiar";
  sesion = nuevaSesion(muestra(pool, filtro.cuantas), {titulo:"Práctica"});
  pintar(); window.scrollTo(0,0);
}
function iniciarRepaso(){
  const lista = vencidas(hoyISO());
  if(!lista.length) return;
  vista = "estudiar";
  sesion = nuevaSesion(muestra(lista, Math.min(20, lista.length)),
    {titulo:"Repaso espaciado", modo:"repaso"});
  pintar(); window.scrollTo(0,0);
}
function iniciarFalladas(){
  const ids = new Set(E.intentos.filter(i => !i.acerto).map(i => i.id));
  const lista = DATOS.preguntas.filter(p => ids.has(p.id));
  if(!lista.length) return;
  vista = "estudiar";
  sesion = nuevaSesion(muestra(lista, Math.min(20, lista.length)),
    {titulo:"Cuaderno de errores", modo:"errores"});
  pintar(); window.scrollTo(0,0);
}
function practicarCompetencia(area, competencia){
  filtro.area = area; filtro.competencia = competencia;
  filtro.fuente = "todas"; iniciarPractica();
}
function arrancarBloque(indice){
  const b = BLOQUES_HOY[indice]; if(!b) return;
  if(b.tipo === "repaso") return iniciarRepaso();
  if(b.tipo === "cuaderno_errores") return iniciarFalladas();
  if(b.tipo === "simulacro_completo") return ir("simulacro");
  if(b.tipo === "simulacro_area"){
    return iniciarSimulacro("area:"+b.area, 25);
  }
  filtro.area = b.area || "";
  filtro.competencia = (b.tipo === "practica" &&
    DATOS.areas[b.area] && DATOS.areas[b.area].competencias.includes(b.foco)) ? b.foco : "";
  filtro.fuente = "todas"; filtro.dificultad = "";
  filtro.cuantas = b.tipo === "teoria" ? 5 : 10;
  iniciarPractica();
}

/* ----------------------------------------------------------- SIMULACRO --- */
/* Reparto y segundos por pregunta del examen real. Salen de icfes/dominio.py:
   sesión 1 son 120 preguntas en 4 h 30 (135 s), sesión 2 son 134 (121 s). */
const REPARTO = {
  completo:{lectura_critica:41,matematicas:50,sociales_ciudadanas:50,ciencias_naturales:58,ingles:55},
  sesion1:{lectura_critica:41,matematicas:25,sociales_ciudadanas:25,ciencias_naturales:29},
  sesion2:{ingles:55,matematicas:25,sociales_ciudadanas:25,ciencias_naturales:29}
};
const SEGS = {completo:128, sesion1:135, sesion2:121};
let tipoSim = "completo", topeSim = 40;

function vSimulacro(){
  const hist = E.simulacros.slice().reverse();
  const oficial = tipoSim.startsWith("area:")
    ? {[tipoSim.slice(5)]: DATOS.areas[tipoSim.slice(5)].preguntas} : REPARTO[tipoSim];
  const totalOficial = Object.values(oficial).reduce((a,b)=>a+b,0);
  let escala = Math.min(1, topeSim/totalOficial);
  for(const k in oficial) escala = Math.min(escala, DATOS.preguntas.filter(p=>p.area===k).length/oficial[k]);
  const previsto = {}; let suma = 0;
  for(const k in oficial){ previsto[k] = Math.max(1, Math.round(oficial[k]*escala)); suma += previsto[k]; }
  const segs = tipoSim.startsWith("area:") ? 135 : SEGS[tipoSim];

  let h = `<div class="entra"><h1>Simulacro</h1>
    <p class="tenue">Con la estructura y el tiempo del examen real. Sin explicaciones hasta el
    final, igual que el día del examen.</p>`;

  h += `<div class="kpis">
    <div class="kpi"><span class="d">Sesión 1</span><span class="v">2:15</span>
      <span class="d">por pregunta · 120 preguntas</span></div>
    <div class="kpi"><span class="d">Sesión 2</span><span class="v">2:01</span>
      <span class="d">por pregunta · 134 preguntas</span></div>
    <div class="kpi"><span class="d">Cada sesión</span><span class="v">4:30</span>
      <span class="d">horas seguidas</span></div>
    <div class="kpi"><span class="d">Calificables</span><span class="v">254</span>
      <span class="d">más 24 de pilotaje</span></div></div>`;

  h += `<div class="tarjeta"><div class="enc"><div><span class="rot">Armar el simulacro</span>
      <h2>¿Cuál vas a presentar?</h2></div></div>
    <label>Tipo</label><div class="opts">` +
    [["completo","Examen completo"],["sesion1","Sesión 1"],["sesion2","Sesión 2"]].map(([v,t]) =>
      `<button aria-pressed="${tipoSim===v}" onclick="tipoSim='${v}'; pintar()">${t}</button>`).join("") +
    ORDEN.map(k => `<button aria-pressed="${tipoSim==='area:'+k}"
      onclick="tipoSim='area:${k}'; pintar()">Solo ${esc(nombreArea(k))}</button>`).join("")
    + `</div>`;
  h += `<label>Cuántas preguntas</label><div class="opts">` +
    [20,40,60,999].map(n => `<button aria-pressed="${topeSim===n}"
      onclick="topeSim=${n}; pintar()">${n===999?"Todas":n}</button>`).join("") + `</div>`;

  h += `<div class="aviso ojo" style="margin-top:var(--s5)"><span class="ic">⚠️</span><span>
    Este simulacro va a <b>escala ${Math.round(suma/totalOficial*100)} %</b>: ${suma} preguntas
    en vez de ${totalOficial}, con la misma proporción por área y los mismos ${segs} segundos por
    pregunta. Entrena el ritmo, pero <b>no</b> el cansancio de las 4 h 30. Para eso están los
    cuadernillos oficiales del ICFES.</span></div>`;

  h += `<div class="desliza"><table class="datos">
    <tr><th>Área</th><th class="n">En el examen</th><th class="n">En tu simulacro</th></tr>` +
    Object.keys(previsto).map(k => `<tr><td>${esc(nombreArea(k))}</td>
      <td class="n">${oficial[k]}</td><td class="n">${previsto[k]}</td></tr>`).join("") +
    `<tr><td><b>Total</b></td><td class="n"><b>${totalOficial}</b></td>
      <td class="n"><b>${suma}</b></td></tr></table></div>`;
  h += `<div class="fila-btn" style="margin-top:var(--s5)">
    <button class="pri" onclick="iniciarSimulacro(tipoSim, topeSim)">
      Empezar · ${Math.round(suma*segs/60)} minutos</button></div></div>`;

  if(hist.length){
    h += `<div class="tarjeta"><div class="enc"><div><span class="rot">Historial</span>
      <h2>Simulacros anteriores</h2></div></div><div class="desliza"><table class="datos">
      <tr><th>Fecha</th><th>Tipo</th><th class="n">Aciertos</th><th class="n">%</th>
      <th class="n">Global</th></tr>` + hist.slice(0,15).map(s => `<tr>
        <td>${fCorta(s.fecha)}</td><td class="mini tenue">${esc(nombreTipo(s.tipo))}</td>
        <td class="n">${s.bien}/${s.total}</td>
        <td class="n">${Math.round(s.bien/s.total*100)}%</td>
        <td class="n">${s.global !== null && s.global !== undefined ? s.global : "—"}</td></tr>`).join("")
      + `</table></div><p class="mini tenue" style="margin-top:var(--s3)">Solo los simulacros con
      las cinco áreas dan puntaje global: uno de un área sola no dice nada del examen completo.</p></div>`;
  }
  return h + `</div>`;
}
function nombreTipo(t){
  if(t && t.startsWith("area:")) return "Solo " + nombreArea(t.slice(5));
  return {completo:"Examen completo", sesion1:"Sesión 1", sesion2:"Sesión 2"}[t] || t;
}
function iniciarSimulacro(tipo, tope){
  let oficial, segs;
  if(tipo.startsWith("area:")){
    const k = tipo.slice(5); oficial = {[k]: DATOS.areas[k].preguntas}; segs = 135;
  } else { oficial = REPARTO[tipo]; segs = SEGS[tipo]; }
  const totalOficial = Object.values(oficial).reduce((a,b)=>a+b,0);
  let escala = Math.min(1, tope/totalOficial);
  for(const k in oficial) escala = Math.min(escala, DATOS.preguntas.filter(p=>p.area===k).length/oficial[k]);
  const preguntas = [];
  for(const k in oficial){
    const cuantas = Math.max(1, Math.round(oficial[k]*escala));
    preguntas.push(...muestra(DATOS.preguntas.filter(p=>p.area===k), cuantas));
  }
  if(!preguntas.length) return;
  vista = "simulacro";
  sesion = nuevaSesion(muestra(preguntas, preguntas.length), {
    modo:"simulacro", tipo, crono:true, titulo:nombreTipo(tipo),
    limite:preguntas.length*segs, objetivo:segs,
    escala:preguntas.length/totalOficial});
  pintar(); window.scrollTo(0,0);
}

/* ------------------------------------------------- ronda de preguntas ---- */
function arrancarCrono(){
  if(cronoID) clearInterval(cronoID);
  const tic = () => {
    const caja = document.getElementById("crono");
    if(!caja || !sesion || sesion.i >= sesion.preguntas.length){
      clearInterval(cronoID); cronoID = null; return;
    }
    const punto = document.getElementById("ritmo");
    const obj = sesion.objetivo || 120;
    if(sesion.crono){
      // Simulacro: cuenta atrás del tiempo total, como en el examen.
      const queda = Math.max(0, sesion.limite - (Date.now()-sesion.inicio)/1000);
      caja.textContent = Math.floor(queda/60) + ":" + String(Math.floor(queda%60)).padStart(2,"0");
      const hud = document.getElementById("hud");
      if(hud) hud.classList.toggle("rojo", queda < sesion.limite*0.12);
      if(queda <= 0){ clearInterval(cronoID); cronoID = null; terminar(); return; }
    } else {
      // Práctica: cuenta hacia adelante en la pregunta actual. Enseña el ritmo
      // sin la presión del examen; el punto avisa cuando ya te pasaste.
      const seg = sesion.mostrando ? (sesion.segundos || 0)
                                   : (Date.now() - sesion.marcaPregunta)/1000;
      caja.textContent = Math.floor(seg/60) + ":" + String(Math.floor(seg%60)).padStart(2,"0");
    }
    if(punto){
      const seg = sesion.crono ? (Date.now()-sesion.marcaPregunta)/1000
        : (sesion.mostrando ? (sesion.segundos||0) : (Date.now()-sesion.marcaPregunta)/1000);
      punto.className = "ritmo" + (seg > obj*1.5 ? " muytarde" : seg > obj ? " tarde" : "");
    }
  };
  tic(); cronoID = setInterval(tic, 1000);
}
function barajar(p){
  const orden = p.opciones.map((_,i) => i);
  for(let i = orden.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [orden[i],orden[j]]=[orden[j],orden[i]]; }
  return {orden, opciones:orden.map(i => p.opciones[i]), correcta:orden.indexOf(p.correcta)};
}
function contextoHTML(t){
  const lineas = t.split("\n"); let out = "", tabla = [];
  const cerrar = () => {
    if(!tabla.length) return;
    out += `<div class="desliza"><table>` + tabla.map((f,i) => {
      const c = f.split("|").slice(1,-1).map(x => x.trim());
      if(c.every(x => /^:?-+:?$/.test(x))) return "";
      const et = i === 0 ? "th" : "td";
      return "<tr>" + c.map(x => `<${et}>${txt(x)}</${et}>`).join("") + "</tr>";
    }).join("") + `</table></div>`; tabla = [];
  };
  for(const l of lineas){
    if(l.trim().startsWith("|") && l.trim().endsWith("|")) tabla.push(l.trim());
    else { cerrar(); out += txt(l) + "\n"; }
  }
  cerrar(); return out;
}
function vSesion(){
  const s = sesion;
  if(s.i >= s.preguntas.length) return vResultado();
  const p = s.preguntas[s.i];
  if(!s.barajado) s.barajado = barajar(p);
  const b = s.barajado, L = ["A","B","C","D"];
  const seg = (Date.now() - s.marcaPregunta)/1000;
  const obj = s.objetivo || 120;
  const ritmo = seg > obj*1.5 ? "muytarde" : seg > obj ? "tarde" : "";
  const marcada = E.marcadas.includes(p.id);

  let h = `<div class="hud" id="hud">
      <span class="paso">${esc(s.titulo || "Práctica")} · ${s.i+1} de ${s.preguntas.length}</span>

        <span id="crono">0:00</span>
        <span class="mini tenue" style="font-weight:400">${s.crono ? "restante"
          : `de ${Math.floor(obj/60)}:${String(obj%60).padStart(2,"0")}`}</span></span>
    </div>
    <div class="progreso"><i style="width:${s.i/s.preguntas.length*100}%"></i></div>`;

  h += `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;
    margin-bottom:var(--s3);flex-wrap:wrap">
