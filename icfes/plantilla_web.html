  if(p.contexto) h += `<div class="contexto">${contextoHTML(p.contexto)}</div>`;
  h += `<div class="enunciado">${txt(p.enunciado)}</div>`;
  h += `<div class="opciones">` + b.opciones.map((o,i) => {
    let cl = "";
    if(s.mostrando){ if(i === b.correcta) cl = "buena"; else if(i === s.elegida) cl = "mala"; }
    return `<button class="op ${cl}" ${s.mostrando?"disabled":""} onclick="responder(${i})">
      <span class="l">${L[i]}</span><span>${txt(o)}</span>
      <span class="mk">${cl==="buena"?"✓":cl==="mala"?"✗":""}</span></button>`;
  }).join("") + `</div>`;

  if(!s.mostrando){
    h += `<p class="teclas">Puedes responder con el teclado:
      <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd>${s.modo!=="simulacro"?" · <kbd>Enter</kbd> para seguir":""}</p>`;
  }

  if(s.mostrando && s.modo !== "simulacro"){
    const bien = s.elegida === b.correcta;
    h += `<div class="veredicto ${bien?"si":"no"}">${bien?"✓ Correcta":"✗ Incorrecta"}
      <span class="mini tenue" style="font-weight:400">· ${Math.round(s.segundos)} segundos</span></div>`;
    h += `<div class="explica"><span class="rot">Por qué</span>${txt(p.explicacion)}</div>`;
    if(p.trampa) h += `<div class="explica trampa"><span class="rot">La trampa</span>${txt(p.trampa)}</div>`;
    if(!bien && !s.causaPedida){
      h += `<div class="tarjeta plana" style="background:var(--sup2);margin-top:var(--s4)">
        <span class="rot">¿Por qué fallaste?</span>
        <p class="mini tenue" style="margin:4px 0 var(--s3)">Esto arma tu cuaderno de errores.
        Fallar por afán no se arregla igual que fallar por no saber el tema.</p>
        <div class="opts">` + [["concepto","No sabía el tema"],["lectura","Entendí mal la pregunta"],
          ["calculo","Me equivoqué en la cuenta"],["tiempo","Iba de afán"],
          ["descuido","Marqué otra sin querer"],["adivine","Adiviné"]].map(([k,t]) =>
          `<button onclick="marcarCausa('${k}')">${t}</button>`).join("") + `</div></div>`;
    }
  }

  h += `<div class="fila-btn" style="margin-top:var(--s5);justify-content:space-between">
    <button class="fantasma" onclick="marcarPregunta('${p.id}')">
      ${marcada?"★ Marcada":"☆ Marcar para revisar"}</button>
    <span class="fila-btn">
      <button class="fantasma" onclick="salirSesion()">Terminar</button>
      ${s.mostrando ? `<button class="pri" onclick="siguiente()">
        ${s.i+1 >= s.preguntas.length ? "Ver resultado" : "Siguiente"}</button>` : ""}
    </span></div>`;
  return h;
}
function marcarPregunta(id){
  const i = E.marcadas.indexOf(id);
  if(i >= 0) E.marcadas.splice(i,1); else E.marcadas.push(id);
  guardar(); pintar();
}
function salirSesion(){ if(confirmarSalida()){ terminar(); } }

function registrar(p, acerto, segundos, causa){
  E.intentos.push({fecha:hoyISO(), id:p.id, area:p.area, competencia:p.competencia,
                   tema:p.tema, acerto, segundos:Math.round(segundos), causa:causa||null});
  E.tarjetas[p.id] = calificarTarjeta(E.tarjetas[p.id], calidadDe(acerto, segundos, causa),
                                      hoyISO(), E.config ? E.config.examen : null);
  guardar();
}
function responder(i){
  const s = sesion; if(s.mostrando) return;
  const p = s.preguntas[s.i], b = s.barajado;
  s.elegida = i;
  s.segundos = (Date.now() - s.marcaPregunta)/1000;
  const acerto = i === b.correcta;
  if(acerto) s.bien++;
  s.respuestas[p.id] = b.orden[i];      // índice en el orden ORIGINAL de la pregunta
  if(s.modo === "simulacro"){
    registrar(p, acerto, s.segundos, acerto ? null : "adivine");
    s.i++; s.barajado = null; s.marcaPregunta = Date.now();
    if(s.i >= s.preguntas.length) terminar(); else pintar();
  } else {
    s.mostrando = true; s.causaPedida = acerto;
    if(acerto) registrar(p, true, s.segundos, null);
    pintar();
  }
}
function marcarCausa(causa){
  const s = sesion;
  registrar(s.preguntas[s.i], false, s.segundos || 60, causa);
  s.causaPedida = true; pintar();
}
function siguiente(){
  const s = sesion;
  if(s.mostrando && !s.causaPedida) registrar(s.preguntas[s.i], false, s.segundos || 60, null);
  s.i++; s.mostrando = false; s.elegida = undefined; s.barajado = null;
  s.causaPedida = false; s.marcaPregunta = Date.now();
  if(s.i >= s.preguntas.length) terminar(); else pintar();
}
function terminar(){
  if(cronoID){ clearInterval(cronoID); cronoID = null; }
  const s = sesion;
  if(s.modo === "simulacro" && !s.guardado && s.i > 0){
    const totales = {}, bien = {};
    for(const p of s.preguntas.slice(0, s.i)){
      totales[p.area] = (totales[p.area]||0)+1;
      const r = s.respuestas[p.id];
      bien[p.area] = (bien[p.area]||0) + ((r !== undefined && r === p.correcta) ? 1 : 0);
    }
    const puntajes = {};
    for(const k in totales) puntajes[k] = puntajeArea(bien[k], totales[k], CURVA);
    E.simulacros.push({fecha:hoyISO(), tipo:s.tipo, bien:s.bien, total:s.i,
      porArea:puntajes, global:puntajeGlobal(puntajes, DATOS.areas, ORDEN),
      escala:s.escala, segundos:Math.round((Date.now()-s.inicio)/1000)});
    guardar(); s.guardado = true;
  }
  s.i = s.preguntas.length; s.mostrando = false; pintar(); window.scrollTo(0,0);
}

function vResultado(){
  const s = sesion, c = E.config || {};
  const totales = {}, bien = {};
  for(const p of s.preguntas){
    totales[p.area] = (totales[p.area]||0)+1;
    const r = s.respuestas[p.id];
    bien[p.area] = (bien[p.area]||0) + ((r !== undefined && r === p.correcta) ? 1 : 0);
  }
  const puntajes = {};
  for(const k in totales) puntajes[k] = puntajeArea(bien[k], totales[k], CURVA);
  const glob = puntajeGlobal(puntajes, DATOS.areas, ORDEN);
  const hist = conGlobal();
  const previo = hist.length >= 2 ? hist[hist.length-2] : null;
  const pct = s.preguntas.length ? Math.round(s.bien/s.preguntas.length*100) : 0;
  const mins = Math.round((Date.now()-s.inicio)/60000);

  let h = `<div class="entra"><h1>${esc(s.titulo||"Resultado")}</h1>
    <p class="tenue">${fLarga(hoyISO())} · ${mins} ${plural(mins,"minuto","minutos")}</p>`;

  h += `<div class="kpis">
    <div class="kpi"><span class="d">Aciertos</span><span class="v">${s.bien}/${s.preguntas.length}</span>
      <span class="d">${pct}% de acierto</span></div>`;
  if(glob !== null){
    h += `<div class="kpi"><span class="d">Global estimado</span><span class="v">${glob}</span>
      <span class="d">${previo ? `<span class="delta ${glob>=previo.global?"sube":"baja"}">
        ${glob>=previo.global?"▲":"▼"} ${Math.abs(glob-previo.global)}</span> vs. anterior`
        : "de 500"}</span></div>
      <div class="kpi"><span class="d">Meta</span><span class="v">${c.meta||400}</span>
        <span class="d">faltan ${Math.max(0,(c.meta||400)-glob)}</span></div>`;
  }
  const seg = s.preguntas.length ? Math.round((Date.now()-s.inicio)/1000/s.preguntas.length) : 0;
  h += `<div class="kpi"><span class="d">Ritmo</span><span class="v">${Math.floor(seg/60)}:${String(seg%60).padStart(2,"0")}</span>
    <span class="d">por pregunta${s.objetivo ? ` · objetivo ${Math.floor(s.objetivo/60)}:${String(s.objetivo%60).padStart(2,"0")}` : ""}</span></div></div>`;

  if(s.escala && s.escala < 0.99){
    h += `<div class="aviso ojo"><span class="ic">⚠️</span><span>Simulacro a escala
      ${Math.round(s.escala*100)} % del examen real. Sirve para compararte contigo mismo a lo
      largo del año, no para anunciar un puntaje.</span></div>`;
  }

  if(Object.keys(totales).length > 1 || glob !== null){
    const metas = glob !== null ? metaPorArea(c.meta||400, puntajes, DATOS.areas, ORDEN) : null;
    h += `<div class="tarjeta"><div class="enc"><div><span class="rot">Por área</span>
      <h2>Cómo te fue en cada prueba</h2></div></div>${barrasAreas(puntajes, metas)}`;
    if(puntajes["ingles"] !== undefined){
      const n = nivelIngles(puntajes["ingles"]);
      h += `<p class="mini tenue" style="margin-top:var(--s4)">Inglés — nivel estimado
        <b>${n.nivel}</b> del Marco Común Europeo. ${esc(n.desc)}</p>`;
    }
    h += `</div>`;
  }

  const porComp = {};
  for(const p of s.preguntas){
    const a = porComp[p.competencia] || (porComp[p.competencia] = {bien:0,total:0});
    a.total++; const r = s.respuestas[p.id];
    if(r !== undefined && r === p.correcta) a.bien++;
  }
  const flojas = Object.entries(porComp).filter(([,v]) => v.total >= 2)
    .map(([k,v]) => ({k, p:v.bien/v.total, ...v})).sort((a,b) => a.p - b.p).slice(0,4);
  if(flojas.length){
    h += `<div class="tarjeta"><div class="enc"><div><span class="rot">Competencias</span>
      <h2>Por aquí empieza el próximo repaso</h2></div></div><div class="barras">` +
      flojas.map(f => `<div class="br"><span class="n">${esc(f.k)}</span>
        <span class="v"><span class="num">${f.bien}/${f.total}</span></span>
        <span class="pista" data-globo="${esc(f.k)}: ${f.bien} de ${f.total}">
          <i class="relleno" style="width:${f.p*100}%"></i></span></div>`).join("")
      + `</div></div>`;
  }

  const fallas = s.preguntas.filter(p => {
    const r = s.respuestas[p.id]; return r === undefined || r !== p.correcta; });
  if(fallas.length){
    h += `<div class="enc" style="margin-top:var(--s6)"><div><span class="rot">Repaso</span>
      <h2>Lo que fallaste (${fallas.length})</h2></div></div>
      <p class="tenue mini" style="margin-top:calc(var(--s3)*-1)">Ya quedaron marcadas en el
      repaso espaciado: el sistema te las va a volver a mostrar antes de que se te olviden.</p>`;
    for(const p of fallas){
      h += `<div class="tarjeta"><div style="display:flex;gap:8px;flex-wrap:wrap;
        margin-bottom:var(--s3)">
        <span class="ficha marca"><i class="pt"></i>${esc(nombreArea(p.area))}</span>
        <span class="ficha">${esc(p.tema)}</span></div>
        <div class="enunciado" style="font-size:1rem;margin-bottom:var(--s3)">${txt(p.enunciado)}</div>
        <div class="explica" style="background:var(--bien-f);border-color:transparent">
          <span class="rot" style="color:var(--bien-t)">Respuesta correcta</span>
          ${txt(p.opciones[p.correcta])}</div>
        <div class="explica"><span class="rot">Por qué</span>${txt(p.explicacion)}</div>`;
      if(p.trampa) h += `<div class="explica trampa"><span class="rot">La trampa</span>${txt(p.trampa)}</div>`;
      h += `</div>`;
    }
  }
  h += `<div class="fila-btn" style="margin-top:var(--s5)">
    <button class="pri" onclick="ir('inicio')">Volver al inicio</button>
    <button onclick="ir('${s.modo==='simulacro'?'simulacro':'estudiar'}')">Otra ronda</button></div></div>`;
  return h;
}

/* ------------------------------------------------------------- PROGRESO -- */
function vProgreso(){
  const hoy = hoyISO(), c = E.config || {};
  if(!E.intentos.length){
    return `<div class="entra"><h1>Progreso</h1><div class="tarjeta"><div class="vacio">
      <span class="big">📈</span><h2>Todavía no hay nada que medir</h2>
      <p>Cuando respondas preguntas, aquí vas a ver tu dominio por competencia, por qué estás
      fallando y a qué puntaje vas a llegar el día del examen.</p>
      <button class="pri" onclick="ir('simulacro')">Empezar con el diagnóstico</button>
    </div></div></div>`;
  }
  const hist = conGlobal();
  let h = `<div class="entra"><h1>Progreso</h1>`;
  h += `<div class="kpis">
    <div class="kpi"><span class="d">Preguntas hechas</span><span class="v">${E.intentos.length}</span>
      <span class="d">${new Set(E.intentos.map(i=>i.id)).size} distintas</span></div>
    <div class="kpi"><span class="d">Racha</span><span class="v">${racha(hoy)}</span>
      <span class="d">${plural(racha(hoy),"día seguido","días seguidos")}</span></div>
    <div class="kpi"><span class="d">Simulacros</span><span class="v">${hist.length}</span>
      <span class="d">con las cinco áreas</span></div>
    <div class="kpi"><span class="d">En repaso</span><span class="v">${Object.keys(E.tarjetas).length}</span>
      <span class="d">${vencidas(hoy).length} vencen hoy</span></div></div>`;

  if(serieGlobal().length >= 2 && c.examen){
    const serie = serieGlobal();
    const p0 = aDias(serie[0].fecha);
    const pts = serie.map(s => [aDias(s.fecha)-p0, s.v]);
    const n = pts.length, mx = pts.reduce((a,p)=>a+p[0],0)/n, my = pts.reduce((a,p)=>a+p[1],0)/n;
    const varr = pts.reduce((a,p)=>a+(p[0]-mx)**2,0);
    if(varr > 0){
      const m = pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/varr, bb = my-m*mx;
      const proy = Math.max(0, Math.min(500, Math.round(bb + m*(aDias(c.examen)-p0))));
      const meta = c.meta || 400;
      h += `<div class="tarjeta acento"><div class="enc"><div>
        <span class="rot">Proyección al día del examen</span>
        <h2 style="font-size:2.4rem;font-family:var(--mono);letter-spacing:-.03em">${proy}</h2></div>
        <span class="ficha ${proy>=meta?"bien":"medio"}"><i class="pt"></i>
          ${proy>=meta?"alcanzas la meta":"por debajo de la meta"}</span></div>
        <p class="tenue" style="margin:0">${n < 3
          ? `Con ${n} simulacros esta proyección <b>todavía no es confiable</b>. Haz al menos tres, separados por semanas.`
          : m <= 0
            ? "El puntaje no está subiendo. Antes de estudiar más horas, mira el cuaderno de errores: casi siempre el problema es el método."
            : `Vas subiendo <b>${(m*30).toFixed(0)} puntos al mes</b>. ${proy>=meta
              ? "A ese ritmo alcanzas la meta." : `A ese ritmo te faltarían ${meta-proy} puntos.`}`}</p></div>`;
    }
  }
  if(serieGlobal().length >= 2){
    h += `<div class="tarjeta"><div class="enc"><div><span class="rot">Puntaje global</span>
      <h2>Tu línea del año</h2></div></div>
      <div class="viz">${graficaLinea(serieGlobal(), c.meta||400, "g-progreso")}</div>
      <p class="mini tenue" style="margin-top:var(--s3)">Si un día hiciste varios simulacros,
      la línea muestra el último de ese día.</p></div>`;
    const m = multiplesPorArea();
    if(m) h += `<div class="tarjeta"><div class="enc"><div><span class="rot">Por área</span>
      <h2>Cada prueba por separado</h2></div></div>${m}
      <p class="mini tenue" style="margin-top:var(--s3)">El número grande es tu último puntaje;
      el pequeño, cuánto has subido o bajado desde tu primer simulacro.</p></div>`;
  }

  const debiles = dominioPorCompetencia().slice(0,8);
  if(debiles.length){
    h += `<div class="tarjeta"><div class="enc"><div><span class="rot">Competencias</span>
      <h2>De la más floja a la más firme</h2></div></div><div class="barras">` +
      debiles.map(d => `<div class="br"><span class="n">${esc(d.nombre)}</span>
        <span class="v"><span class="num">${Math.round(d.p*100)}%</span>
          <span class="ficha ${semaforo(d.p*100).clase}"><i class="pt"></i>${semaforo(d.p*100).etq}</span></span>
        <span class="pista" data-globo="${esc(d.nombre)} · ${d.n} preguntas respondidas">
          <i class="relleno" style="width:${d.p*100}%"></i></span></div>`).join("") + `</div></div>`;
  }

  const causas = {}; let totalF = 0;
  for(const i of E.intentos) if(!i.acerto && i.causa){ causas[i.causa] = (causas[i.causa]||0)+1; totalF++; }
  const REM = {concepto:["No sabía el tema","Estudiar el tema de cero y volver a practicarlo en 2 días."],
    lectura:["Entendí mal la pregunta","Subrayar qué piden antes de mirar las opciones."],
    calculo:["Me equivoqué en la cuenta","Hacer la operación en el papel, no de memoria."],
    tiempo:["Iba de afán","Practicar con cronómetro y saltar lo que se atasque."],
    descuido:["Marqué otra sin querer","Revisar que la letra marcada sea la que se pensó."],
    adivine:["Adiviné","Es un vacío de tema: va directo al plan de estudio."]};
  if(totalF){
    h += `<div class="tarjeta"><div class="enc"><div><span class="rot">Cuaderno de errores</span>
      <h2>Por qué estás fallando</h2></div></div><div class="barras">` +
      Object.entries(causas).sort((a,b)=>b[1]-a[1]).map(([k,v]) => {
        const [nom, rem] = REM[k] || [k,""];
        return `<div class="br"><span class="n">${nom}</span>
          <span class="v"><span class="num">${v}</span>
            <span class="mini tenue">${Math.round(v/totalF*100)}%</span></span>
          <span class="pista" data-globo="${nom}: ${v} de ${totalF} errores">
            <i class="relleno" style="width:${v/totalF*100}%"></i></span>
          <span class="mini tenue" style="grid-column:1/-1;margin-top:2px">→ ${rem}</span></div>`;
      }).join("") + `</div></div>`;
  }

  h += `<div class="tarjeta"><div class="enc"><div><span class="rot">Constancia</span>
    <h2>Tu año de estudio</h2></div>
    <span class="mini tenue">${new Set(E.intentos.map(i=>i.fecha)).size} días con estudio</span></div>
    <div class="desliza">${calendarioEstudio(hoy)}</div></div>`;

  const rep = {};
  for(const i of E.intentos) if(!i.acerto) rep[i.id] = (rep[i.id]||0)+1;
  const tercas = Object.entries(rep).filter(([,v]) => v >= 2).sort((a,b)=>b[1]-a[1]).slice(0,12);
  if(tercas.length){
    h += `<div class="tarjeta"><div class="enc"><div><span class="rot">Reincidentes</span>
      <h2>Las que has fallado más de una vez</h2></div>
      <button onclick="iniciarFalladas()">Rehacerlas</button></div>
      <p class="tenue mini">Estas son las que de verdad no sabes. El repaso espaciado ya las
      tiene marcadas para volver seguido.</p><div class="desliza"><table class="datos">
      <tr><th>Pregunta</th><th>Tema</th><th class="n">Fallas</th></tr>` +
      tercas.map(([id,v]) => { const p = DATOS.preguntas.find(q => q.id === id);
        return `<tr><td class="num mini">${esc(id)}</td><td>${p?esc(p.tema):""}</td>
          <td class="n">${v}</td></tr>`; }).join("") + `</table></div></div>`;
  }
  return h + `</div>`;
}

/* ------------------------------------------------------------------ PLAN - */
let semanaAbierta = null;
function vPlan(){
  const c = E.config;
  if(!c || !c.examen) return `<div class="entra"><h1>Plan</h1><div class="tarjeta">
    <div class="vacio"><span class="big">🗓️</span><h2>Falta la fecha del examen</h2>
    <p>Con la fecha, la meta y tus horas semanales, el sistema arma el plan completo hasta el
    día del examen.</p><button class="pri" onclick="ir('ajustes')">Configurar</button>
    </div></div></div>`;
  const plan = planActual();
  if(!plan) return `<div class="entra"><h1>Plan</h1><div class="aviso ojo">
    <span class="ic">⚠️</span><span>La fecha del examen ya pasó. Cámbiala en Ajustes.</span></div></div>`;
  const hoy = hoyISO(), actual = semanaDe(plan, hoy);
  const diag = diagnostico();
  const metas = metaPorArea(c.meta||400, diag.datos, DATOS.areas, ORDEN);
  const totalHoras = plan.semanas.reduce((s,x) => s + x.bloques.reduce((t,b)=>t+b.minutos,0), 0)/60;

  let h = `<div class="entra"><h1>Plan de estudio</h1>
    <p class="tenue">Del ${fLarga(plan.inicio)} al ${fLarga(plan.examen)}</p>`;
  h += `<div class="kpis">
    <div class="kpi"><span class="d">Semanas</span><span class="v">${plan.semanas.length}</span>
      <span class="d">hasta el examen</span></div>
    <div class="kpi"><span class="d">Horas por semana</span><span class="v">${c.horas||12}</span>
      <span class="d">${c.dias||6} días de estudio</span></div>
    <div class="kpi"><span class="d">Horas en total</span><span class="v">${Math.round(totalHoras)}</span>
      <span class="d">si cumples el plan</span></div>
    <div class="kpi"><span class="d">Simulacros</span>
      <span class="v">${plan.semanas.reduce((s,x)=>s+x.bloques.filter(b=>b.tipo==="simulacro_completo").length,0)}</span>
      <span class="d">completos</span></div></div>`;

  if(!diag.real){
    h += `<div class="aviso ojo"><span class="ic">⚠️</span><span>Este reparto supone que estás
      en 50 sobre 100 en las cinco áreas, porque todavía no has hecho un simulacro completo.
      Apenas lo hagas, el plan se recalcula solo con tu nivel real.</span></div>`;
  }

  h += `<div class="tarjeta"><div class="enc"><div><span class="rot">Reparto del tiempo</span>
    <h2>Dónde rinde cada hora</h2></div></div><div class="desliza"><table class="datos">
    <tr><th>Área</th><th class="n">Hoy</th><th class="n">Meta</th><th class="n">Horas/sem</th>
    <th class="n">Vale</th></tr>` + ORDEN.map(k => {
      const vale = DATOS.areas[k].peso*5/ORDEN.reduce((s,a)=>s+DATOS.areas[a].peso,0);
      return `<tr><td>${esc(nombreArea(k))}</td><td class="n">${Math.round(diag.datos[k])}</td>
        <td class="n">${metas[k]}</td>
        <td class="n">${(plan.reparto[k]*(c.horas||12)).toFixed(1)} h</td>
        <td class="n">${vale.toFixed(2)}</td></tr>`; }).join("") + `</table></div>
    <p class="mini tenue" style="margin-top:var(--s3)"><b>Vale</b> es cuántos puntos del global
    (0 a 500) gana subir un punto en esa área. Un punto de Matemáticas vale tres veces uno de
    Inglés: por eso el reparto no es parejo.</p></div>`;

  const fases = [];
  for(const s of plan.semanas){
    let f = fases.find(x => x.nombre === s.fase);
    if(!f){ f = {nombre:s.fase, semanas:[], objetivo:(CFG.fases.find(y=>y.nombre===s.fase)||{}).objetivo||""};
      fases.push(f); }
    f.semanas.push(s);
  }
  h += `<div class="enc" style="margin-top:var(--s6)"><div><span class="rot">Calendario</span>
    <h2>Las cuatro fases</h2></div></div>`;
  for(const f of fases){
    const ini = f.semanas[0], fin = f.semanas[f.semanas.length-1];
    const esActual = actual && actual.fase === f.nombre;
    h += `<div class="tarjeta${esActual?" acento":""}"><div class="enc"><div>
        <span class="rot">${esActual?"Fase actual":`Semanas ${ini.numero} a ${fin.numero}`}</span>
        <h2>${esc(f.nombre)}</h2></div>
        <span class="ficha">${fMini(ini.inicio)} → ${fMini(fin.fin)}</span></div>
      <p class="tenue">${esc(f.objetivo)}</p>
      <div class="fila-btn">` + f.semanas.map(s => `<button class="mini"
        style="padding:5px 9px;${s.numero===(actual?actual.numero:-1)?"border-color:var(--marca);color:var(--marca-t);font-weight:700":""}"
        onclick="semanaAbierta=${semanaAbierta===s.numero?"null":s.numero}; pintar()">${s.numero}</button>`).join("")
      + `</div>`;
    const abierta = f.semanas.find(s => s.numero === semanaAbierta);
    if(abierta){
      const porDia = {};
      for(const b of abierta.bloques) (porDia[b.fecha] = porDia[b.fecha] || []).push(b);
      h += `<div style="margin-top:var(--s4);border-top:1px solid var(--linea);padding-top:var(--s4)">
        <span class="rot">Semana ${abierta.numero} · ${fMini(abierta.inicio)} a ${fMini(abierta.fin)}</span>
        <div class="bloques" style="margin-top:var(--s3)">` +
        Object.keys(porDia).sort().map(d => `<div>
          <div class="mini tenue" style="margin:var(--s2) 0 4px;font-weight:650">${fCorta(d)}</div>` +
          porDia[d].map(b => `<div class="bloque-p" style="margin-bottom:6px">
            <span class="ic">${({teoria:"📖",practica:"✍️",repaso:"🔁",simulacro_area:"⏱️",
              simulacro_completo:"🎯",cuaderno_errores:"📕"})[b.tipo]||"•"}</span>
            <span class="tx"><b>${b.area?esc(nombreArea(b.area)):"Todo el examen"} · ${esc(CFG.sesiones[b.tipo].etiqueta)}</b>
              <span>${esc(b.foco)} · ${b.minutos} min</span></span><span></span></div>`).join("")
          + `</div>`).join("") + `</div></div>`;
    }
    h += `</div>`;
  }
  return h + `</div>`;
}

function vAjustes(){
  const c = E.config || {};
  return `<div class="entra"><h1>Ajustes</h1>
    <div class="tarjeta"><div class="enc"><div><span class="rot">Lo esencial</span>
      <h2>Tu examen y tu meta</h2></div></div>
      <label for="a-nom">Cómo te llamas</label>
      <input id="a-nom" value="${esc(c.nombre||"")}" placeholder="Tu nombre" autocomplete="name">
      <label for="a-fx">Fecha del examen</label>
      <input type="date" id="a-fx" value="${c.examen||""}">
      <p class="mini tenue" style="margin-top:6px">El Calendario A de 2026 fue el 26 de julio.
      Cuando el ICFES publique la fecha oficial de 2027, cámbiala aquí y el plan se recalcula solo.</p>
      <label for="a-mt">Meta de puntaje global</label>
      <input type="number" id="a-mt" min="0" max="500" value="${c.meta||400}">
      <p class="mini tenue" style="margin-top:6px">El promedio nacional está entre 250 y 260.
      Pasar de 400 lo logran menos de uno de cada veinte.</p>
      <label for="a-hs">Horas de estudio por semana</label>
      <input type="number" id="a-hs" min="1" max="60" step="0.5" value="${c.horas||12}">
      <label for="a-ds">Días de estudio por semana</label>
      <input type="number" id="a-ds" min="1" max="7" value="${c.dias||6}">
      <p class="mini tenue" style="margin-top:6px">Deja al menos un día de descanso. Un plan que
      nadie aguanta no es un plan.</p>
      <div class="fila-btn" style="margin-top:var(--s5)">
        <button class="pri" onclick="guardarAjustes()">Guardar</button></div></div>

    <div class="tarjeta"><div class="enc"><div><span class="rot">Tus datos</span>
      <h2>Copia de seguridad</h2></div></div>
      <p class="tenue">Tu avance vive solo en este navegador: nadie más lo ve y no se sube a
      ningún lado. Si cambias de computador o borras los datos de navegación, se pierde. Sácale
      copia de vez en cuando.</p>
      <div class="fila-btn">
        <button onclick="exportarDatos()">Ver mi avance para copiarlo</button>
        <button onclick="document.getElementById('a-imp').click()">Cargar un avance</button>
        <input type="file" id="a-imp" accept=".json,.txt" hidden onchange="importarDatos(this)">
      </div>
      <div id="caja-export"></div>
      <div class="fila-btn" style="margin-top:var(--s5)">
        <button onclick="borrarTodo()">Borrar todo mi avance</button></div></div>

    <div class="tarjeta"><div class="enc"><div><span class="rot">Honestidad</span>
      <h2>Qué significan estos puntajes</h2></div></div>
      <p class="tenue mini">El <b>puntaje global (0 a 500)</b> se calcula con la fórmula oficial
      del ICFES: Lectura Crítica, Matemáticas, Sociales y Ciencias Naturales pesan 3 cada una,
      Inglés pesa 1, se divide entre 13 y se multiplica por 5. Esa parte es exacta.</p>
      <p class="tenue mini">El <b>puntaje de cada área (0 a 100) es una estimación</b> de este
      sistema a partir del porcentaje que aciertas. El ICFES usa un modelo estadístico que pesa
      cada pregunta según su dificultad real, medida con miles de estudiantes, y eso no se puede
      replicar aquí. Úsalo para compararte contigo mismo, no como pronóstico.</p>
      <p class="tenue mini">Las <b>preguntas son de práctica</b>, escritas siguiendo la
      estructura y las competencias del Saber 11. No son preguntas del examen real: esas están
      en los cuadernillos que el ICFES publica gratis en su página.</p>
      <p class="tenue mini" style="margin-bottom:0">Banco actual:
      <b>${DATOS.preguntas.length} preguntas</b> · ${ORDEN.map(k =>
        `${DATOS.preguntas.filter(p=>p.area===k).length} de ${esc(nombreArea(k))}`).join(" · ")}.</p></div>
    </div>`;
}
function guardarAjustes(){
  const fx = document.getElementById("a-fx").value;
  if(!fx){ alert("Falta la fecha del examen."); return; }
  const mt = parseInt(document.getElementById("a-mt").value,10);
  const hs = parseFloat(document.getElementById("a-hs").value);
  const ds = parseInt(document.getElementById("a-ds").value,10);
  E.config = {nombre:document.getElementById("a-nom").value.trim(), examen:fx,
    meta:isNaN(mt)?400:Math.max(0,Math.min(500,mt)), horas:isNaN(hs)?12:Math.max(1,hs),
    dias:isNaN(ds)?6:Math.max(1,Math.min(7,ds))};
  guardar(); ir("inicio");
}
function exportarDatos(){
  const caja = document.getElementById("caja-export");
  caja.innerHTML = `<label for="a-txt">Selecciona todo este texto y guárdalo en un archivo</label>
    <textarea id="a-txt" style="width:100%;height:190px;font-family:var(--mono);font-size:.72rem;
      padding:10px;border-radius:var(--r2);border:1px solid var(--linea);background:var(--sup2);
      color:var(--tinta)"></textarea>`;
  const t = document.getElementById("a-txt");
  t.value = JSON.stringify(E, null, 2); t.focus(); t.select();
}
function importarDatos(input){
  const f = input.files && input.files[0]; if(!f) return;
  const lector = new FileReader();
  lector.onload = () => {
    try{
      const d = JSON.parse(lector.result);
      if(!d || typeof d !== "object" || !Array.isArray(d.intentos)) throw new Error("formato");
      E = Object.assign({}, BASE, d); guardar();
      alert("Avance cargado."); ir("inicio");
    }catch(e){ alert("Ese archivo no tiene el formato correcto."); }
  };
  lector.readAsText(f);
}
function borrarTodo(){
  if(!confirm("Se borra TODO tu avance de este navegador: intentos, simulacros y repasos. ¿Seguro?")) return;
  E = JSON.parse(JSON.stringify(BASE)); guardar(); ir("inicio");
}

/* ------------------------------------------------------------- teclado --- */
document.addEventListener("keydown", ev => {
  if(!sesion || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const t = ev.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
  if(sesion.i >= sesion.preguntas.length) return;
  const letra = "ABCD".indexOf(ev.key.toUpperCase());
  if(letra >= 0 && !sesion.mostrando){ ev.preventDefault(); responder(letra); return; }
  if((ev.key === "Enter" || ev.key === " ") && sesion.mostrando){ ev.preventDefault(); siguiente(); }
});

pintar();
</script>
</body>
</html>
