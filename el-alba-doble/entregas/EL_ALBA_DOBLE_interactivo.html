 su esposa, cada noche, sembrando color de la nada solo por la certeza de que usted viene por ella, entiendo, por primera vez en mi vida, qué es lo que la Marea Gris nos quitó de verdad a todos los que crecimos aquí. No quiero seguir siendo parte de que se lo quiten a nadie más.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—Hay una entrada —continuó Petrán, dibujando con un palo en la tierra gris un mapa aproximado del castillo—. Un pasadizo de servicio que usan los que traen el agua a las celdas de la torre. No está vigilado con la misma fuerza que el portón principal, porque nadie cree que alguien de afuera pueda encontrarlo sin ayuda de dentro.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y usted me va a ayudar a entrar por ahí?", "i": false}]}, {"type": "p", "runs": [{"t": "—Voy a hacer algo mejor. Voy a estar de guardia esa misma noche, en ese mismo pasadizo, porque ya me tocaba el turno de todos modos. Solo necesito que usted llegue a tiempo, y que confíe en que un guardia gris, por una vez en su vida, va a mirar hacia otro lado en el momento exacto en que más importa.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir le tomó la mano, con una gratitud que no lograba expresar del todo con palabras.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Cómo puedo agradecerle esto?", "i": false}]}, {"type": "p", "runs": [{"t": "—No me agradezca nada todavía. Agradézcame cuando su esposa esté libre, y cuando yo todavía siga con vida para verlo. Ninguna de las dos cosas está garantizada, señor, y usted lo sabe tan bien como yo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Se despidieron con un plan y una fecha, y Yesir, viendo a Petrán alejarse de vuelta hacia el castillo con el capuchón otra vez calado sobre la cara, sintió que algo se le movía en el pecho: no solo esperanza, aunque también eso, sino algo más grande, más parecido a la certeza de que su historia con Danira, sin que ninguno de los dos lo hubiera planeado, se había convertido en algo capaz de mover incluso a quienes habían nacido, sin ninguna culpa propia, del lado equivocado de una guerra que no habían empezado ellos.", "i": false}]}, {"type": "p", "runs": [{"t": "Siete días.", "i": false}]}, {"type": "p", "runs": [{"t": "Se tocó la muñeca izquierda, sintiendo el pulso débil del Alba Doble bajo la piel, y por primera vez en semanas, permitió que la esperanza le ganara del todo al miedo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Siete días, Danira —susurró, hacia el norte, hacia el castillo gris que ya casi podía ver en el horizonte—. Aguante siete días más. Ya casi llego.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "13-fresia.md", "num": "CAPÍTULO XIII", "title": "FRESIA", "body": [{"type": "p", "runs": [{"t": "Una noche, a mitad del entrenamiento en Alizar, Yesir encontró a Fresia sola en el salón del gremio, mucho después de que los demás Restauradores se hubieran ido a dormir, sentada frente a un retrato a medio restaurar que llevaba, según pudo notar, semanas sin avanzar.", "i": false}]}, {"type": "p", "runs": [{"t": "—No puede dormir tampoco —dijo ella, sin sorprenderse de verlo—. Le pasa a todos los que entrenan rápido para algo que temen no lograr a tiempo.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Quién es? —preguntó Yesir, señalando el retrato: un hombre joven, de sonrisa fácil, pintado con un cariño que se notaba incluso en las pinceladas inacabadas.", "i": false}]}, {"type": "p", "runs": [{"t": "Fresia se quedó callada un momento, con los dedos suspendidos sobre el pincel sin decidirse a tocarlo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Se llamaba Corvino. Fue mi esposo, hace mucho tiempo, antes de que yo supiera lo suficiente sobre esta magia como para haberlo salvado.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—No hace falta que me lo cuente si no quiere —dijo Yesir, sentándose junto a ella.", "i": false}]}, {"type": "p", "runs": [{"t": "—Quiero contárselo. Quizás por eso llevo semanas sin terminar este retrato: porque nunca se lo he contado a nadie completo, y una historia a medias, como una pintura a medias, tiene la costumbre de pesar más de lo que debería.", "i": false}]}, {"type": "p", "runs": [{"t": "Fresia dejó el pincel a un lado y se giró a mirarlo, con una tristeza vieja que a Yesir le resultó, dolorosamente, familiar.", "i": false}]}, {"type": "p", "runs": [{"t": "—Corvino era Fijador, como usted. Yo era, incluso entonces, la mejor Iluminadora de mi generación, aunque todavía no sabía lo suficiente sobre extraer pigmento de fuentes difíciles. Cuando él enfermó —una enfermedad común, nada que ver con la Marea Gris, solo la crueldad ordinaria de un cuerpo que falla— intenté curarlo con color, como se cura una herida con almagre. No sabía todavía que algunas heridas no son de la piel, sino del cuerpo entero, y que el color, por poderoso que sea, no reemplaza lo que la medicina de verdad puede ofrecer.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—Perdí semanas enteras experimentando con pigmentos que no iban a funcionar nunca, en vez de llevarlo a un sanador de verdad a tiempo —continuó Fresia, con la voz firme a pesar del dolor evidente—. Para cuando entendí mi error, ya era demasiado tarde. Corvino murió creyendo, hasta el final, que mi color lo iba a salvar, porque yo misma se lo había prometido con una confianza que no tenía derecho a tener.", "i": false}]}, {"type": "p", "runs": [{"t": "—Lo siento mucho, Fresia.", "i": false}]}, {"type": "p", "runs": [{"t": "—Por eso le enseño con tanta urgencia lo que sé, Yesir. Por eso no dormí ninguna de estas semanas hasta asegurarme de que usted entendiera cada técnica a fondo, no solo de memoria. Porque sé, mejor que casi nadie en este gremio, lo que se siente perder a alguien por no haber sabido lo suficiente a tiempo, y no pienso quedarme sentada viendo a otro hombre cometer el mismo error, cuando tengo en mis manos la instrucción entera para evitarlo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—¿Alguna vez terminó el retrato? —preguntó Yesir, después de un silencio largo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Nunca. Cada vez que me acerco a terminarlo, siento que estoy diciendo adiós de verdad, y todavía no estoy segura de estar lista para eso, aunque hayan pasado ya doce años.", "i": false}]}, {"type": "p", "runs": [{"t": "—Quizás no tiene que terminarlo para decir adiós. Quizás terminarlo es, en realidad, la manera de seguir recordándolo bien, en vez de dejar que el recuerdo se le vaya desdibujando de a poco, como un cuadro sin terminar siempre termina desdibujándose.", "i": false}]}, {"type": "p", "runs": [{"t": "Fresia lo miró un largo momento, con algo parecido a la sorpresa cruzándole la cara.", "i": false}]}, {"type": "p", "runs": [{"t": "—Habla usted como alguien que ya entendió, sin haberlo vivido todavía del todo, lo que yo tardé años en aprender.", "i": false}]}, {"type": "p", "runs": [{"t": "—Aprendí observando a mi esposa, en realidad. Ella nunca guarda nada a medias. Dice que las cosas a medias son las que más duelen, porque nunca terminan de doler del todo ni de sanar del todo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Fresia tomó el pincel, esa noche, y por primera vez en doce años, terminó el retrato de Corvino: la sonrisa completa, los ojos completos, el color entero, fijado para siempre con sus propias manos de Fijadora, no para dejarlo ir, sino para recordarlo bien, tal como era, sin ninguna parte inacabada que le siguiera doliendo en silencio.", "i": false}]}, {"type": "p", "runs": [{"t": "—Gracias, Yesir —dijo, colgando el retrato terminado en la pared del gremio, donde quedaría desde entonces—. Ahora vaya a dormir. Mañana empezamos con lo más difícil de todo: cómo extraer pigmento del propio miedo, sin dejar que el miedo lo controle a usted en el proceso.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "14-la-tormenta.md", "num": "CAPÍTULO XIV", "title": "LA TORMENTA", "body": [{"type": "p", "runs": [{"t": "En los límites entre el territorio todavía coloreado y la primera frontera real de la Marea Gris, una tormenta cayó sobre Yesir con una violencia que ningún clima natural de Pigmalia debería haber tenido.", "i": false}]}, {"type": "p", "runs": [{"t": "No llovía agua. Llovía gris: gotas espesas, casi negras, que al tocar cualquier superficie coloreada la despojaban al instante, dejando charcos de un líquido que ya no era lluvia sino algo más parecido a la ceniza líquida que Yesir había empezado a temer más que a cualquier otra cosa del camino.", "i": false}]}, {"type": "p", "runs": [{"t": "Se refugió bajo un peñasco, con el caballo asustado tirando de las riendas, y sintió, por primera vez desde que había salido de Alizar, que el pánico amenazaba con ganarle la partida a la determinación.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—Esto no es clima natural —murmuró, viendo cómo la lluvia gris devoraba el poco verde que quedaba en los arbustos cercanos, marchitándolos en minutos—. Esto es la Marea Gris misma, adelantándose a mi paso.", "i": false}]}, {"type": "p", "runs": [{"t": "El caballo, aterrado, se soltó de las riendas en un momento de pánico y salió disparado de vuelta hacia el sur, dejando a Yesir solo, a pie, en medio de una tormenta que amenazaba con borrarle el color de la ropa, de las manos, quizás pronto del alma misma si no encontraba la manera de resguardarse a tiempo.", "i": false}]}, {"type": "p", "runs": [{"t": "Recordó, con las manos temblando de frío y de miedo, lo que Fresia le había enseñado la última noche en Alizar: que el color más fuerte que un Fijador podía invocar en un momento de desesperación no venía de ningún frasco, sino del propio miedo, transformado en algo útil en vez de paralizante.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Cerró los ojos, en medio de la lluvia gris, y en vez de huir del miedo que sentía —el miedo de morir ahí, solo, a leguas de Danira, sin haber siquiera llegado a intentar el rescate—, lo dejó subir entero, sin resistencia, hasta que sintió que le llenaba el pecho como un fuego frío.", "i": false}]}, {"type": "p", "runs": [{"t": "Y entonces, en vez de dejar que ese miedo lo paralizara, lo empujó hacia afuera, hacia las manos, convirtiéndolo, con una técnica que apenas había practicado una vez en el salón seguro del gremio, en un pigmento oscuro pero real: el color exacto del miedo transformado en decisión.", "i": false}]}, {"type": "p", "runs": [{"t": "Con ese pigmento, trazó un círculo a su alrededor sobre la roca del peñasco, un escudo improvisado que la lluvia gris, al tocarlo, no lograba atravesar del todo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "La tormenta duró toda la noche, y Yesir se mantuvo despierto cada minuto, renovando el círculo cada vez que sentía que empezaba a debilitarse, alimentándolo con cada pizca de determinación que lograba reunir, pensando en Danira, en la flor de ceniza que imaginaba floreciendo en algún rincón de Grisalda, en cada promesa que se habían hecho el uno al otro a lo largo de seis años de matrimonio.", "i": false}]}, {"type": "p", "runs": [{"t": "Al amanecer, cuando la lluvia gris por fin amainó, Yesir salió de su refugio improvisado, exhausto pero vivo, y descubrió que el círculo que había trazado con su propio miedo transformado había protegido, además de a él mismo, un pequeño parche de tierra a su alrededor: la única mancha de verde que quedaba visible en todo el paisaje gris que se extendía hasta el horizonte.", "i": false}]}, {"type": "p", "runs": [{"t": "—Sobreviví —dijo, en voz alta, con una risa que era, a la vez, alivio y asombro—. Sobreviví, y encima protegí algo más que a mí mismo.", "i": false}]}, {"type": "p", "runs": [{"t": "Encontró el caballo, temblando pero ileso, refugiado bajo un árbol cercano, y siguió camino a pie hasta recuperarlo, con una lección nueva grabada en el cuerpo entero: que el miedo, bien entendido, no era el enemigo del amor. Era, a veces, la prueba más clara de cuánto valía la pena lo que uno estaba a punto de perder.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "15-el-dia-mas-dificil.md", "num": "CAPÍTULO XV", "title": "EL DÍA MÁS DIFÍCIL", "body": [{"type": "p", "runs": [{"t": "Hubo un día, a mitad de su cautiverio, en que Danira estuvo más cerca de rendirse de lo que jamás le confesaría a nadie, ni siquiera a Yesir, cuando por fin volvieron a estar juntos.", "i": false}]}, {"type": "p", "runs": [{"t": "El Curador la visitó esa mañana, sin Nébrisa presente, con una sonrisa fría que Danira ya había aprendido a temer más que cualquier amenaza gritada.", "i": false}]}, {"type": "p", "runs": [{"t": "—Su esposo no va a llegar a tiempo —le dijo, con la calma de quien disfruta plantando dudas—. He enviado exploradores a vigilar los caminos. Un simple Fijador de aldea, sin entrenamiento real, enfrentando la Marea Gris entera, solo, a pie, sin ningún recurso más que la determinación. ¿Cuánto cree usted que dura eso, contra un continente entero decidido a apagarlo?", "i": false}]}, {"type": "p", "runs": [{"t": "Danira no respondió, negándose a darle la satisfacción de ver su miedo, pero esa noche, sola en su celda, con la flor de ceniza marchitándose un poco más de lo normal —porque hasta ella, tan resistente, empezaba a sentir el peso acumulado de semanas enteras de encierro—, las palabras del Curador se le clavaron más hondo de lo que hubiera querido admitir.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—¿Y si no llega? —se preguntó, en voz alta, por primera vez desde que la habían encerrado, permitiéndose la duda que llevaba semanas rechazando con pura fuerza de voluntad—. ¿Y si el continente entero lo apaga antes de que llegue hasta aquí?", "i": false}]}, {"type": "p", "runs": [{"t": "Se tocó la muñeca izquierda, buscando el Alba Doble, y por primera vez desde su captura, no lo sintió con la misma claridad de siempre. Estaba ahí, todavía, pero tan débil, tan apagado, que por un instante terrible Danira no pudo distinguir si era su propio miedo el que lo empañaba, o si de verdad algo, en algún punto lejano del camino, le había pasado a Yesir.", "i": false}]}, {"type": "p", "runs": [{"t": "Lloró esa noche, por primera vez desde su captura, sin ninguna contención, dejando que el miedo saliera entero en vez de guardarlo, tal como llevaba semanas guardando cada gota de su propio color.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Fue el joven Petrán quien la encontró así, esa misma noche, trayéndole el agua de la ronda habitual, y quien, contra todo protocolo que se suponía debía seguir, se quedó un momento más de lo permitido, mirándola llorar sin saber bien qué hacer.", "i": false}]}, {"type": "p", "runs": [{"t": "—No debería decirle esto —dijo, al fin, en voz baja—, pero lo vi. Al esposo. Hace tres días, en el camino, preguntando por el paso hacia el norte. Vivo. Decidido. Con una mirada que no tenía nada de derrotada.", "i": false}]}, {"type": "p", "runs": [{"t": "Danira levantó la vista, con una esperanza tan repentina que le dolió en el pecho más que el miedo mismo.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Está seguro?", "i": false}]}, {"type": "p", "runs": [{"t": "—Segurísimo. Nadie olvida una mirada así, mi señora. Es la mirada de alguien que ya decidió que no hay distancia capaz de detenerlo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Danira se secó las lágrimas, con una determinación que volvía a asentarse, poco a poco, en su pecho, y se giró hacia la flor de ceniza, tocándola con dedos todavía temblorosos.", "i": false}]}, {"type": "p", "runs": [{"t": "—Tenía razón —le dijo a la flor, como llevaba semanas hablándole—. Casi me rindo. Casi dejé que el miedo del Curador se convirtiera en mi propio miedo. Pero no. No más.", "i": false}]}, {"type": "p", "runs": [{"t": "Dejó salir, esa noche, un hilo de color más fuerte que ninguno desde su llegada, alimentando a la flor hasta que sus pétalos, marchitos por días de descuido involuntario, volvieron a abrirse con una vitalidad renovada.", "i": false}]}, {"type": "p", "runs": [{"t": "—Voy a seguir aquí —dijo, con la misma promesa de cada noche, pero esta vez con una convicción que ya no admitía ninguna duda—. Voy a seguir aquí, floreciendo, hasta que usted llegue, Yesir. No importa cuánto tarde. Voy a seguir aquí.", "i": false}]}, {"type": "p", "runs": [{"t": "Y en algún punto del camino, refugiado bajo un peñasco después de sobrevivir a una tormenta que casi lo destruye, Yesir, sin saber exactamente por qué, sintió que el Alba Doble bajo su propia piel se avivaba de golpe, con una fuerza nueva que le devolvió, justo cuando más lo necesitaba, la certeza de que todavía tenía a alguien esperándolo al final del camino.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "16-mientras-tanto-en-almagre.md", "num": "CAPÍTULO XVI", "title": "MIENTRAS TANTO, EN ALMAGRE", "body": [{"type": "p", "runs": [{"t": "En Almagre, mientras Yesir cruzaba tormentas y fronteras vigiladas, la vida del pueblo seguía un ritmo extraño: el trabajo diario continuaba, las cosechas se recogían, los niños seguían jugando en la plaza, pero bajo toda esa normalidad corría una corriente de espera silenciosa que nadie mencionaba en voz alta y que todos, sin excepción, sentían.", "i": false}]}, {"type": "p", "runs": [{"t": "La señora Olalla se había convertido, sin que nadie se lo pidiera formalmente, en la guardiana no oficial del mural del ayuntamiento, revisando cada mañana la esquina sur donde el gris todavía se resistía a sanar del todo, buscando cualquier señal —una pizca más de color, un brillo renovado— que le confirmara que, en algún punto lejano del mundo, Yesir seguía avanzando y Danira seguía resistiendo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Todavía tiene algo de color —le dijo una mañana a un grupo de vecinos que se había reunido, como cada semana, frente al mural—. No mucho. Pero algo. Mientras tenga algo, yo sigo teniendo esperanza.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El taller de Yesir y Danira permaneció cerrado, pero no abandonado: los vecinos se turnaban para mantenerlo limpio, para asegurarse de que los frascos de pigmento no se secaran, para que, si la pareja lograba volver algún día, encontraran su hogar exactamente como lo habían dejado, esperándolos con la misma fe con que todo el pueblo esperaba.", "i": false}]}, {"type": "p", "runs": [{"t": "Los niños que una vez habían perseguido a Yesir pidiéndole que les enseñara a mezclar colores organizaron, sin que ningún adulto se los pidiera, una especie de ritual propio: cada noche, antes de dormir, encendían una vela pequeña en la ventana de sus casas, un gesto simbólico que había empezado con uno solo de ellos y que, para cuando pasó el primer mes, se había extendido a todo Almagre, convirtiendo el pueblo entero, cada noche, en una constelación diminuta de luces esperando el regreso de dos de los suyos.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—¿Y si no vuelven? —le preguntó una niña a la señora Olalla, una noche, mirando la vela que ella misma había encendido en su ventana.", "i": false}]}, {"type": "p", "runs": [{"t": "La anciana se arrodilló junto a la niña, con esa paciencia que solo dan los años y el dolor acumulado con dignidad.", "i": false}]}, {"type": "p", "runs": [{"t": "—Van a volver —dijo, con una certeza que no admitía ninguna negociación—. Y te voy a decir por qué estoy tan segura, aunque no tenga ninguna prueba real más que la fe: porque un amor como el de ellos dos no se construye por accidente. Se construye, día a día, con miles de decisiones pequeñas de seguir eligiéndose el uno al otro. Y un amor construido así, mija, no se apaga fácil. No importa cuánta oscuridad se le ponga enfrente.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y si la oscuridad es más fuerte?", "i": false}]}, {"type": "p", "runs": [{"t": "—Entonces será la primera vez en la historia de Pigmalia que la oscuridad le gana a un amor de verdad. Y yo, que ya soy vieja y he visto pasar muchas historias por este pueblo, todavía no he visto que eso suceda ni una sola vez.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Nadie en Almagre sabía, esa noche ni ninguna de las siguientes, que a leguas y leguas de distancia, en ese mismo instante, la Luna sin Color ya empezaba a asomarse sobre las ruinas de Grisalda, y que el destino de todo lo que el pueblo esperaba con tanta fe estaba a punto de decidirse, para bien o para mal, antes de que amaneciera otra vez.", "i": false}]}, {"type": "p", "runs": [{"t": "Pero la fe de un pueblo entero, aunque no supiera nada de fechas ni de rituales, tenía su propia manera de viajar: cada vela encendida esa noche en cada ventana de Almagre ardió, sin que nadie pudiera explicarlo, un poco más brillante de lo normal, como si el amor acumulado de un pueblo entero pudiera, de alguna manera, cruzar la distancia y sumarse, aunque fuera en una gota diminuta, a la fuerza que Yesir y Danira necesitaban para lo que estaba por venir.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "17-la-morada-compartida.md", "num": "CAPÍTULO XVII", "title": "LA MORADA COMPARTIDA", "body": [{"type": "p", "runs": [{"t": "La noche antes de acercarse, por fin, a las murallas de Grisalda, Yesir acampó en un promontorio desde donde ya podía ver, a lo lejos, la silueta oscura del castillo recortada contra un cielo que ahí, tan cerca del corazón de la Marea Gris, ya no tenía ni rastro del Gran Lienzo: solo una nada plana, sin aurora, sin color, sin ninguna promesa de amanecer.", "i": false}]}, {"type": "p", "runs": [{"t": "Sintió miedo, esa noche, de una manera que no había sentido en todo el viaje. No miedo de morir —ese temor lo había hecho las paces hacía semanas—, sino miedo de llegar tarde, de fallar en el último tramo después de haber recorrido tanto, de que los siete días que Petrán le había prometido no fueran, al final, suficientes.", "i": false}]}, {"type": "p", "runs": [{"t": "Recordó entonces lo que Fresia le había enseñado, semanas atrás, en el salón lleno de frascos etiquetados de Alizar: que un recuerdo compartido, extraído con el cuerpo entero y no solo con la memoria, podía convertirse en algo más que pigmento. Podía convertirse en una Morada.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Cerró los ojos, y en vez de buscar un recuerdo cualquiera para fijar un muro o pagar un peaje, buscó el más grande de todos los que tenía: la noche de su Trenzado de Tintas, seis años atrás, en el patio del taller de Almagre, con todo el pueblo reunido y el Gran Lienzo entero brillando sobre sus cabezas como si también él quisiera presenciar la boda.", "i": false}]}, {"type": "p", "runs": [{"t": "Dejó que el recuerdo le subiera por dentro, no solo con la cabeza sino con el cuerpo entero, tal como Fresia le había enseñado, y sintió, con una claridad que le cortó el aliento, cómo el mundo a su alrededor empezaba a cambiar.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El promontorio gris desapareció. En su lugar, Yesir se encontró de pie en el patio de Almagre, seis años atrás, rodeado de vecinos vestidos de fiesta, con el olor a azahar y a vino especiado llenándole la nariz, y frente a él, tan real que podría haberla tocado, estaba Danira, vestida de novia, con el pelo suelto y una sonrisa que él llevaba seis años guardando en algún rincón de la memoria sin haberla vuelto a ver con tanta claridad como en ese instante.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Yesir? —dijo ella, con una voz que sonaba exactamente como debía sonar, aunque él sabía, en algún nivel que no interfería con la belleza del momento, que esto no era Danira de verdad, sino la Danira de ese recuerdo específico, congelada para siempre en la felicidad de esa noche—. ¿Está listo?", "i": false}]}, {"type": "p", "runs": [{"t": "—Estoy listo —dijo él, y sintió que la voz se le quebraba—. Estuve listo entonces, y sigo listo ahora, seis años después, cruzando un continente entero para volver a encontrarla.", "i": false}]}, {"type": "p", "runs": [{"t": "La Danira del recuerdo lo miró con una ternura que no comprendía del todo las palabras que él acababa de decir, porque en ese momento congelado de hacía seis años no había ninguna Marea Gris, ningún Curador, ningún castillo de piedra esperando al norte. Solo había una boda, y dos jóvenes trenzando sus colores por primera vez, confiados en que el amor que sentían iba a ser suficiente para lo que fuera que la vida les pusiera por delante.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Trenzaron las Tintas otra vez, dentro del recuerdo, exactamente como lo habían hecho la primera vez, y cuando el Alba Doble estalló entre sus manos unidas —brillante, nuevo, imposible—, Yesir sintió que algo en su propio pecho, en el mundo real, fuera de esa Morada, se avivaba también, como si el recuerdo entero le estuviera devolviendo, aunque fuera por un instante, parte de la fuerza que el viaje le había ido costando.", "i": false}]}, {"type": "p", "runs": [{"t": "—Vaya a buscarla —le dijo la Danira del recuerdo, con una sabiduría que no le pertenecía del todo a ella sino, quizás, a alguna parte de Yesir mismo que necesitaba escuchar esas palabras dichas con esa voz—. La Danira de verdad lo está esperando, y no en un recuerdo. En el mundo, ahora mismo, viva, luchando, tan enamorada de usted como la que tiene delante.", "i": false}]}, {"type": "p", "runs": [{"t": "—Lo sé.", "i": false}]}, {"type": "p", "runs": [{"t": "—Entonces deje de mirar hacia atrás, aunque sea hermoso, y vaya a buscarla hacia adelante.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Yesir abrió los ojos, de vuelta en el promontorio gris, con la fogata casi apagada y el castillo de Grisalda todavía recortado contra la nada del horizonte.", "i": false}]}, {"type": "p", "runs": [{"t": "Pero algo había cambiado. Se tocó la muñeca izquierda, y el Alba Doble, por primera vez en semanas, brilló un instante con una intensidad que le recordó, con dolor y con esperanza a partes iguales, la noche misma de su boda.", "i": false}]}, {"type": "p", "runs": [{"t": "—Voy —dijo, en voz alta, a la noche entera, al castillo, a Danira, a sí mismo—. Voy, y esta vez ninguna Marea Gris me va a detener antes de llegar.", "i": false}]}, {"type": "p", "runs": [{"t": "Se acostó a dormir las pocas horas que le quedaban antes del amanecer, con una determinación tan firme como el Alba Doble mismo, sabiendo que al día siguiente, por fin, después de semanas de camino, iba a estar lo bastante cerca de Grisalda como para empezar la parte más peligrosa de todo el viaje.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "end-marker", "text": "FIN DE LA SEGUNDA PARTE"}, {"type": "ornament", "text": "✧ ✦ ✧"}]}]}, {"id": "tercera", "theme": "alba", "label": "Tercera Parte", "subtitle": "EL ALBA DOBLE", "chapters": [{"file": "18-la-infiltracion.md", "num": "CAPÍTULO XVIII", "title": "LA INFILTRACIÓN", "body": [{"type": "p", "runs": [{"t": "El pasadizo de servicio olía a agua estancada y a piedra húmeda, y Yesir tuvo que agacharse casi todo el trayecto para no golpearse la cabeza contra el techo bajo, con el corazón latiéndole tan fuerte que temía, absurdamente, que el sonido mismo pudiera delatarlo antes que cualquier error de sigilo.", "i": false}]}, {"type": "p", "runs": [{"t": "Petrán lo esperaba justo donde había prometido, con el capuchón calado y una antorcha apagada en la mano, para no llamar la atención de ninguna otra guardia que pudiera cruzarse en el camino.", "i": false}]}, {"type": "p", "runs": [{"t": "—Llegó justo a tiempo —susurró—. Mañana al anochecer es la Luna sin Color. Hoy es el último día que tiene para actuar antes de que la lleven al lugar del ritual.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Dónde está?", "i": false}]}, {"type": "p", "runs": [{"t": "—Todavía en su celda, en la torre. Pero mañana, antes de la ceremonia, la van a bajar a la Cámara de la Luna, en el sótano más profundo del castillo. Si quiere sacarla antes de que llegue ahí, esta noche es su única oportunidad.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Subieron por una escalera de servicio estrecha, deteniéndose cada tanto para dejar pasar el eco de pasos lejanos, hasta que llegaron a un corredor que Yesir reconoció, sin haberlo visto nunca, solo por la descripción que Petrán le había dado semanas atrás junto al camino: la torre más alta, la celda sin barrotes que no los necesitaba.", "i": false}]}, {"type": "p", "runs": [{"t": "—De aquí en adelante, tengo que quedarme atrás —dijo Petrán, deteniéndose frente a una puerta de madera gruesa—. Si me ven acompañándolo más allá de este punto, los dos estamos perdidos. Pero la puerta no tiene cerradura por dentro. Solo tiene que empujarla.", "i": false}]}, {"type": "p", "runs": [{"t": "—Gracias, Petrán. De verdad.", "i": false}]}, {"type": "p", "runs": [{"t": "—Agradézcamelo después, cuando los dos estén libres. Ahora vaya.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Yesir empujó la puerta con manos temblorosas, y ahí, en el centro de una celda de piedra gris, arrodillada junto a una ventana estrecha, protegiendo con las manos ahuecadas una flor violeta diminuta, estaba Danira.", "i": false}]}, {"type": "p", "runs": [{"t": "Ella levantó la vista al oír la puerta, con una alarma instintiva que se transformó, en el instante mismo en que reconoció la silueta en el umbral, en algo que no tenía nombre suficientemente grande: incredulidad, alivio, un amor tan intenso que pareció, por un segundo, doblarla sobre sí misma.", "i": false}]}, {"type": "p", "runs": [{"t": "—Yesir.", "i": false}]}, {"type": "p", "runs": [{"t": "No dijo nada más. Cruzó la celda en tres pasos y se lanzó a sus brazos con una fuerza que lo hizo tambalear, y él la abrazó con la misma intensidad, sintiendo, contra su propio pecho, el latido de un corazón que llevaba semanas escuchando solo bajo la piel de su propia muñeca, ahora, por fin, escuchándolo de verdad, entero, real, vivo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Está aquí —murmuró ella, contra su hombro, con la voz quebrada—. De verdad está aquí. No es un sueño ni una Morada ni ningún truco de este castillo horrible. Está aquí.", "i": false}]}, {"type": "p", "runs": [{"t": "—Estoy aquí —confirmó él, sin poder soltarla—. Vine a buscarla, Danira. Le dije que iba a venir, y aquí estoy.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Se quedaron abrazados un largo momento, más largo de lo que la prudencia debería haber permitido, antes de que Yesir, con esfuerzo, se separara lo suficiente para mirarla de frente.", "i": false}]}, {"type": "p", "runs": [{"t": "—Tenemos que irnos. Ahora. Petrán dice que mañana la van a bajar a la Cámara de la Luna para el ritual.", "i": false}]}, {"type": "p", "runs": [{"t": "Danira asintió, pero algo en su expresión hizo que Yesir se detuviera.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Qué pasa?", "i": false}]}, {"type": "p", "runs": [{"t": "—Hay algo que tengo que contarle, y no sé si va a tener tiempo de sorprenderse antes de que tengamos que correr. —Se giró hacia la flor violeta que había estado cuidando, y la tocó una última vez, con una ternura que era casi una despedida—. Hablé con Nébrisa. Varias veces, estas últimas semanas. No creo que ella quiera de verdad lo que el Curador le ha prometido. Creo que, en el fondo, ella misma no sabe si de verdad cree que un ritual puede devolverle a su esposo.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y eso qué significa para nosotros?", "i": false}]}, {"type": "p", "runs": [{"t": "—Significa que quizás no tengamos que escapar en silencio, Yesir. Significa que quizás, si hacemos las cosas bien, podamos salir de aquí sin tener que escondernos el resto de nuestras vidas, mirando siempre hacia atrás por si Grisalda vuelve a perseguirnos.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Un ruido de pasos, más cerca de lo que ninguno de los dos hubiera querido, los interrumpió antes de que pudieran seguir hablando. Danira apagó de un soplido la vela que iluminaba la celda, y los dos se quedaron inmóviles en la oscuridad, con las manos entrelazadas, escuchando el eco de botas sobre piedra que se acercaba por el corredor.", "i": false}]}, {"type": "p", "runs": [{"t": "—Van a hacer la ronda nocturna —susurró Danira, casi sin voz—. Todas las noches, a esta hora.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Qué hacemos?", "i": false}]}, {"type": "p", "runs": [{"t": "Ella lo miró en la penumbra, con una determinación que Yesir reconoció como la misma que la había hecho entregarse a los Recolectores meses atrás para salvar Almagre: la determinación de alguien que prefiere el riesgo calculado a la espera pasiva.", "i": false}]}, {"type": "p", "runs": [{"t": "—Confiamos —dijo—. Y esperamos a que pase la ronda. Y entonces, Yesir, en vez de escapar como ladrones en la noche, vamos a hacer algo mucho más valiente. Vamos a esperar a mañana, a la Luna sin Color, y vamos a enfrentar esto de frente, delante de Nébrisa y de todo su castillo, en vez de escondernos de un miedo que ya hemos cargado demasiado tiempo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "19-la-luna-sin-color.md", "num": "CAPÍTULO XIX", "title": "LA LUNA SIN COLOR", "body": [{"type": "p", "runs": [{"t": "Petrán escondió a Yesir durante todo el día siguiente en un almacén de suministros olvidado, cerca de la Cámara de la Luna, con la promesa de avisarle en el instante mismo en que el ritual estuviera a punto de comenzar.", "i": false}]}, {"type": "p", "runs": [{"t": "—No va a ser fácil llegar hasta ahí sin que lo vean —le advirtió, al dejarlo—. La cámara va a estar llena de Recolectores esta noche. Todo Grisalda que todavía tiene fuerzas para caminar va a estar presente.", "i": false}]}, {"type": "p", "runs": [{"t": "—Voy a encontrar la manera.", "i": false}]}, {"type": "p", "runs": [{"t": "—Lo sé. Pero recuerde lo que le enseñaron en Alizar. Cuando llegue el momento, el color más fuerte que puede usar no va a ser ninguno que traiga en un frasco.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir asintió, sin entender del todo, todavía, cuánta razón tenía Petrán en esa advertencia.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Al anochecer, cuando el poco cielo gris que quedaba visible desde la ventana del almacén empezó a oscurecerse hacia una noche todavía más profunda —la Luna sin Color, que no era una luna ausente sino una luna que había perdido, hacía generaciones, cualquier tinte propio, dejando solo un disco pálido y sin vida flotando sobre el mundo—, Petrán regresó, sin aliento, con el capuchón caído hacia atrás por la prisa.", "i": false}]}, {"type": "p", "runs": [{"t": "—Ya la bajaron. Ahora o nunca.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "La Cámara de la Luna era un espacio circular, tallado directamente en la roca gris bajo el castillo, iluminado por antorchas cuyo fuego, incluso él, parecía haber perdido todo rastro de color, ardiendo en un naranja tan pálido que apenas merecía llamarse fuego.", "i": false}]}, {"type": "p", "runs": [{"t": "En el centro, sobre un altar de piedra pulida, estaba Danira, con los brazos extendidos y sujetos por cadenas que no parecían de metal sino de algo más antiguo, tejidas de la misma ceniza gris que todo lo demás en ese lugar. A su alrededor, en un círculo apretado, decenas de Recolectores esperaban en silencio, y al frente de todos, con una túnica ceremonial que la hacía parecer aún más pequeña de lo que era, estaba Nébrisa.", "i": false}]}, {"type": "p", "runs": [{"t": "El Curador se movía entre ellos, dirigiendo los últimos preparativos con la eficiencia fría de quien ha esperado ese momento durante quince años enteros.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Yesir se abrió paso hasta el borde de la cámara, oculto entre las sombras de una columna, y vio, con el corazón en la garganta, cómo el Curador alzaba las manos sobre Danira, empezando a entonar palabras en un idioma que Yesir no reconocía, antiguo y áspero, que parecía extraer color del aire mismo alrededor del altar.", "i": false}]}, {"type": "p", "runs": [{"t": "Danira, encadenada, no gritaba ni suplicaba. Mantenía la vista fija en algún punto del techo de piedra, con los labios moviéndose apenas, y Yesir, entrenado ya para escuchar lo que la mayoría no escuchaba, entendió que estaba repitiendo, en silencio, su propio nombre, una y otra vez, como un ancla contra lo que fuera que ese ritual pretendía arrancarle.", "i": false}]}, {"type": "p", "runs": [{"t": "—Nébrisa —dijo el Curador, con una voz que resonaba en toda la cámara—, el momento ha llegado. Extienda la mano sobre la Manantial, y reclame lo que le pertenece.", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa dio un paso adelante, con la mano temblando, y se detuvo justo antes de tocar a Danira.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—Espere —dijo, con una voz que sorprendió a todos en la cámara, incluido el Curador—. Antes de hacer esto, necesito saber algo. ¿Está usted completamente seguro, Curador, de que esto va a traer de vuelta a mi esposo?", "i": false}]}, {"type": "p", "runs": [{"t": "—Mi señora, hemos hablado de esto muchas veces...", "i": false}]}, {"type": "p", "runs": [{"t": "—Respóndame directamente. Delante de todos. ¿Está seguro?", "i": false}]}, {"type": "p", "runs": [{"t": "El Curador se quedó callado un instante de más, un instante que en cualquier otra circunstancia habría pasado desapercibido, pero que en el silencio absoluto de esa cámara resonó como una confesión completa.", "i": false}]}, {"type": "p", "runs": [{"t": "—Ningún ritual puede garantizar la resurrección de los muertos, mi señora —dijo, al fin, con una frialdad que ya no se molestaba en disimular del todo—. Pero el poder que ganaríamos con el alma-color de una Manantial completa sería suficiente para reconstruir Grisalda entera, para devolverle a usted todo lo que perdió, aunque no sea exactamente de la forma en que usted lo imagina.", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa retrocedió un paso, con la mano todavía extendida a medio camino, mientras algo se le rompía en la cara: quince años de esperanza cuidadosamente alimentada, desmoronándose de golpe frente a toda su corte.", "i": false}]}, {"type": "p", "runs": [{"t": "—Me mintió.", "i": false}]}, {"type": "p", "runs": [{"t": "—Le di algo por lo cual seguir adelante, mi señora. Que no es lo mismo que mentir, aunque usted, en su dolor, no haya querido nunca ver la diferencia.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Fue en ese instante exacto de confusión y traición revelada que Yesir salió de las sombras, cruzando la cámara a grandes zancadas, sin importarle ya el sigilo, con una sola cosa en la mente.", "i": false}]}, {"type": "p", "runs": [{"t": "—¡Danira!", "i": false}]}, {"type": "p", "runs": [{"t": "Los Recolectores más cercanos se giraron, alarmados, y varios avanzaron para interceptarlo, pero Yesir, con una determinación que ni él mismo sabía que tenía hasta ese instante, alzó las manos y dejó salir, de golpe, todo el pigmento de Alba Doble que había guardado desde la Morada Compartida —el color extraído del recuerdo más grande de toda su vida—, creando una barrera de luz violeta-ámbar tan intensa que los Recolectores más cercanos retrocedieron, cegados momentáneamente por algo que sus ojos, acostumbrados solo al gris, ya no sabían cómo procesar.", "i": false}]}, {"type": "p", "runs": [{"t": "—¡Yesir! —gritó Danira, desde el altar, con una alegría feroz atravesando el miedo—. ¡Aquí!", "i": false}]}, {"type": "p", "runs": [{"t": "Y el Curador, viendo desmoronarse en un instante quince años de manipulación cuidadosa, se giró hacia el intruso con una furia fría que prometía que esa noche, todavía, estaba lejos de terminar.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "20-el-rescate-desde-adentro.md", "num": "CAPÍTULO XX", "title": "EL RESCATE DESDE ADENTRO", "body": [{"type": "p", "runs": [{"t": "—¡Deténganlo! —gritó el Curador, y una docena de Recolectores convergieron sobre Yesir a la vez.", "i": false}]}, {"type": "p", "runs": [{"t": "Pero Yesir no había llegado hasta ahí, cruzando un continente entero, para dejarse detener en el último tramo. Con las manos todavía brillantes del pigmento que había liberado, tocó al primer Recolector que se le acercó y, en vez de atacarlo, hizo algo que ninguno de los presentes esperaba: le devolvió el color.", "i": false}]}, {"type": "p", "runs": [{"t": "Un hilo delgado de dorado —coraje, el color que siempre había sido, desde niño, su propia manera de entender la valentía— le subió por el brazo al Recolector, y el hombre se detuvo en seco, parpadeando, como si algo dentro de él, apagado durante años bajo el uniforme gris, hubiera despertado de golpe.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Qué…? —murmuró el Recolector, mirándose las manos con una confusión genuina.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir no se detuvo a explicar. Siguió avanzando hacia el altar, esquivando a los que todavía intentaban detenerlo, tocando a cada uno que se cruzaba en su camino con un hilo pequeño de color, no como arma sino como regalo, sembrando confusión y algo parecido a la esperanza en un ejército entero que llevaba años sin sentir nada más que el gris.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Llegó al altar, y con un movimiento decidido, tocó las cadenas de ceniza que sujetaban las muñecas de Danira, dejando fluir a través de sus dedos toda la fuerza de Fijador que llevaba entrenando desde niño: no para crear algo nuevo, sino para deshacer, con la misma firmeza con que anclaba un color, aquello que nunca debió haber existido en primer lugar.", "i": false}]}, {"type": "p", "runs": [{"t": "Las cadenas se desmoronaron en polvo gris, cayendo al suelo como ceniza vieja.", "i": false}]}, {"type": "p", "runs": [{"t": "—Yesir —dijo Danira, liberando los brazos y llevándose las manos a la cara de él, tocándolo como quien necesita confirmar, con el tacto y no solo con la vista, que algo tan deseado durante tanto tiempo es finalmente real—. Lo logró.", "i": false}]}, {"type": "p", "runs": [{"t": "—Todavía no del todo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El Curador avanzó hacia ellos, con una expresión que ya no ocultaba nada de su verdadera naturaleza: una codicia fría, sin ningún disfraz de convicción noble que ya le sirviera de algo delante de una corte que acababa de descubrir la mentira.", "i": false}]}, {"type": "p", "runs": [{"t": "—No van a salir de aquí con vida, ninguno de los dos —dijo, alzando las manos, y de sus dedos empezó a brotar un gris tan denso, tan hambriento, que Yesir sintió, incluso a distancia, el mismo frío helado que Danira había sentido la mañana en que llegaron las polillas—. Quince años de trabajo no se los voy a entregar a un par de campesinos enamorados.", "i": false}]}, {"type": "p", "runs": [{"t": "—Nunca fue trabajo suyo, Curador —dijo Danira, poniéndose de pie junto a Yesir, con la determinación intacta a pesar de las semanas de cautiverio—. Fue siempre el duelo de otra persona, que usted usó sin ningún escrúpulo para conseguir lo que quería.", "i": false}]}, {"type": "p", "runs": [{"t": "—El duelo, la codicia, el poder… al final da igual el nombre que le pongan. El resultado es el mismo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El gris avanzó hacia ellos como una marea física, y Yesir, instintivamente, tomó la mano de Danira, entrelazando sus dedos como lo había hecho tantas veces, en tantas mañanas tranquilas de Almagre que ahora parecían pertenecer a otra vida.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Se acuerda del voto? —le preguntó, con la marea gris a apenas unos pasos.", "i": false}]}, {"type": "p", "runs": [{"t": "Danira asintió, con lágrimas en los ojos que brillaban, extrañamente, con un color propio en medio de tanto gris.", "i": false}]}, {"type": "p", "runs": [{"t": "—Que mi color se quede en el tuyo —empezó ella, con voz firme a pesar del peligro inminente.", "i": false}]}, {"type": "p", "runs": [{"t": "—Y el tuyo en el mío —continuó Yesir—, hasta que ya no sepamos distinguir de quién era cada cual.", "i": false}]}, {"type": "p", "runs": [{"t": "Alzaron las manos entrelazadas hacia el gris que avanzaba, y en el instante justo en que la marea estaba a punto de tocarlos, el Alba Doble —el mismo color que había brillado tenue bajo la piel de Yesir durante semanas enteras de viaje, alimentado por cada susurro nocturno, cada recuerdo pagado, cada Morada revivida— estalló entre sus manos con una luz que no tenía comparación posible con nada que la Cámara de la Luna hubiera visto jamás.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "21-el-estallido-del-alba-doble.md", "num": "CAPÍTULO XXI", "title": "EL ESTALLIDO DEL ALBA DOBLE", "body": [{"type": "p", "runs": [{"t": "La luz llenó la Cámara de la Luna entera, un violeta-ámbar tan vivo que parecía tener pulso propio, y donde tocaba la marea gris del Curador, esta se deshacía, no con violencia sino con algo más parecido a un derretimiento: el gris cediendo ante un color que no había sido robado a nadie, que no dependía de ninguna cosecha ni de ningún sacrificio ajeno, sino que nacía, entero y renovado, del amor mismo entre dos personas que se negaban a dejar de elegirse la una a la otra.", "i": false}]}, {"type": "p", "runs": [{"t": "El Curador retrocedió, con las manos alzadas contra la luz, y por primera vez desde que Yesir lo había visto, una expresión de miedo genuino le cruzó la cara pálida.", "i": false}]}, {"type": "p", "runs": [{"t": "—Esto no es posible —dijo, con la voz quebrada—. Ningún color debería ser tan fuerte. Ningún vínculo debería resistir tanto tiempo separado sin apagarse.", "i": false}]}, {"type": "p", "runs": [{"t": "—Es que usted nunca entendió la diferencia —dijo Danira, con la voz firme, avanzando junto a Yesir hacia el corazón mismo de la luz—. Usted cosechaba color prestado, color robado, color que siempre estaba a punto de acabarse porque nunca fue realmente suyo. El nuestro no se acaba, Curador, porque no lo sacamos de ningún frasco ni de ninguna víctima. Lo hacemos nosotros mismos, cada día, con cada elección de seguir queriéndonos.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El Alba Doble siguió creciendo, expandiéndose más allá de las manos entrelazadas de Yesir y Danira, llenando la cámara entera, y donde tocaba a los Recolectores presentes —los mismos que apenas minutos antes habían intentado detener a Yesir— algo despertaba: un resto de color propio, apagado durante años bajo el gris de Grisalda, volvía a la superficie de sus pieles, tímido al principio, después más firme, hasta que la cámara entera se llenó de un mosaico de colores individuales, cada uno distinto, cada uno vivo, recordando de golpe lo que se sentía tener una Tinta de Alma propia en vez de solo el gris uniforme de la supervivencia.", "i": false}]}, {"type": "p", "runs": [{"t": "El Curador, rodeado de una luz que ya no podía combatir, retrocedió hasta chocar contra el altar de piedra vacío, y en un último gesto de desesperación, intentó lanzar contra Yesir y Danira todo el gris que le quedaba, concentrado en un solo golpe final.", "i": false}]}, {"type": "p", "runs": [{"t": "Pero el Alba Doble, alimentado ahora no solo por el amor de los dos esposos sino por el color recién despertado de cada Recolector presente en la sala —un coro entero de pequeñas Tintas de Alma que habían olvidado, hasta ese instante, que todavía las tenían—, absorbió el golpe sin ceder ni un ápice, y lo devolvió multiplicado, envolviendo al Curador en una luz que no lo destruyó, pero que sí lo despojó, de una vez y para siempre, de cualquier poder robado que hubiera acumulado en quince años de manipulación.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Cuando la luz por fin empezó a menguar, el Curador yacía en el suelo, consciente pero vacío, sin ningún gris que comandar, sin ningún color propio que reclamar —porque nunca había tenido uno, entendió Yesir en ese instante, mirándolo con más lástima que odio: el Curador había pasado tanto tiempo robando color ajeno que había olvidado, si es que alguna vez lo había sabido, cómo generar el suyo propio.", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa, que había presenciado todo el enfrentamiento desde el borde de la cámara, sin moverse, con lágrimas cayéndole por la cara —lágrimas que, Yesir notó con asombro, empezaban a brillar con un tenue color propio, el primer color que Nébrisa producía en quince años—, dio un paso adelante, hacia el hombre que la había manipulado durante tanto tiempo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Llévenselo a las celdas —ordenó, con una voz que ya no temblaba de duda sino de una claridad recién recuperada—. Y que alguien empiece a evaluar qué queda de este castillo que todavía se pueda salvar de verdad, en vez de robar.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Se giró hacia Yesir y Danira, todavía tomados de la mano, con el Alba Doble apagándose despacio hasta volver a ser solo la línea fina bajo la piel de sus muñecas, aunque ahora, Yesir lo sintió con claridad, más brillante que nunca antes en los seis años de su matrimonio.", "i": false}]}, {"type": "p", "runs": [{"t": "—Ustedes dos —dijo Nébrisa, con una voz que mezclaba vergüenza y algo parecido, por primera vez en quince años, a la esperanza genuina—. Acaban de mostrarme algo que había olvidado que existía. No sé si voy a poder perdonarme nunca del todo por lo que estuve a punto de hacerles. Pero les debo, por lo menos, la oportunidad de intentar reparar una fracción de todo el daño.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Qué está diciendo? —preguntó Danira, con cautela.", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa miró hacia la ventana estrecha de la cámara, hacia el cielo gris que todavía cubría todo Grisalda, y por primera vez en quince años, algo parecido a una decisión —no impuesta por el Curador, no nacida del duelo ciego, sino elegida de verdad, con los ojos abiertos— le cruzó la cara.", "i": false}]}, {"type": "p", "runs": [{"t": "—Estoy diciendo que ya es hora de que Grisalda deje de cosechar el color de otros, y empiece, por fin, a aprender a hacer las paces con el propio.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "22-el-duelo-de-nebrisa.md", "num": "CAPÍTULO XXII", "title": "EL DUELO DE NÉBRISA", "body": [{"type": "p", "runs": [{"t": "Esa misma noche, mucho después de que los Recolectores hubieran llevado al Curador a las celdas y de que la Cámara de la Luna hubiera quedado, por fin, en un silencio que ya no era el silencio gris de siempre sino algo más parecido a la calma después de una tormenta, Nébrisa buscó a Danira y a Yesir en las habitaciones que les habían asignado, en lo que quedaba, todavía apagado pero ya no hostil, del castillo de Grisalda.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Puedo hablar con ustedes? —preguntó, desde la puerta, con una vulnerabilidad que no tenía nada que ver con la Custodia fría que había gobernado ese dominio durante quince años—. A solas, si es posible.", "i": false}]}, {"type": "p", "runs": [{"t": "Danira asintió, y Yesir, después de un instante de duda, decidió confiar en la mujer que apenas horas antes había estado a punto de arrebatarle a su esposa la capacidad de amar, y salió a esperar en el corredor, dejándolas solas.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—Quince años —dijo Nébrisa, sentándose frente a Danira, con las manos entrelazadas sobre el regazo—. Quince años cargando un duelo que nunca dejé terminar de verdad, porque terminarlo se sentía, de alguna manera retorcida, como dejar de querer al Amaranto. Como si el dolor fuera la única prueba que me quedaba de que lo había amado tanto como creía.", "i": false}]}, {"type": "p", "runs": [{"t": "—El dolor no es la única prueba de amor, Nébrisa. A veces es, simplemente, lo que queda cuando uno se niega a soltar, aunque soltar sea exactamente lo que hace falta para volver a vivir.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Cómo lo sabe usted?", "i": false}]}, {"type": "p", "runs": [{"t": "Danira sonrió, con una tristeza suave.", "i": false}]}, {"type": "p", "runs": [{"t": "—Porque casi lo pierdo a él esta noche, y en esas horas de espera, encadenada a ese altar, entendí algo que quizás me tomó toda una vida de matrimonio aprender: que amar de verdad a alguien no es aferrarse a lo que ya se fue, sino seguir eligiendo, cada día, a quien todavía está. Usted dejó de elegir a la vida, Nébrisa, el día que el Amaranto murió. Y ese duelo tan grande, tan real, terminó vaciando de color no solo su propio corazón, sino un dominio entero de gente que no tuvo nada que ver con su pérdida.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Nébrisa se quedó callada un largo rato, con la vista perdida en algún punto de la pared gris, hasta que, sin previo aviso, las lágrimas empezaron a caerle por la cara, esta vez sin ninguna contención, sin ningún intento de disimularlas delante de nadie.", "i": false}]}, {"type": "p", "runs": [{"t": "Y por primera vez en quince años, esas lágrimas tenían color: un dorado-esmeralda tenue, apenas visible, pero real, cayendo por sus mejillas como pequeñas gotas de luz que Grisalda entera llevaba una generación esperando ver de nuevo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Estoy llorando en colores —dijo Nébrisa, con una risa quebrada que no sabía si era de dolor o de alivio—. Llevaba quince años sin poder llorar del todo. El duelo me lo había robado, junto con todo lo demás.", "i": false}]}, {"type": "p", "runs": [{"t": "—Está sanando —dijo Danira, tomándole las manos—. No de golpe, no del todo, pero está sanando. Y eso, Nébrisa, es lo único que el Amaranto habría querido de verdad para usted, si de verdad la amaba tanto como cuentan las historias.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—Voy a necesitar tiempo —dijo Nébrisa, al fin, secándose las lágrimas doradas con el dorso de la mano, mirándose los dedos con un asombro genuino ante el color que dejaban—. Tiempo para aprender a vivir sin él sin que eso signifique dejar de haberlo amado. Tiempo para reconstruir este dominio sin depender de ninguna cosecha ajena.", "i": false}]}, {"type": "p", "runs": [{"t": "—Va a tenerlo —dijo Yesir, entrando de nuevo a la habitación, habiendo escuchado lo suficiente desde el corredor como para sentirse invitado a sumarse—. Y si hace falta, Alizar tiene Restauradores dispuestos a enseñar. Yo mismo aprendí ahí, en semanas, lo que a otros les toma años. No hay ninguna razón para que Grisalda no pueda hacer lo mismo, empezando de nuevo, esta vez sin ningún Curador manipulando el proceso.", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa los miró a ambos, con una gratitud que todavía no sabía del todo cómo expresar después de tanto tiempo sin practicarla.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Por qué me ayudan? Estuve a punto de destruir su matrimonio para siempre.", "i": false}]}, {"type": "p", "runs": [{"t": "—Porque el amor de verdad, Nébrisa —dijo Danira, con una convicción tranquila—, no se mide solo en lo bien que a uno le va. Se mide, también, en cuánta generosidad le queda a uno después de haber estado a punto de perderlo todo. Y nosotros, esta noche, tenemos generosidad de sobra.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "23-petran.md", "num": "CAPÍTULO XXIII", "title": "PETRÁN", "body": [{"type": "p", "runs": [{"t": "En medio de toda la conmoción que siguió al estallido del Alba Doble —el Curador llevado a las celdas, Nébrisa asumiendo el control de un castillo que apenas empezaba a entender cómo reconstruir, los Recolectores desperdigados en un silencio confundido, redescubriendo colores propios que muchos ni siquiera recordaban tener—, Yesir buscó a Petrán entre la multitud, sin encontrarlo por ninguna parte.", "i": false}]}, {"type": "p", "runs": [{"t": "Lo halló, finalmente, escondido en el mismo almacén de suministros donde se había ocultado antes del ritual, sentado en el suelo, con las rodillas contra el pecho y una expresión de miedo que no tenía nada que ver con el alivio que debería haber sentido.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Petrán? —Yesir se agachó junto a él—. ¿Está bien?", "i": false}]}, {"type": "p", "runs": [{"t": "—Ayudé al enemigo, señor. A ojos de todo Grisalda, yo ayudé a que un extraño se infiltrara en el castillo. No importa que el Curador fuera el verdadero villano. A los ojos de mis compañeros, yo soy un traidor.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Yesir se sentó junto a él, entendiendo, por primera vez con claridad, el peso enorme que Petrán había cargado sin queja durante todo el tiempo que lo había ayudado.", "i": false}]}, {"type": "p", "runs": [{"t": "—Va a venir conmigo a hablar con Nébrisa —dijo—. Ahora mismo, antes de que el miedo lo convenza de esconderse para siempre.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y si me castiga?", "i": false}]}, {"type": "p", "runs": [{"t": "—Entonces yo mismo voy a hablar por usted, delante de todo Grisalda si hace falta. No pienso dejar que la única persona que me ayudó a cruzar ese castillo sin ayuda cargue sola con las consecuencias de haber hecho lo correcto.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Encontraron a Nébrisa en el mismo salón donde, apenas unas horas antes, había recibido la noticia devastadora sobre las verdaderas intenciones del Curador, y Petrán, con la cabeza baja, se arrodilló frente a ella sin esperar a que Yesir dijera una sola palabra.", "i": false}]}, {"type": "p", "runs": [{"t": "—Mi señora, merezco cualquier castigo que decida imponerme. Desobedecí órdenes directas. Ayudé a un intruso a entrar al castillo. Pero le juro que lo hice porque ya no podía, en conciencia, seguir siendo parte de algo que sabía que estaba mal.", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa lo estudió un largo momento, con una expresión que Yesir no logró leer del todo, hasta que, para sorpresa de todos los presentes, se arrodilló ella misma, a la altura del muchacho, con una humildad que ningún Custodio de Grisalda había mostrado en generaciones.", "i": false}]}, {"type": "p", "runs": [{"t": "—Petrán —dijo—, no vine aquí a castigarlo. Vine a agradecerle. Usted tuvo el valor de hacer, con dieciocho años y sin ningún poder real, lo que a mí me tomó quince años de duelo ciego lograr entender: que la lealtad de verdad no es obedecer sin pensar, sino elegir el bien, aunque cueste todo lo que uno tiene.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—¿Entonces no estoy en problemas?", "i": false}]}, {"type": "p", "runs": [{"t": "—Está, si acaso, en deuda con todo Grisalda por haber mostrado el camino que el resto de nosotros tardamos demasiado en ver. —Nébrisa se puso de pie, con una decisión nueva iluminándole la cara—. Quiero que se convierta en mi mano derecha en la reconstrucción de este dominio. No como castigo ni como favor, sino porque necesitamos, más que nada, gente con el valor de mirar hacia otro lado cuando el sistema entero está equivocado, y usted acaba de demostrar que lo tiene de sobra.", "i": false}]}, {"type": "p", "runs": [{"t": "Petrán se quedó sin palabras, con los ojos húmedos, y Yesir, viéndolo recibir un reconocimiento que apenas horas atrás parecía imposible, sintió una gratitud profunda hacia ese muchacho que, sin ningún beneficio propio evidente, había arriesgado todo lo que tenía por la simple certeza de que el amor de dos desconocidos merecía una oportunidad de sobrevivir.", "i": false}]}, {"type": "p", "runs": [{"t": "—Gracias, Petrán —dijo, tendiéndole la mano—. De verdad. Nada de esto habría sido posible sin usted.", "i": false}]}, {"type": "p", "runs": [{"t": "—Gracias a ustedes, señor —respondió el muchacho, con una sonrisa que empezaba, por fin, a dejar atrás el miedo—. Por enseñarme que todavía valía la pena creer en algo, aunque hubiera crecido rodeado de gris toda mi vida.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "24-el-regreso-a-almagre.md", "num": "CAPÍTULO XXIV", "title": "EL REGRESO A ALMAGRE", "body": [{"type": "p", "runs": [{"t": "El camino de vuelta fue tan distinto del camino de ida que Yesir, cabalgando junto a Danira bajo un cielo que recuperaba su color legua a legua a medida que se alejaban de Grisalda, tuvo que detenerse más de una vez solo para mirar, con una especie de asombro renovado, cómo el verde volvía a los árboles, cómo el Gran Lienzo, más adelante, empezaba a mostrarse otra vez en todo su esplendor líquido.", "i": false}]}, {"type": "p", "runs": [{"t": "—Nunca pensé que iba a extrañar tanto algo tan simple como un árbol verde —dijo, en algún punto del camino, viendo un bosque que apenas semanas atrás había cruzado gris y apagado, ahora recuperando, poco a poco, su color natural gracias a las cuadrillas de Restauradores que Fresia había enviado desde Alizar en cuanto se supo la noticia de la caída del Curador.", "i": false}]}, {"type": "p", "runs": [{"t": "—Yo tampoco —dijo Danira, apretándole la mano—. Y sin embargo aquí estamos, viéndolo volver.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Llegaron a Almagre once días después de dejar Grisalda, y el pueblo entero, avisado con tiempo por un mensajero que Nébrisa había enviado adelante como gesto de buena fe, los esperaba en la plaza, con el mural del ayuntamiento —esa esquina sur que había quedado completamente gris el día del ataque— restaurado ya en un rojo tan vivo que parecía, a la distancia, casi imposible de creer.", "i": false}]}, {"type": "p", "runs": [{"t": "—¡Volvieron! —gritó la señora Olalla, la primera en correr hacia ellos, con lágrimas rodándole por la cara—. ¡Se lo dije, muchacho! ¡Le dije que todo Almagre estaría aquí cuando volvieran!", "i": false}]}, {"type": "p", "runs": [{"t": "Danira desmontó y se dejó envolver por los brazos de la anciana, y después por los de una docena más de vecinos que se turnaban para abrazarla, para tocarle la cara, para confirmar con sus propias manos que era real, que había vuelto, que la pesadilla de meses enteros por fin había terminado.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El taller los recibió tal como lo habían dejado, con el mismo olor a linaza y a cochinilla que Danira había extrañado, según le confesó a Yesir esa primera noche de vuelta, más que casi cualquier otra cosa durante su cautiverio.", "i": false}]}, {"type": "p", "runs": [{"t": "—Pensé en este olor todas las noches —dijo, sentada en el mismo banco de siempre, pasando los dedos por la superficie de trabajo que ella misma había pulido durante años—. Pensé que si lograba recordarlo con suficiente claridad, de alguna manera me iba a mantener conectada a esta vida, a este taller, a usted.", "i": false}]}, {"type": "p", "runs": [{"t": "—Funcionó —dijo Yesir, sentándose junto a ella—. Cada miga de color que dejó en el camino me guio hasta aquí. Cada recuerdo que ambos guardamos, de alguna manera, nos mantuvo unidos incluso cuando todo el continente entre nosotros se volvía gris.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Esa noche, bajo el Gran Lienzo que volvía a caer sobre Almagre exactamente como siempre, con la Hora Añil pintando el cielo de un azul profundo que Yesir no recordaba haber apreciado tanto en toda su vida, se sentaron juntos en el patio, en el mismo lugar donde Danira solía extraer color de pétalos de amapola cada mañana.", "i": false}]}, {"type": "p", "runs": [{"t": "—El pueblo entero quiere hacer una celebración —dijo Danira—. La señora Olalla ya está organizando algo, según me dijo, \"digno de lo que ustedes dos acaban de lograr\".", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y usted qué quiere?", "i": false}]}, {"type": "p", "runs": [{"t": "Danira lo pensó un momento, mirando el cielo, mirando el mural restaurado que se veía, desde ahí, brillando suavemente en la distancia.", "i": false}]}, {"type": "p", "runs": [{"t": "—Quiero que nos volvamos a casar —dijo, al fin, con una sonrisa que mezclaba ternura y determinación—. No porque el primer matrimonio no cuente. Cuenta más que nunca, después de todo lo que sobrevivió. Pero quiero renovar el Trenzado, Yesir, delante de todo el que quiera venir a verlo, no como una repetición sino como una declaración: que este amor no solo resistió la Marea Gris. La venció.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y dónde? ¿Aquí, en Almagre?", "i": false}]}, {"type": "p", "runs": [{"t": "—Aquí, y también en Alizar. —Danira lo miró con una determinación nueva—. Quiero que la capital entera vea lo que un matrimonio de verdad, sin ningún secreto de por medio, es capaz de lograr. Quiero que cada persona que alguna vez tuvo miedo de que amar demasiado fuera peligroso, vea que el amor, cuando se elige de verdad, es exactamente lo contrario: la fuerza más segura que existe en todo Pigmalia.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "25-la-vispera.md", "num": "CAPÍTULO XXV", "title": "LA VÍSPERA", "body": [{"type": "p", "runs": [{"t": "La noche antes de la ceremonia, Alizar entera bullía de preparativos —guirnaldas de pigmento fresco tendidas entre los balcones, músicos ensayando en las esquinas, el aroma de pan de azafrán saliendo de cada horno de la ciudad—, pero en el pequeño cuarto de huéspedes que el gremio de Restauradores les había asignado, Yesir y Danira se sentaron juntos, en silencio, lejos por una vez de todo el ruido de la fiesta que se avecinaba.", "i": false}]}, {"type": "p", "runs": [{"t": "—Mañana medio Pigmalia va a estar mirándonos —dijo Danira, trenzando y destrenzando un hilo de lana entre los dedos, un gesto nervioso que Yesir reconocía de los días previos a su primera boda—. Nobles. El gremio entero. Hasta Nébrisa.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Le da miedo?", "i": false}]}, {"type": "p", "runs": [{"t": "—No el amor —respondió ella, casi de inmediato—. Nunca eso. Me da un poco de miedo la ceremonia misma. Toda esa gente. Toda esa mirada puesta en algo que, en el fondo, siempre fue solo nuestro.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Yesir la miró un largo momento, entendiendo, con una claridad repentina, exactamente lo que ella trataba de decir sin decirlo del todo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Entonces hagamos esto esta noche —dijo—. Solo nosotros dos. Sin plaza, sin oficiante, sin nadie mirando. Mañana renovamos el Trenzado para Pigmalia entero, para Nébrisa, para todos los que necesitan ver que el amor gana. Pero esta noche, aquí, renovemos la promesa solo para nosotros. La versión que nadie más necesita presenciar para que sea real.", "i": false}]}, {"type": "p", "runs": [{"t": "Danira sonrió, con una expresión que Yesir no le había visto desde antes de Grisalda: ligera, sin ninguna sombra de cautela detrás.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Qué necesitamos?", "i": false}]}, {"type": "p", "runs": [{"t": "—Nada —dijo él—. Ya llevamos todo lo que hace falta encima. Seis años de matrimonio. Un rescate entero. Un pueblo que nunca dejó de creer en nosotros.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Se tomaron de las manos, sin ningún cuenco de pigmento fresco entre ellos, sin ningún ritual formal del gremio, solo la piel contra la piel y el Alba Doble latiendo, tranquilo y constante, bajo la muñeca de ambos.", "i": false}]}, {"type": "p", "runs": [{"t": "—Prometo —dijo Yesir, en voz baja, solo para ella— que cada día que me quede de vida, voy a seguir eligiéndola a usted, no porque lo jure delante de nadie mañana, sino porque ya lo elegí, en secreto, cada uno de los días que pasé cruzando un continente entero para encontrarla.", "i": false}]}, {"type": "p", "runs": [{"t": "—Y yo prometo —respondió Danira, con la voz quebrada de una emoción que ya no intentaba esconder—, que nunca más voy a guardarle un secreto por miedo a perderla, ni siquiera el más pequeño, porque ya aprendí, de la peor manera posible, que los secretos guardados por amor pesan casi tanto como los guardados por miedo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "No hubo estallido de color esa noche —el Alba Doble, generoso, pareció entender que esa promesa privada no necesitaba ningún espectáculo para ser verdadera—, solo un calor suave que subió por ambos brazos y se quedó ahí, instalado, como una brasa constante bajo la piel.", "i": false}]}, {"type": "p", "runs": [{"t": "—Esto es lo que va a durar, ¿sabe? —dijo Danira, apoyando la cabeza en el hombro de Yesir—. No el aplauso de mañana. No la plaza llena. Esto. Este cuarto pequeño, esta noche, este silencio compartido entre los dos.", "i": false}]}, {"type": "p", "runs": [{"t": "—Lo sé —dijo Yesir, besándole la frente—. Mañana es para Pigmalia. Esta noche siempre va a ser solo nuestra.", "i": false}]}, {"type": "p", "runs": [{"t": "Se quedaron así hasta tarde, sin prisa, dejando que la ciudad entera se preparara sin ellos para la fiesta del día siguiente, sabiendo, los dos, que ya habían tenido, esa misma noche, la boda que de verdad importaba.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "26-la-renovacion-en-alizar.md", "num": "CAPÍTULO XXVI", "title": "LA RENOVACIÓN EN ALIZAR", "body": [{"type": "p", "runs": [{"t": "La ceremonia se hizo un mes después, en la plaza mayor de Alizar, con la ciudad entera repintada esa mañana con un cuidado especial —según le contó Fresia a Yesir, con una sonrisa que no intentaba disimular el orgullo—, porque \"no todos los días la capital tiene el honor de presenciar el Color Marital que salvó a Grisalda de su propia sombra\".", "i": false}]}, {"type": "p", "runs": [{"t": "Danira llegó del brazo de su padre, un hombre mayor de manos curtidas que había viajado desde un pueblo lejano solo para esa ocasión, vestida con una sencillez deliberada que contrastaba, hermosamente, con el lujo repentino de una ciudad entera vuelta a pintar en su honor.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir la esperaba junto al mismo altar improvisado donde, seis años atrás en Almagre, habían trenzado sus Tintas por primera vez, aunque esta vez el altar estaba rodeado no solo de vecinos de un pueblo pequeño, sino de nobles de la corte, Restauradores del gremio entero, y —para sorpresa genuina de todo Alizar— Nébrisa, vestida de un dorado-esmeralda tenue pero real, la primera vez en quince años que se presentaba en público sin el gris de su duelo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—Pueblo de Pigmalia —dijo el oficiante, un anciano Iluminador que había presidido más Trenzados que ningún otro en toda la historia del gremio—, hoy no estamos aquí para presenciar una boda nueva, sino algo quizás más raro y más hermoso: una renovación. Un matrimonio que atravesó la Marea Gris misma, que sobrevivió a la separación más cruel que Pigmalia ha conocido en generaciones, y que vuelve hoy, no para empezar de nuevo, sino para confirmar delante de todos que lo que sobrevivió no fue casualidad, sino elección.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir tomó las manos de Danira, sintiendo el mismo temblor que había sentido seis años atrás, aunque esta vez cargado de todo lo que habían vivido desde entonces.", "i": false}]}, {"type": "p", "runs": [{"t": "—Prometo —dijo, con una voz que llegaba a cada rincón de la plaza—, no solo lo que prometí la primera vez, sino algo más: que ninguna Marea Gris, ningún continente entero de distancia, ninguna cosa que este mundo o cualquier otro pueda interponer entre nosotros, va a ser jamás más fuerte que la certeza de que voy a volver a buscarla, siempre, cada vez que haga falta.", "i": false}]}, {"type": "p", "runs": [{"t": "—Y yo prometo —respondió Danira, con lágrimas que brillaban de un violeta profundo bajo la luz del Gran Lienzo—, no solo esperar, como hice, sino resistir de la manera que sea necesaria, sembrando color donde sea que me encuentre, para que usted siempre tenga un camino de vuelta a mí, sin importar cuánta oscuridad se interponga.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Trenzaron sus Tintas otra vez, con las manos entrelazadas sobre un cuenco de pigmento fresco, y cuando el Alba Doble estalló entre ellos —más brillante que nunca, cargado ahora de todo un viaje, todo un rescate, toda una prueba superada—, la plaza entera de Alizar estalló en un clamor que, según contarían después los viajeros durante años, se pudo ver desde las colinas vecinas como un segundo amanecer.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir sacó, en ese instante exacto, un pequeño frasco que había guardado desde antes de partir de Almagre: la mezcla inacabada del día de su primera boda, un color a medio fundir que nunca habían terminado de trenzar porque un vecino, con la mejor de las intenciones, los había interrumpido esa noche con un brindis demasiado entusiasta.", "i": false}]}, {"type": "p", "runs": [{"t": "—Nunca terminamos esto —dijo, mostrándoselo a Danira—. Lo guardé todos estos años, sin saber bien por qué. Ahora sé por qué.", "i": false}]}, {"type": "p", "runs": [{"t": "Lo vertió en el cuenco, junto al Alba Doble recién renovado, y el color se completó, por fin, después de seis años de espera, cerrando un círculo que ninguno de los dos había sabido, hasta ese preciso instante, que todavía estaba abierto.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Esa noche, con la fiesta todavía llenando las calles de Alizar de música y de vino especiado, Nébrisa se acercó a la pareja, con una copa en la mano y una sonrisa que ya no le costaba tanto esfuerzo como al principio.", "i": false}]}, {"type": "p", "runs": [{"t": "—Grisalda ya empezó a repintarse —les contó—. Despacio. Con ayuda de los Restauradores que enviaron. Todavía queda mucho gris, pero cada día hay un poco menos.", "i": false}]}, {"type": "p", "runs": [{"t": "—Nos alegra escucharlo —dijo Danira, con sinceridad genuina.", "i": false}]}, {"type": "p", "runs": [{"t": "—Quería decirles algo más. —Nébrisa dudó un instante, buscando las palabras—. El Amaranto solía decir, cuando estábamos recién casados, que el amor de verdad no se mide en cuánto dura sin ponerse a prueba, sino en cuánto resiste cuando por fin lo ponen a prueba de verdad. Nunca entendí del todo esa frase hasta esta noche, viéndolos a ustedes dos. Gracias por enseñarme, tan tarde en mi vida, algo que él intentó decirme hace quince años.", "i": false}]}, {"type": "p", "runs": [{"t": "Se alejó hacia la fiesta, con paso todavía inseguro pero decidido, y Yesir, viéndola partir, sintió que el círculo entero de esa historia —la suya, la de Danira, la de Nébrisa, la de Pigmalia entero— por fin empezaba, después de tanta oscuridad, a cerrarse en un color que ninguna sombra, jamás, iba a poder volver a robar.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "27-epilogo-el-color-que-queda.md", "num": "EPÍLOGO", "title": "EL COLOR QUE QUEDA", "body": [{"type": "p", "runs": [{"t": "Un año después de la Luna sin Color, Almagre celebró su vendimia de siempre —aunque en Pigmalia no se cosechaban uvas sino amapolas, y el vino que se compartía en esas fechas no embriagaba el cuerpo sino que teñía, por una noche, la lengua entera del pueblo de historias compartidas—, y Yesir y Danira, sentados en el mismo patio donde todo había empezado, vieron subir hacia el Gran Lienzo los primeros Faroles Vivos de la temporada.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Se acuerda de aquella noche? —preguntó Danira, con la cabeza apoyada en el hombro de Yesir—. La que empezó todo esto.", "i": false}]}, {"type": "p", "runs": [{"t": "—Cómo no me voy a acordar. Su farol se abrió como si el cielo entero quisiera anunciarle al mundo un secreto que usted llevaba años guardando.", "i": false}]}, {"type": "p", "runs": [{"t": "—Ya no tengo secretos, Yesir. Ni uno solo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Lo sé. Y por eso, precisamente, cada Farol Vivo que soltamos ahora es más brillante que el anterior.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El mural del ayuntamiento, restaurado desde hacía un año, seguía brillando con el mismo rojo intenso que el pueblo entero había ayudado a devolverle, y sobre él, en la esquina sur —esa esquina que el sol de la tarde siempre castigaba primero—, alguien había añadido, sin que Yesir o Danira lo pidieran, una pequeña flor violeta pintada con un cuidado que solo podía venir de una mano que entendía exactamente lo que esa flor representaba.", "i": false}]}, {"type": "p", "runs": [{"t": "—La señora Olalla dice que fue idea de todo el pueblo —le contó Danira a Yesir, la primera vez que la vieron—. Dice que quisieron que quedara un recordatorio permanente, ahí donde cualquiera pudiera verlo: que hasta en el rincón más castigado por el sol, algo puede seguir floreciendo si alguien se molesta en cuidarlo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Petrán los visitó esa vendimia, ya no vestido del uniforme gris de Recolector sino con la ropa sencilla de un aprendiz de Restaurador —Fresia misma lo había tomado bajo su ala, en cuanto se enteró de lo que había arriesgado por ayudar a Yesir aquella noche—, y les contó, con una sonrisa que ya no llevaba ningún rastro del miedo constante que había cargado durante años en Grisalda, que su color propio, largamente reprimido, empezaba por fin a aflorar bajo su piel: un verde suave, del color exacto, según decía, de la primavera que nunca había visto de niño.", "i": false}]}, {"type": "p", "runs": [{"t": "—Nébrisa manda saludos —les dijo—. Grisalda ya no se llama así, ¿sabían? El pueblo entero votó por cambiarle el nombre. Ahora la llaman Renacida.", "i": false}]}, {"type": "p", "runs": [{"t": "—Un nombre honesto —dijo Yesir, con una sonrisa.", "i": false}]}, {"type": "p", "runs": [{"t": "—El más honesto que ese lugar ha tenido en generaciones.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Esa noche, cuando la fiesta del pueblo por fin se apagaba y Almagre entero se acomodab
