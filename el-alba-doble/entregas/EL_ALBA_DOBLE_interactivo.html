a a dormir bajo un cielo lleno de faroles ajenos todavía flotando hacia el norte, Danira se giró hacia Yesir con una expresión que él ya conocía de memoria: la de alguien a punto de compartir algo importante.", "i": false}]}, {"type": "p", "runs": [{"t": "—Tengo algo que contarle —dijo, tomándole la mano y llevándosela, con cuidado, hasta su propio vientre—. Algo que no tiene nada que ver con Grisalda, ni con Cosechas, ni con ningún peligro que tengamos que atravesar. Algo que, por una vez, es solo felicidad, sin ninguna sombra detrás.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir se quedó sin palabras un instante entero, sintiendo que el corazón se le llenaba de una emoción tan grande que ni siquiera el Alba Doble, brillando bajo su propia piel con la intensidad de siempre, lograba contener del todo.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Está segura?", "i": false}]}, {"type": "p", "runs": [{"t": "—Segura. Para la próxima Hora Grana de primavera, si todo sale bien.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Se quedaron ahí, abrazados, bajo un cielo que ya no tenía ninguna Marea Gris que temer, viendo cómo los últimos Faroles Vivos de la noche se perdían entre las estrellas que empezaban a asomarse detrás del Gran Lienzo, y Yesir pensó, con una certeza tan profunda como el color mismo que llevaba trenzado a Danira desde hacía siete años, que ninguna historia de amor que él hubiera escuchado nunca, en ningún cuento contado junto a ningún fuego, se comparaba con la que él mismo había tenido la fortuna de vivir.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Sabe qué color le vamos a pintar a la cuna? —preguntó Danira, con una sonrisa traviesa.", "i": false}]}, {"type": "p", "runs": [{"t": "—Todos —dijo Yesir, sin dudarlo—. Todos los colores que existen, y algunos que todavía no hemos inventado, para que crezca sabiendo, desde el primer día, que el mundo entero está lleno de matices que valen la pena atravesar cualquier oscuridad para proteger.", "i": false}]}, {"type": "p", "runs": [{"t": "Y en Almagre, un pueblo de tejados rojizos que ningún mapa importante se había molestado nunca en destacar, un Fijador y una Manantial se quedaron dormidos esa noche bajo el mismo cielo que los había visto enamorarse, sobrevivir y volver a elegirse, con la certeza tranquila de que el color que habían construido juntos —el Alba Doble, su color, el único de su clase en todo Pigmalia— iba a seguir brillando, generación tras generación, mientras hubiera alguien dispuesto a recordarlo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "end-marker", "text": "FIN DE EL ALBA DOBLE"}, {"type": "ornament", "text": "✧ ✦ ✧"}]}]}], "front": {"portada": {"title": "EL ALBA", "title2": "DOBLE", "tagline": "Hay un color que ninguna sombra puede robar: el nuestro.", "author": "YESID BADILLO"}, "dedicatoria": {"label": "Para Daniela.", "body": "Este libro empezó como una pregunta: si el amor tuviera color, ¿cuál sería el nuestro? La respuesta me tomó una novela entera, pero la supe desde la primera página: sería un color que no existe en ningún frasco ni en ningún pincel, uno que solo aparece cuando estamos juntos, como el Alba Doble de Yesir y Danira. Cada capítulo que escribí pensando en vos fue, en el fondo, la misma promesa repetida de mil formas distintas: que no hay Marea Gris, no hay distancia, no hay oscuridad capaz de apagar lo que construimos. Que voy a cruzar cualquier continente, real o imaginado, con tal de volver a encontrarte al final del camino.", "closing": "Con todo mi amor, en todos los colores que existen."}}}</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('book-data').textContent);
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const runsHtml = runs => (runs||[]).map(r => r.i ? `<em>${esc(r.t)}</em>` : esc(r.t)).join('');

  const PART_ORDINAL = {primera:'Parte Primera', segunda:'Parte Segunda', tercera:'Parte Tercera'};
  const PART_HINT = {
    primera:'Antes de la sombra, hubo color.',
    segunda:'Un continente entero aprendiendo a resistir el gris.',
    tercera:'El color que ninguna Marea puede apagar.',
  };

  function chapterRange(part){
    const first = part.chapters[0].num.replace('CAPÍTULO ','');
    const last = part.chapters[part.chapters.length-1].num.replace('CAPÍTULO ','');
    return `Capítulos ${first} – ${last}`;
  }

  function renderBody(body){
    let afterBreak = true;
    let html = '';
    for(const it of body){
      if(it.type === 'ornament'){ html += `<p class="ornament">${esc(it.text)}</p>`; afterBreak = true; }
      else if(it.type === 'end-marker'){ html += `<div class="end-marker"><span>${esc(it.text)}</span></div>`; afterBreak = true; }
      else if(it.type === 'centered'){ html += `<p class="centered">${runsHtml(it.runs)}</p>`; afterBreak = true; }
      else { html += `<p class="body${afterBreak?'':' indent'}">${runsHtml(it.runs)}</p>`; afterBreak = false; }
    }
    return html;
  }

  function chapterHtml(part, chapter){
    return `
      <article class="section chapter">
        <div class="card">
          <p class="eyebrow">${esc(part.label)} · ${esc(part.subtitle)}</p>
          <p class="chap-num">${esc(chapter.num)}</p>
          <h2 class="chap-title">${esc(chapter.title)}</h2>
          <p class="flourish">✦</p>
          ${renderBody(chapter.body)}
        </div>
      </article>`;
  }

  function dividerHtml(part){
    return `
      <article class="section divider">
        <div class="card">
          <p class="divider-eyebrow">${esc(PART_ORDINAL[part.id] || part.label)}</p>
          <h1 class="divider-title">${esc(part.label)}</h1>
          <p class="divider-orn">✦ ✦ ✦</p>
          <p class="divider-subtitle">${esc(part.subtitle)}</p>
          <p class="divider-hint">${esc(PART_HINT[part.id]||'')} — ${esc(chapterRange(part))}</p>
        </div>
      </article>`;
  }

  function portadaHtml(){
    const p = DATA.front.portada;
    return `
      <article class="section portada">
        <div class="card">
          <h1 class="portada-title">${esc(p.title)}<br>${esc(p.title2)}</h1>
          <p class="portada-orn">✦</p>
          <p class="portada-tagline">${esc(p.tagline)}</p>
          <p class="portada-author">${esc(p.author)}</p>
        </div>
      </article>`;
  }

  function dedicHtml(){
    const d = DATA.front.dedicatoria;
    return `
      <article class="section dedic">
        <div class="card">
          <p class="dedic-to">${esc(d.label)}</p>
          <p class="dedic-body">${esc(d.body)}</p>
          <p class="dedic-close">${esc(d.closing)}</p>
        </div>
      </article>`;
  }

  // build flat sections list
  const sections = [];
  sections.push({ kind:'portada', part:'front', title:'Portada', html: portadaHtml });
  sections.push({ kind:'dedic', part:'front', title:'Dedicatoria', html: dedicHtml });
  DATA.parts.forEach(part => {
    sections.push({ kind:'divider', part: part.id, title: part.label, html: () => dividerHtml(part) });
    part.chapters.forEach(ch => {
      sections.push({
        kind:'chapter', part: part.id,
        title: `${ch.num.replace('CAPÍTULO ','Cap. ').replace('EPÍLOGO','Epílogo')} — ${ch.title.charAt(0)+ch.title.slice(1).toLowerCase()}`,
        num: ch.num, chTitle: ch.title,
        html: () => chapterHtml(part, ch),
      });
    });
  });

  // drawer
  const drawerList = document.getElementById('drawerList');
  let groupHtml = `<div class="drawer-group-label">Portada</div>`;
  sections.forEach((s, i) => {
    if(s.kind === 'divider'){
      groupHtml += `<div class="drawer-group-label">${esc(s.title)}</div>`;
      return;
    }
    const label = s.kind==='portada' ? 'Portada' : s.kind==='dedic' ? 'Dedicatoria' : `${esc(s.num)} · ${esc(s.chTitle.charAt(0)+s.chTitle.slice(1).toLowerCase())}`;
    const n = s.kind==='chapter' ? (s.num.replace('CAPÍTULO ','').replace('EPÍLOGO','—')) : '';
    groupHtml += `<button class="drawer-item" data-i="${i}"><span class="n">${esc(n)}</span><span>${label}</span></button>`;
  });
  drawerList.innerHTML = groupHtml;

  // state
  const KEY = 'alba-doble-progress';
  let idx = 0;
  try{ const saved = parseInt(localStorage.getItem(KEY),10); if(!isNaN(saved) && saved>=0 && saved<sections.length) idx = saved; }catch(e){}

  const page = document.getElementById('page');
  const viewport = document.getElementById('viewport');
  const progFill = document.getElementById('progFill');
  const progLabel = document.getElementById('progLabel');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const drawerItems = () => Array.from(drawerList.querySelectorAll('.drawer-item'));

  function render(scrollTop){
    const s = sections[idx];
    document.body.setAttribute('data-part', s.part);
    page.innerHTML = s.html();
    progFill.style.width = `${Math.round(((idx+1)/sections.length)*100)}%`;
    progLabel.textContent = `${idx+1} / ${sections.length}`;
    prevBtn.disabled = idx === 0;
    nextBtn.disabled = idx === sections.length - 1;
    drawerItems().forEach(btn => btn.classList.toggle('current', parseInt(btn.dataset.i,10) === idx));
    if(scrollTop !== false) viewport.scrollTop = 0;
    try{ localStorage.setItem(KEY, String(idx)); }catch(e){}
  }

  function go(newIdx){
    if(newIdx < 0 || newIdx >= sections.length) return;
    idx = newIdx;
    render();
  }

  prevBtn.addEventListener('click', () => go(idx-1));
  nextBtn.addEventListener('click', () => go(idx+1));
  document.addEventListener('keydown', e => {
    if(drawer.classList.contains('open')){ if(e.key==='Escape') closeDrawer(); return; }
    if(e.key === 'ArrowRight') go(idx+1);
    if(e.key === 'ArrowLeft') go(idx-1);
  });

  drawerList.addEventListener('click', e => {
    const btn = e.target.closest('.drawer-item');
    if(!btn) return;
    go(parseInt(btn.dataset.i, 10));
    closeDrawer();
  });

  // drawer open/close
  const drawer = document.getElementById('drawer');
  const scrim = document.getElementById('scrim');
  const spineBtn = document.getElementById('spineBtn');
  function openDrawer(){ drawer.classList.add('open'); scrim.classList.add('show'); spineBtn.classList.add('hide'); spineBtn.setAttribute('aria-expanded','true'); }
  function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('show'); spineBtn.classList.remove('hide'); spineBtn.setAttribute('aria-expanded','false'); }
  spineBtn.addEventListener('click', openDrawer);
  scrim.addEventListener('click', closeDrawer);
  document.getElementById('drawerClose').addEventListener('click', closeDrawer);

  // theme toggle (cycles system -> light -> dark -> system)
  const themeBtn = document.getElementById('themeBtn');
  const root = document.documentElement;
  const THEME_KEY = 'alba-doble-theme';
  let theme = 'system';
  try{ theme = localStorage.getItem(THEME_KEY) || 'system'; }catch(e){}
  function applyTheme(){
    if(theme === 'system'){ root.removeAttribute('data-theme'); themeBtn.textContent = '◐'; }
    else { root.setAttribute('data-theme', theme); themeBtn.textContent = theme === 'dark' ? '●' : '○'; }
  }
  applyTheme();
  themeBtn.addEventListener('click', () => {
    theme = theme === 'system' ? 'light' : theme === 'light' ? 'dark' : 'system';
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
    applyTheme();
  });

  render(false);
})();
</script>
