<script id="book-data" type="application/json">{"parts": [{"id": "primera", "theme": "grana", "label": "Primera Parte", "subtitle": "LA HORA GRANA", "chapters": [{"file": "01-el-taller-de-almagre.md", "num": "CAPÍTULO I", "title": "EL TALLER DE ALMAGRE", "body": [{"type": "p", "runs": [{"t": "El Gran Lienzo bajó a tocar el mundo, como todas las mañanas, un poco antes de que Yesir abriera los ojos.", "i": false}]}, {"type": "p", "runs": [{"t": "Lo sintió primero en los párpados: un calor rojizo, suave, que se filtraba por la ventana entreabierta del taller y le pintaba la cara de un color que no tenía nombre exacto en ningún idioma de Pigmalia, aunque todos, desde niños, aprendían a llamarlo grana. Era la hora en que la aurora que cubría el cielo entero —viva, líquida, permanente— descendía lo bastante para poder tocarse: caía en cascadas por los cerros del oriente, se encharcaba despacio en los valles, goteaba de los aleros de las casas como cera tibia que nunca llegaba a quemar.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir estiró una mano fuera de la cobija y la dejó ahí, abierta hacia la ventana, hasta que un hilo de luz roja le cayó justo en la palma.", "i": false}]}, {"type": "p", "runs": [{"t": "Ardió, un instante, con un calor que no era físico sino algo más hondo: coraje, le decían siempre de niño, el dorado es coraje y el grana es su primo más impaciente, el que empuja a levantarse antes de estar del todo listo. Yesir se levantó.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Danira ya estaba en el patio, descalza sobre las baldosas todavía tibias de la noche, con las manos hundidas hasta la muñeca en un cuenco de agua donde flotaban tres pétalos de amapola.", "i": false}]}, {"type": "p", "runs": [{"t": "—Vas a espantar toda la Hora Grana con esa cara de sueño —dijo, sin girarse, aunque de algún modo siempre sabía exactamente cuándo él aparecía en una puerta.", "i": false}]}, {"type": "p", "runs": [{"t": "—La Hora Grana no se espanta. Vuelve todos los días, le guste a quien le guste.", "i": false}]}, {"type": "p", "runs": [{"t": "—Como usted, entonces.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir sonrió, y se acercó a mirar lo que ella hacía: extraer, con dedos pacientes, el rojo puro de los pétalos, dejándolo suspendido en el agua como una nube diminuta que todavía no decidía adónde quería ir. Era trabajo de Iluminadora, y Danira lo hacía con una economía de movimientos que a Yesir, después de seis años de matrimonio, todavía le parecía uno de los espectáculos más hermosos que existían en todo Pigmalia.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Para el fresco de la señora Olalla? —preguntó.", "i": false}]}, {"type": "p", "runs": [{"t": "—Para el fresco de la señora Olalla. Se le está descascarando el retrato de su difunto marido, y quiere que le devuelva el color a la barba antes de que se le olvide del todo qué color tenía.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y tú te acuerdas?", "i": false}]}, {"type": "p", "runs": [{"t": "—Yo no. Pero el muro sí, si uno sabe preguntarle bien.", "i": false}]}, {"type": "p", "runs": [{"t": "Ese era el oficio de los Iluminadores de Almagre: no inventar color, sino escucharlo donde ya vivía —en una flor, en un recuerdo, en la sombra que deja una cosa que existió— y devolverlo a donde hacía falta. Danira era buena en esa escucha. Mejor que buena. Pero eso, como tantas otras cosas de Danira, Yesir todavía no sabía cuánto.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El taller olía, esa mañana, como todas las mañanas, a linaza y a cochinilla molida, con un fondo de humo dulce que subía del horno donde se cocían los almagres —los rojos más antiguos y más tercos, los que había que domar con calor antes de que aceptaran quedarse quietos en un frasco.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir era Fijador. No el oficio más vistoso de Pigmalia —los Manantiales, si es que alguno seguía existiendo de verdad y no era solo leyenda de aldea, tenían fama de ser los más envidiados—, pero sí, en su opinión nunca dicha en voz alta, el más honesto. Cualquier Iluminador podía pintar una puerta que abriera a otro lugar, un mapa que reescribiera su propio territorio, una herida que cerrara bajo una capa de almagre bien puesta. Pero el color, sin un Fijador, no se quedaba. Se iba desvaneciendo, día tras día, como todo lo hermoso que nadie se molesta en cuidar.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir tocaba un color y ese color se quedaba. Para siempre, si él quería. Era, pensaba a veces, la misma terquedad que había puesto en quedarse él mismo, seis años atrás, en Almagre, en ese taller, al lado de esa mujer.", "i": false}]}, {"type": "p", "runs": [{"t": "—Tengo que fijar el retrato del difunto Olalla en cuanto termines de sacarle el rojo —dijo, sentándose a su banco de trabajo, donde ya lo esperaban los pinceles ordenados por grosor, como soldados en fila—. Y después el mural del ayuntamiento, que otra vez se está pelando por la esquina sur.", "i": false}]}, {"type": "p", "runs": [{"t": "—Siempre por la esquina sur.", "i": false}]}, {"type": "p", "runs": [{"t": "—Siempre por la esquina sur. Le da el sol de la tarde más fuerte que a cualquier otra pared del pueblo, y el sol de la tarde no perdona a nadie que no esté bien fijado.", "i": false}]}, {"type": "p", "runs": [{"t": "Danira levantó la vista del cuenco, con esa media sonrisa que a Yesir seguía pareciéndole, después de seis años, un regalo pequeño cada vez que aparecía.", "i": false}]}, {"type": "p", "runs": [{"t": "—Habla usted del sol como si le tuviera rabia personal.", "i": false}]}, {"type": "p", "runs": [{"t": "—Le tengo respeto. Que es distinto, y mucho más peligroso.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Desayunaron en el patio, bajo la luz que ya empezaba a subir de grana a un naranja más manso, con pan tibio y un tazón de infusión de azafrán que Yesir bebió despacio, dejando que el sabor le llegara entero antes de tragar.", "i": false}]}, {"type": "p", "runs": [{"t": "Porque en Pigmalia comer también era un acto de color, y nadie en Almagre habría sabido explicarle a un forastero por qué el azafrán sabía, en la lengua, exactamente a mediodía —esa clase precisa de luz llena, sin sombras, que solo existía unas pocas horas al día—, o por qué el añil, cuando alguien lo probaba en un dulce de anís, dejaba un rastro de nostalgia de menta que no tenía nada que ver con la menta de verdad. Era así. Había sido así siempre. Los niños aprendían los sabores-color antes que las letras, y para cuando llegaban a adultos ya no se preguntaban por qué, del mismo modo que nadie se pregunta por qué el agua moja.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Sabe a qué me supo, anoche, el guiso de la vecina? —preguntó Danira, partiendo el pan.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿A qué?", "i": false}]}, {"type": "p", "runs": [{"t": "—A domingo de hace diez años. Ese domingo específico, el de la boda de su prima, cuando todavía no nos conocíamos. Un domingo entero, con la luz esa de las cuatro de la tarde que ya no vuelve a repetirse igual.", "i": false}]}, {"type": "p", "runs": [{"t": "—Eso es imposible de saber, Danira. Usted no puede saber a qué domingo específico le supo un guiso.", "i": false}]}, {"type": "p", "runs": [{"t": "—No lo sé con la cabeza. Lo sé con la lengua. Son cosas distintas.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir se rió, con esa risa corta que Danira le conocía de memoria, y pensó, no por primera vez, que había algo en la manera en que su esposa hablaba del mundo —con esa certeza tranquila de quien no necesita explicar lo que siente para saber que es verdad— que él llevaba media vida entera tratando de aprender sin conseguirlo del todo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "En la muñeca izquierda de Danira, justo donde el pulso late más cerca de la piel, había una línea fina de color que no era ni grana ni añil ni ninguno de los colores que existían por separado en el Gran Lienzo. Era un tono nuevo, mitad ámbar oscuro de Yesir, mitad un violeta profundo que era solo de ella, fundidos hasta hacerse uno solo: el Alba Doble.", "i": false}]}, {"type": "p", "runs": [{"t": "Se lo habían trenzado seis años atrás, la noche de su boda, con las manos entrelazadas sobre un cuenco de pigmento fresco, repitiendo el voto que todos los novios de Pigmalia repetían y que solo unos pocos, con mucha suerte, llegaban a sentir de verdad como algo más que palabras: ", "i": false}, {"t": "que mi color se quede en el tuyo, y el tuyo en el mío, hasta que ya no sepamos distinguir de quién era cada cual.", "i": true}]}, {"type": "p", "runs": [{"t": "El color había prendido esa misma noche, brillante y nuevo, un tono que nadie en Almagre había visto antes ni volvería a ver en ninguna otra muñeca del pueblo, porque el Alba Doble, como cualquier Color Marital de verdad, no se podía reproducir. Solo existía ahí, en esa línea de piel, mientras los dos estuvieran juntos y se quisieran de la manera exacta en que se querían.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir se lo tocó esa mañana, como hacía casi todos los días sin pensarlo, un gesto tan automático como respirar.", "i": false}]}, {"type": "p", "runs": [{"t": "—Sigue ahí —dijo, con la satisfacción tranquila de quien comprueba, otra vez, que el sol sale.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y dónde más iba a estar? —Danira le sostuvo la mano un momento, con los dedos todavía manchados de un rojo tenue de amapola—. Aquí no hay ninguna sombra capaz de robarnos este color, Yesir. Ninguna.", "i": false}]}, {"type": "p", "runs": [{"t": "Lo dijo en el tono despreocupado de quien hace una broma pequeña de sobremesa, sin saber —porque todavía no había manera de saberlo, esa mañana tranquila de Hora Grana en un patio de Almagre— cuánto le iba a costar, muy pronto, que esa frase resultara ser verdad.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El resto de la mañana pasó como pasaban casi todas las mañanas en el taller: Yesir fijando el rojo que Danira le acercaba del cuenco, capa sobre capa, hasta que la barba del difunto Olalla volvió a ser exactamente el color que la señora Olalla recordaba, con esa mezcla de alivio y de tristeza nueva que siempre acompañaba a los retratos bien restaurados —porque devolverle el color a un muerto era también, de algún modo, recordarle a los vivos cuánto se había ido apagando sin que nadie lo notara.", "i": false}]}, {"type": "p", "runs": [{"t": "A media tarde, mientras Yesir subía a la escalera a atacar la esquina sur del mural del ayuntamiento, un pregonero cruzó la plaza tocando una campanilla de cobre, anunciando lo que todo Almagre ya sabía desde hacía semanas pero que la campanilla, de todos modos, hacía sentir más real, más inminente:", "i": false}]}, {"type": "p", "runs": [{"t": "—¡Esta noche, Faroles Vivos! ¡Que cada casa encienda su color y lo suba al cielo!", "i": false}]}, {"type": "p", "runs": [{"t": "Danira, desde abajo, sosteniendo el balde de pigmento fresco para que Yesir no tuviera que bajar cada rato, levantó la vista hacia él con una expresión que él no supo leer del todo: entusiasmo, sí, como todos los años, pero también algo más, algo que se le escondía detrás de los ojos como quien guarda una moneda de más en el bolsillo sin querer que nadie la vea.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Va a pintar linterna este año? —preguntó Yesir, sin bajar la vista del muro.", "i": false}]}, {"type": "p", "runs": [{"t": "—Siempre pinto linterna.", "i": false}]}, {"type": "p", "runs": [{"t": "—Ya sé que siempre pinta linterna. Pregunto si va a pintar la de siempre, o si tiene ganas de sorprenderme.", "i": false}]}, {"type": "p", "runs": [{"t": "Danira se quedó callada un momento, con el balde todavía en las manos, mirando hacia el cielo que empezaba, muy despacio, a virar del naranja manso de la tarde hacia el primer aviso de la Hora Añil.", "i": false}]}, {"type": "p", "runs": [{"t": "—Tengo ganas de sorprenderlo —dijo, al fin, con una sonrisa que a Yesir le pareció, sin que él tuviera manera de saber por qué, un poco más nerviosa de lo normal—. Pero eso, Yesir, todavía no se lo puedo decir.", "i": false}]}, {"type": "p", "runs": [{"t": "Él se rió, pensando que era una de esas bromas de esposa que uno aprende a querer sin entender del todo, y siguió pintando la esquina sur del muro, sin saber que esa noche —la noche de los Faroles Vivos, la más luminosa del año en todo Almagre— iba a ser la última noche tranquila que su matrimonio conocería en mucho, mucho tiempo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "02-los-faroles-vivos.md", "num": "CAPÍTULO II", "title": "LOS FAROLES VIVOS", "body": [{"type": "p", "runs": [{"t": "Cada casa de Almagre encendió su color esa noche, tal como mandaba la tradición desde antes de que nadie recordara cuándo había empezado: una linterna de papel encerado, pintada a mano con la Tinta de Alma de quien la soltaba, que subía sola hacia el Gran Lienzo en cuanto se le prendía la mecha, uniéndose a las demás en un río lento de luz que cruzaba el cielo entero hasta el amanecer.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir pintó la suya con el ámbar oscuro de siempre, el mismo tono que llevaba bajo la piel desde que nació, y la soltó desde la plaza con un gesto que ya le salía sin pensar, de tantos años de hacerlo. La vio subir, mezclarse con las demás, un naranja entre cientos de naranjas, azules, verdes, un solo pueblo entero convertido en río de luz.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y la suya? —le preguntó a Danira, buscándola entre la gente.", "i": false}]}, {"type": "p", "runs": [{"t": "Ella tardó en responder. Tenía la linterna en las manos, todavía sin encender, y la miraba con una concentración que a Yesir le recordó, sin saber por qué, la cara que ponía cuando escuchaba un muro antes de restaurarlo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Ya va —dijo—. Deme un momento.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Lo que Danira no le dijo, porque llevaba años sin decírselo a nadie, era que cada Farol Vivo que pintaba con su color de verdad —el violeta profundo que era solo suyo— le costaba un esfuerzo que ningún otro Iluminador del pueblo necesitaba hacer: contener, no soltar, la fuente entera que llevaba dentro.", "i": false}]}, {"type": "p", "runs": [{"t": "Porque Danira no pedía prestado su pigmento, como todos los demás, de una flor o de un recuerdo o del Lienzo mismo. Lo manaba de su propio cuerpo, sin fondo, sin límite, y llevaba tantos años aprendiendo a dejar salir solo un hilo delgado —lo justo para una linterna, ni una gota más— que la costumbre ya le dolía menos que al principio. Pero esa noche, con la plaza entera llena de gente y el aire cargado de la expectación dulce de la fiesta, algo en ella se resistió a contenerse tanto como siempre.", "i": false}]}, {"type": "p", "runs": [{"t": "Pintó la linterna. La encendió. La soltó.", "i": false}]}, {"type": "p", "runs": [{"t": "Y por primera vez en años, dejó que saliera un poco más de lo que debía.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El farol de Danira no subió como los demás.", "i": false}]}, {"type": "p", "runs": [{"t": "Subió más rápido, más brillante, con un violeta tan profundo que por un instante pareció tragarse la luz de las linternas vecinas en vez de sumarse a ellas, y cuando llegó a la altura donde el río de faroles giraba despacio hacia el norte, se abrió —sin que nadie hubiera visto nunca un farol abrirse así— en una cascada de color que ningún pigmento conocido de Pigmalia producía: no era violeta ni añil ni ninguna mezcla catalogada en ningún taller del reino. Era un color nuevo, tan vivo que dolía mirarlo directamente, y por un segundo entero la plaza de Almagre quedó bañada en una luz que nadie supo nombrar.", "i": false}]}, {"type": "p", "runs": [{"t": "Un murmullo recorrió a la multitud. Algunos aplaudieron, pensando que era un truco preparado para la fiesta. Otros, los más viejos, los que llevaban más años mirando el cielo, se quedaron en silencio, con esa clase de silencio que solo produce el miedo disfrazado de asombro.", "i": false}]}, {"type": "p", "runs": [{"t": "—Danira —dijo Yesir, en voz baja, buscándola entre la gente—, ¿eso fue…?", "i": false}]}, {"type": "p", "runs": [{"t": "—Un accidente —dijo ella, y la palabra le salió más rápido y más tensa de lo que hubiera querido—. Se me fue la mano con el pigmento. Nada más.", "i": false}]}, {"type": "p", "runs": [{"t": "No era mentira del todo. Pero tampoco era, ni de cerca, toda la verdad.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Entre la multitud, apoyado contra el muro de la posada, un hombre de capa gris oscuro —que se había presentado esa tarde como mercader de telas, comprando y vendiendo sin demasiado interés real en ninguna transacción— no aplaudió ni se quedó en silencio de asombro.", "i": false}]}, {"type": "p", "runs": [{"t": "Sacó, con disimulo, un frasquito de cristal del bolsillo interior de la capa, y con dos dedos lo destapó justo el tiempo suficiente para que una brizna de aire cargado con el color imposible de Danira quedara atrapada adentro, encerrada, capturada como una prueba.", "i": false}]}, {"type": "p", "runs": [{"t": "Nadie lo vio hacerlo. Nadie, salvo una polilla pequeña y gris que dormitaba en un rincón oscuro del alero de la posada, y que no era, aunque nadie en Almagre tuviera manera de saberlo todavía, una polilla cualquiera.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—¿Un accidente? —repitió Yesir, más tarde, cuando la fiesta ya se apagaba y caminaban de vuelta al taller tomados de la mano, con el cielo entero todavía brillando del río de faroles—. Danira, llevo seis años viéndola pintar linternas. Nunca se le \"fue la mano\" con nada. Usted mide cada gota de pigmento como si el mundo se le fuera a acabar si se equivoca.", "i": false}]}, {"type": "p", "runs": [{"t": "—A veces uno se distrae.", "i": false}]}, {"type": "p", "runs": [{"t": "—Usted no se distrae. Usted es la persona menos distraída que conozco.", "i": false}]}, {"type": "p", "runs": [{"t": "Danira se detuvo en medio de la calle, bajo la luz mansa que quedaba de la fiesta, y por un instante —tan breve que Yesir después no estaría seguro de no haberlo imaginado— la vio dudar entre dos caminos: decirle la verdad entera, ahí mismo, en esa calle, bajo ese cielo lleno de faroles ajenos; o seguir guardándola un poco más, como llevaba guardándola desde antes incluso de conocerlo a él.", "i": false}]}, {"type": "p", "runs": [{"t": "—Hay cosas de mí que todavía no le he contado, Yesir —dijo, al fin, con una voz que sonaba más cansada que evasiva—. No porque no confíe en usted. Es al revés. Es, precisamente, porque confío en usted más que en nadie, que tengo miedo de lo que pueda pasar si el mundo entero se entera de una cosa que yo llevo toda la vida tratando de mantener pequeña.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Qué cosa?", "i": false}]}, {"type": "p", "runs": [{"t": "Ella lo miró un largo momento, con los ojos brillantes de algo que todavía no era del todo miedo, y negó despacio con la cabeza.", "i": false}]}, {"type": "p", "runs": [{"t": "—Todavía no. Se lo prometo, se lo voy a contar. Pero no esta noche. Esta noche solo quiero que sigamos caminando a casa, usted y yo, como cualquier otra noche de faroles.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir, que llevaba seis años aprendiendo a respetar los silencios de su esposa tanto como sus palabras, asintió, y siguieron caminando, y ninguno de los dos sabía todavía que esa promesa —contárselo, pronto, todo— iba a quedar rota no por elección de Danira, sino por algo mucho más rápido y mucho más cruel que cualquier plazo que ella hubiera podido darse a sí misma.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "03-el-mercader-que-no-era-mercader.md", "num": "CAPÍTULO III", "title": "EL MERCADER QUE NO ERA MERCADER", "body": [{"type": "p", "runs": [{"t": "Grisalda no aparecía en ningún mapa iluminado de Pigmalia, porque ningún Iluminador con el color suficiente para pintar un mapa se molestaba ya en incluir un territorio que se había apagado hacía una generación entera.", "i": false}]}, {"type": "p", "runs": [{"t": "Quien llegaba hasta allí —pocos llegaban, y menos volvían a contarlo— encontraba primero una franja de tierra donde el verde de los árboles se veía apagado, como recordado en vez de visto, y después, más adentro, un silencio de color total: piedra gris, agua gris, cielo gris, todo del mismo tono aplastado, como si alguien hubiera tomado el mundo entero y lo hubiera lavado hasta sacarle el alma.", "i": false}]}, {"type": "p", "runs": [{"t": "En el centro de esa nada, sobre las ruinas de lo que una vez había sido el dominio más luminoso de todo Pigmalia, se alzaba el castillo de Grisalda, y en su salón más alto, frente a una ventana sin vidrio que dejaba entrar el mismo aire gris de afuera, esperaba Nébrisa.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El mercader —que no era mercader, y que había cruzado tres días de camino desde Almagre sin detenerse más que lo necesario para que su caballo no cayera muerto— entró al salón con el frasquito todavía guardado con cuidado, como quien lleva algo demasiado valioso para sostenerlo con una sola mano.", "i": false}]}, {"type": "p", "runs": [{"t": "—Mi señora —dijo, inclinándose—. Lo encontré. Una Manantial. En Almagre, disfrazada de simple Iluminadora de aldea.", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa no se giró de inmediato. Llevaba el pelo, alguna vez rojizo, ahora del mismo gris apagado que todo lo demás en ese castillo, recogido en una trenza que ya nadie se molestaba en adornar, y cuando por fin se volvió, su cara tenía la belleza rota de alguien que había sido, mucho tiempo atrás, hermosa de una manera que dolía recordar.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Estás seguro?", "i": false}]}, {"type": "p", "runs": [{"t": "—Vea usted misma, mi señora.", "i": false}]}, {"type": "p", "runs": [{"t": "Destapó el frasquito. El aire capturado en Almagre, con la brizna del color imposible de Danira todavía suspendida en él, se derramó despacio en el salón gris, y por un instante —brevísimo, apenas un parpadeo— una mota diminuta de violeta profundo flotó en medio de toda esa nada, viva, imposible, hermosa.", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa extendió la mano hacia ella, como quien intenta tocar un recuerdo, y la mota se desvaneció antes de llegar a sus dedos.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—Hace quince años que no veo un color así —dijo, con una voz que salía de algún lugar muy hondo—. Hace quince años que no veo ningún color así.", "i": false}]}, {"type": "p", "runs": [{"t": "—Es una Manantial, mi señora. No una simple Iluminadora con buena mano. El color no le fue prestado a ninguna flor ni a ningún recuerdo. Salió de ella misma, y sin fondo, a juzgar por lo que vi.", "i": false}]}, {"type": "p", "runs": [{"t": "En un rincón del salón, sentado con la calma de quien no necesita levantarse para tener el control de una habitación, un hombre delgado de manos pálidas y ojos de un gris tan claro que parecían casi blancos escuchaba sin decir nada. Se llamaba, para quienes se atrevían a llamarlo de alguna manera, el Curador —título que él mismo se había dado, años atrás, con una convicción que nunca había vacilado ni un solo día desde entonces: que su trabajo, por doloroso que resultara para quienes lo pagaban, era el único capaz de salvar lo poco que quedaba de Pigmalia de terminar entero como Grisalda.", "i": false}]}, {"type": "p", "runs": [{"t": "—Una Manantial —repitió, al fin, con una calma que no tenía nada de fría, sino algo peor: la calma tranquila de quien lleva años esperando exactamente esa noticia—. ¿Sabe usted, mi señora, cuántas Cosechas hemos hecho en quince años, cuánta Tinta de Alma ajena hemos gastado tratando de llenar un pozo que nunca deja de estar vacío?", "i": false}]}, {"type": "p", "runs": [{"t": "—Demasiadas —dijo Nébrisa, con un cansancio que le llenaba cada palabra.", "i": false}]}, {"type": "p", "runs": [{"t": "—Porque cosechábamos gotas, mi señora. Un color prestado aquí, otro allá, siempre finito, siempre a medias. Una Manantial no da gotas. Da un río entero, sin fondo, para siempre. —El Curador se puso de pie, despacio, y caminó hasta la ventana sin vidrio, mirando hacia el gris que se extendía hasta donde alcanzaba la vista—. Con el alma-color de una Manantial, mi señora, no tendríamos que volver a cosechar nunca más. Tendríamos, por fin, suficiente.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Nébrisa se quedó callada un largo rato, con la mirada perdida en ese mismo gris infinito que llevaba quince años mirando cada mañana desde esa misma ventana, desde la noche en que el Amaranto —su Amaranto, Fijador de manos firmes y risa fácil, el hombre que había prometido quedarse a su lado hasta que el Gran Lienzo mismo se apagara— había muerto sellando la primera Herida Gris, dejándola sola con un duelo tan absoluto que había terminado, sin que ella lo hubiera querido nunca, vaciando de color todo un dominio.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y si consumimos su alma-color entera? —preguntó, al fin, con una voz que ya no sonaba del todo a duda—. ¿Sería suficiente para… traerlo de vuelta?", "i": false}]}, {"type": "p", "runs": [{"t": "El Curador no respondió de inmediato. Sabía, mejor que nadie en ese castillo, que la pregunta no tenía una respuesta honesta que Nébrisa quisiera escuchar, y sabía también, con la misma claridad fría con que sabía casi todo, que la esperanza —por falsa que fuera— era la única herramienta que todavía le funcionaba para mantenerla de su lado.", "i": false}]}, {"type": "p", "runs": [{"t": "—Bajo la Luna sin Color, mi señora, con el ritual correcto, cualquier cosa es posible. —Se giró a mirarla, con esos ojos casi blancos que nunca terminaban de parecer del todo humanos—. Solo necesitamos traerla. Viva. Antes de que la luna vuelva a esconderse.", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa asintió, despacio, sin saber —porque el Curador, con el mismo cuidado con que había mentido durante quince años, se había asegurado de que nunca lo supiera del todo— que ni él mismo creía de verdad que ningún ritual pudiera devolverle la vida a un muerto. Lo que el Curador quería, lo que había querido desde el principio, era algo mucho más simple y mucho más antiguo que el amor de una viuda por su esposo perdido: el poder entero de una fuente de color que nunca se agotaba, puesto en sus propias manos frías, para hacer con Pigmalia lo que él, en su convicción inquebrantable, llevaba años decidiendo que era necesario hacer.", "i": false}]}, {"type": "p", "runs": [{"t": "—Envía a los Recolectores —dijo Nébrisa—. Que traigan a la Manantial de Almagre.", "i": false}]}, {"type": "p", "runs": [{"t": "—Como usted ordene, mi señora.", "i": false}]}, {"type": "p", "runs": [{"t": "El Curador salió del salón con una sonrisa pequeña que Nébrisa, de espaldas otra vez a la ventana, no llegó a ver.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "04-las-polillas-de-ceniza.md", "num": "CAPÍTULO IV", "title": "LAS POLILLAS DE CENIZA", "body": [{"type": "p", "runs": [{"t": "Llegaron al tercer amanecer después de los Faroles Vivos, cuando la Hora Grana apenas empezaba a gotear por los cerros del oriente.", "i": false}]}, {"type": "p", "runs": [{"t": "Danira las sintió antes de verlas: un frío que no tenía nada que ver con el clima, un vacío que se le metió en el pecho como si alguien hubiera abierto una puerta a un lugar donde el color nunca hubiera existido. Se levantó de golpe, con el corazón latiéndole con una fuerza que la asustó a ella misma, y salió al patio justo a tiempo para verlas cruzar el cielo sobre Almagre: un enjambre entero de polillas grises, cientos, quizás miles, moviéndose todas juntas como una sola nube hambrienta.", "i": false}]}, {"type": "p", "runs": [{"t": "—Yesir —dijo, con una voz que no reconoció como suya—. Yesir, despierte.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Las Polillas de Ceniza no mordían ni picaban. Se posaban, sencillamente, sobre cualquier superficie pintada —una fachada, un mural, la ropa tendida, la piel misma de quien tuviera la mala suerte de cruzarse en su camino— y bebían el color con una lentitud espantosa, dejando tras de sí un gris apagado que ya nunca volvía a su tono original sin la intervención urgente de un Iluminador.", "i": false}]}, {"type": "p", "runs": [{"t": "Almagre entero despertó al mismo tiempo, con gritos que subían desde la plaza, y Yesir corrió afuera con el corazón en la garganta, viendo cómo el mural del ayuntamiento —el mismo que él había fijado apenas una semana atrás— empezaba a perder su rojo bajo el peso de una docena de polillas posadas sobre la esquina sur.", "i": false}]}, {"type": "p", "runs": [{"t": "—¡Fijen lo que puedan! —gritó a los vecinos que ya salían medio dormidos de sus casas—. ¡No dejen que se posen sobre nada que no puedan reemplazar!", "i": false}]}, {"type": "p", "runs": [{"t": "Pero las polillas eran demasiadas, y Almagre, aldea pequeña de tejados rojizos, no tenía Fijadores suficientes para proteger cada superficie a la vez.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "En medio del caos, mientras Yesir corría de casa en casa tratando de salvar lo que se pudiera, tres figuras encapuchadas entraron a la plaza caminando despacio, sin prisa, con la seguridad tranquila de quien sabe que el pánico ajeno solo facilita el trabajo propio: los Recolectores de Ceniza.", "i": false}]}, {"type": "p", "runs": [{"t": "No hablaron. No amenazaron. Se limitaron a caminar directo hacia el taller de Yesir y Danira, como si supieran exactamente adónde ir, y Danira, viéndolos acercarse desde la ventana, entendió, con una claridad helada que le recorrió todo el cuerpo, que el color imposible de la noche de los faroles no había pasado desapercibido después de todo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Vienen por mí —dijo, en voz baja, más para sí misma que para Yesir, que acababa de entrar corriendo, sin aliento, con las manos manchadas de pigmento de emergencia.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Qué dice?", "i": false}]}, {"type": "p", "runs": [{"t": "—Vienen por mí, Yesir. —Se giró a mirarlo, con una determinación que él no le había visto nunca, ni siquiera en los años más difíciles de su matrimonio—. Tengo que contarle algo, y no tengo tiempo de contárselo bien, así que se lo voy a decir rápido y le voy a pedir que confíe en mí de todos modos: no soy solo Iluminadora. Soy Manantial. Lo he sido siempre. Lo escondí, todos estos años, porque tenía miedo de que un día alguien viniera exactamente a buscarme por eso.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir se quedó paralizado un instante, con demasiadas preguntas atropellándose en la garganta a la vez, sin lograr que ninguna saliera primero.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Por qué…?", "i": false}]}, {"type": "p", "runs": [{"t": "—Porque quería una vida normal, Yesir. Quería este taller, y este pueblo, y usted, sin que nadie me mirara como una fuente que hay que explotar en vez de como una persona. —Las lágrimas le brillaban en los ojos, pero su voz no tembló—. No se lo dije porque no confiara en usted. Se lo dije porque confiaba tanto en usted que quería, aunque fuera por unos años más, protegerlo también a usted de lo que significaba estar casado con algo así de valioso.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Los Recolectores llegaron a la puerta del taller.", "i": false}]}, {"type": "p", "runs": [{"t": "—Entréguennos a la Manantial —dijo el primero, con una voz tan gris como su capa—, y el resto del pueblo quedará en paz. Resistan, y no dejaremos ni una sola pared de Almagre con color.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir, sin pensarlo, se puso delante de Danira, con los brazos abiertos como si su propio cuerpo pudiera detener algo que ya sabía, con una certeza amarga, que no podía detener.", "i": false}]}, {"type": "p", "runs": [{"t": "—No se la van a llevar.", "i": false}]}, {"type": "p", "runs": [{"t": "—Yesir. —Danira le puso una mano en el hombro, con una calma que le costaba horrores mantener—. Míreme. Si peleamos, se llevan a Almagre entero con nosotros. Casas, gente, niños. Si me entrego, se llevan solo a mí, y usted tiene una oportunidad de venir a buscarme después, con tiempo, con un plan, en vez de morir aquí mismo intentando algo que no va a funcionar.", "i": false}]}, {"type": "p", "runs": [{"t": "—No.", "i": false}]}, {"type": "p", "runs": [{"t": "—Yesir. —Su voz se quebró, por fin, aunque su determinación no—. No le estoy pidiendo permiso. Se lo estoy contando porque lo amo, y porque un amor de verdad no elige lo que duele menos hoy. Elige lo que salva más mañana.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Se giró hacia los Recolectores antes de que Yesir pudiera decir una palabra más, con la espalda recta y las manos abiertas en un gesto de rendición que no tenía nada de sumisión.", "i": false}]}, {"type": "p", "runs": [{"t": "—Voy con ustedes —dijo—. Sin pelear. Pero les advierto una cosa: lo que le hagan a este pueblo después de que me lleve, se lo van a tener que responder a un Fijador que no va a parar de buscarme hasta encontrarme, así tenga que cruzar todo Pigmalia legua por legua.", "i": false}]}, {"type": "p", "runs": [{"t": "El Recolector no respondió a la amenaza. Se limitó a hacer un gesto, y dos de sus compañeros avanzaron para tomar a Danira por los brazos, con una delicadeza fría que resultaba, de algún modo, más terrible que cualquier violencia abierta.", "i": false}]}, {"type": "p", "runs": [{"t": "—¡Danira! —Yesir intentó alcanzarla, y un tercer Recolector lo detuvo con una fuerza que no parecía humana, sosteniéndolo mientras se la llevaban hacia la plaza, hacia el enjambre de polillas que ya empezaba a replegarse, satisfecho, hacia el camino de vuelta al norte.", "i": false}]}, {"type": "p", "runs": [{"t": "Ella se giró una última vez, ya casi en la puerta, y le sostuvo la mirada con una intensidad que Yesir iba a recordar cada noche de los meses siguientes, sin falta, como el último recuerdo completo que tenía de ella antes de que todo lo demás se volviera búsqueda y espera.", "i": false}]}, {"type": "p", "runs": [{"t": "—Aquí no hay ninguna sombra capaz de robarnos el color, Yesir —dijo, repitiendo sus propias palabras de esa mañana en el patio, una vida entera atrás—. Ninguna. Yo lo voy a buscar a usted en cada legua que camine, aunque no pueda verlo. Encuéntreme.", "i": false}]}, {"type": "p", "runs": [{"t": "Y desapareció por la puerta, tragada por el enjambre gris, dejando a Yesir de rodillas en medio de un taller donde, por primera vez en seis años, ya no quedaba ni rastro del olor a linaza que siempre había significado hogar.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "05-el-silencio-despues.md", "num": "CAPÍTULO V", "title": "EL SILENCIO DESPUÉS", "body": [{"type": "p", "runs": [{"t": "Almagre pasó el resto de esa mañana en un silencio que ningún Fijador podía reparar, porque no era un silencio de color, sino uno mucho más antiguo y mucho más difícil de nombrar.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir se quedó de rodillas en la plaza un tiempo que no supo calcular, hasta que la señora Olalla —la misma cuyo difunto marido él había restaurado apenas unos días atrás— lo levantó del suelo con una firmeza que no admitía discusión.", "i": false}]}, {"type": "p", "runs": [{"t": "—No se va a quedar ahí sentado, muchacho —dijo, con la voz quebrada pero decidida—. Levántese. Todavía hay pueblo que salvar, y después hay esposa que buscar, y ninguna de las dos cosas se hace desde el suelo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El pueblo entero se organizó esa tarde, con esa clase de eficiencia silenciosa que solo aparece cuando una comunidad pequeña recibe un golpe que la obliga a recordar que es, en el fondo, una sola familia extendida. Los Iluminadores que quedaban revisaron muro por muro, fijando lo que las polillas habían dejado a medio devorar; los niños, con esa resiliencia terrible y hermosa que solo tienen los niños, ayudaron a recoger frascos de pigmento caído; y en el centro de la plaza, frente al mural del ayuntamiento que había quedado con la esquina sur completamente gris, alguien —Yesir nunca supo con certeza quién había empezado— colocó un cuenco de agua con pétalos de amapola, igual al que Danira usaba cada mañana, como una especie de altar improvisado a la espera de su regreso.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir se quedó mirando ese cuenco un largo rato, sintiendo que el pecho se le partía de una manera nueva, distinta a cualquier dolor que hubiera conocido antes.", "i": false}]}, {"type": "p", "runs": [{"t": "—El mural del ayuntamiento —le dijo a la señora Olalla, señalando la esquina gris—. Ese mural cambió el día que nos casamos. El pueblo lo pintó con un poco del Alba Doble, nuestro Trenzado, para tenerlo siempre a la vista. Decían que mientras el color de esa esquina se mantuviera brillante, nuestro matrimonio también.", "i": false}]}, {"type": "p", "runs": [{"t": "—Lo sé, hijo. Todo Almagre lo sabe.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir se acercó al muro y pasó los dedos por la superficie gris, sintiendo bajo ellos apenas un resto tibio de color, casi apagado, como el último rescoldo de una hoguera que se niega a morir del todo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Todavía queda algo —dijo, con una esperanza que le costó admitir en voz alta—. No está del todo gris. Todavía queda algo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "En la muñeca de Yesir, la línea fina del Alba Doble —el mismo color que llevaba seis años tocándose cada mañana sin pensarlo— seguía ahí, pero apagada, como si alguien le hubiera bajado la intensidad a una lámpara sin llegar a apagarla del todo.", "i": false}]}, {"type": "p", "runs": [{"t": "Se la miró esa noche, a solas en el taller vacío, sentado en el mismo banco donde había fijado tantos colores ajenos sin saber nunca, hasta ese día, lo que se sentía necesitar fijar algo propio y no poder.", "i": false}]}, {"type": "p", "runs": [{"t": "—Sigue ahí —susurró, repitiendo las mismas palabras que le decía a Danira cada mañana, aunque esta vez sin nadie que le respondiera ", "i": false}, {"t": "¿y dónde más iba a estar?", "i": true}, {"t": "—. Sigue ahí. Voy a encontrarla. Sigue ahí.", "i": false}]}, {"type": "p", "runs": [{"t": "No supo, esa primera noche de tantas que vendrían, que ese susurro —repetido sin falta cada noche, como una plegaria que era también, sin que él todavía lo supiera del todo, una forma real de magia— iba a ser lo único que mantendría el Alba Doble con vida durante los meses de viaje que tenía por delante.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Al amanecer siguiente, con la Hora Grana bañando un Almagre todavía convaleciente, Yesir empacó lo que necesitaba: pigmentos de emergencia, sus mejores pinceles de Fijador, una manta, y el cuenco de pétalos de amapola que Danira usaba cada mañana, envuelto con cuidado en tela para que no se rompiera en el camino.", "i": false}]}, {"type": "p", "runs": [{"t": "La señora Olalla lo esperaba en la puerta del taller, con un atado de pan y queso y una expresión que no admitía discusión.", "i": false}]}, {"type": "p", "runs": [{"t": "—Va a necesitar comer, muchacho, aunque no tenga hambre.", "i": false}]}, {"type": "p", "runs": [{"t": "—Gracias.", "i": false}]}, {"type": "p", "runs": [{"t": "—No me dé las gracias a mí. Tráigala de vuelta, y considérese pagado. —Le puso una mano en el brazo, con una firmeza maternal que a Yesir le recordó, con una punzada de dolor, algo de su propia madre, muerta hacía años—. Todo Almagre va a estar aquí cuando vuelvan los dos. Se lo prometo.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir asintió, incapaz de decir nada más sin quebrarse, y montó el caballo que el pueblo entero había insistido en prestarle —el mejor que quedaba, después de que las polillas hubieran espantado a la mitad de los animales del establo comunal—, y salió por el camino del norte, hacia un continente que, aunque él todavía no lo sabía con certeza, ya había empezado, legua a legua, a perder su color.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "end-marker", "text": "FIN DE LA PRIMERA PARTE"}, {"type": "ornament", "text": "✧ ✦ ✧"}]}]}, {"id": "segunda", "theme": "gris", "label": "Segunda Parte", "subtitle": "LA MAREA GRIS", "chapters": [{"file": "06-el-camino-sin-verde.md", "num": "CAPÍTULO VI", "title": "EL CAMINO SIN VERDE", "body": [{"type": "p", "runs": [{"t": "Al quinto día de camino, Yesir cruzó un bosque que debería haber sido verde y no lo era.", "i": false}]}, {"type": "p", "runs": [{"t": "No de golpe, como si alguien hubiera pasado un pincel gris sobre los árboles. Era algo más lento y más triste: las hojas más altas, las que recibían primero la luz del Gran Lienzo, todavía guardaban un resto de clorofila pálida, pero cuanto más bajaba la vista hacia el suelo del bosque, más se acercaba todo a un gris uniforme, como si el color mismo se estuviera escurriendo hacia abajo, hacia las raíces, huyendo de algo que Yesir todavía no lograba nombrar del todo.", "i": false}]}, {"type": "p", "runs": [{"t": "Ató el caballo y caminó un trecho a pie, tocando los troncos con la misma atención con que tocaba cualquier superficie que necesitara fijar, y sintió, bajo la palma, el mismo vacío helado que había sentido Danira la mañana en que llegaron las polillas.", "i": false}]}, {"type": "p", "runs": [{"t": "—Esto es lo que se siente —murmuró, para nadie, para sí mismo, para el bosque entero que ya no podía escucharlo del todo—. Esto es lo que ella sintió antes que todos nosotros.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Encontró la primera miga de color esa misma tarde, cuando ya el sol —si es que todavía tenía sentido llamarlo sol en un cielo que empezaba a perder su propia definición— caía hacia el horizonte.", "i": false}]}, {"type": "p", "runs": [{"t": "Era una flor. Una sola, diminuta, de un violeta profundo, creciendo en medio de un claro donde todo lo demás era ceniza y tierra apagada, imposible en cualquier lógica salvo una: alguien, con una voluntad que desafiaba toda razón, la había hecho crecer ahí a propósito, dejando un rastro tan pequeño que cualquiera menos él lo habría pasado de largo sin notarlo.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir se arrodilló frente a la flor con una emoción que le cerró la garganta.", "i": false}]}, {"type": "p", "runs": [{"t": "—Es suya —dijo, tocándola con dedos temblorosos—. Es de Danira. Está viva. Está dejando un camino.", "i": false}]}, {"type": "p", "runs": [{"t": "No tenía manera de saber, con certeza, cómo lograba Danira sembrar semejantes migas de color desde dentro de su cautiverio, ni cuánto le costaba a ella cada una de esas pequeñas rebeliones. Pero entendió, arrodillado frente a esa flor imposible, que su esposa no estaba esperando pasivamente a que la rescataran. Estaba luchando, a su manera, desde el primer minuto, y cada miga que dejaba atrás era, a la vez, una guía para él y una prueba de que seguía siendo, en lo más hondo, exactamente la mujer que él conocía.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Esa noche, acampando junto al claro, Yesir se tocó la muñeca izquierda antes de dormir, buscando el Alba Doble bajo la luz de una fogata pequeña.", "i": false}]}, {"type": "p", "runs": [{"t": "Seguía ahí. Apagado, más de lo que había estado en Almagre, pero ahí, y por primera vez desde que había empezado el viaje, Yesir sintió algo nuevo cuando lo tocó: no solo el color, sino un pulso débil, casi imperceptible, latiendo bajo su propia piel al mismo ritmo con que él imaginaba —porque no tenía manera de saberlo con certeza, solo de sentirlo— que latía el corazón de Danira, muy lejos, en algún castillo gris que él todavía no había visto.", "i": false}]}, {"type": "p", "runs": [{"t": "Cerró los ojos y se concentró en ese pulso, aprendiendo, sin que nadie se lo hubiera enseñado nunca, un lenguaje nuevo: el de sentir a su esposa no con los ojos, sino con la piel misma, un segundo latido que se sumaba al suyo propio y que, mientras siguiera ahí, significaba que ella también seguía luchando, en alguna parte, por seguir siendo ella misma.", "i": false}]}, {"type": "p", "runs": [{"t": "—Sigo aquí —susurró, con los ojos cerrados, repitiendo el mismo mantra de la primera noche—. Sigo aquí, Danira. Sigo caminando.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Al séptimo día encontró al primer Restaurador: un hombre mayor, de manos manchadas de pigmento permanente y una capa remendada con parches de todos los colores imaginables, que viajaba en dirección contraria a la suya, hacia el sur, hacia lo que quedaba de color en el mundo.", "i": false}]}, {"type": "p", "runs": [{"t": "—No siga por ahí, muchacho —le advirtió el hombre, deteniendo su propio caballo—. Ese camino lleva derecho al territorio de la Marea Gris. Ahí no queda nada que valga la pena ver, salvo la ceniza de lo que una vez fue hermoso.", "i": false}]}, {"type": "p", "runs": [{"t": "—Voy justamente ahí. Se llevaron a mi esposa.", "i": false}]}, {"type": "p", "runs": [{"t": "El Restaurador lo estudió un largo momento, con esa mirada de quien ha visto suficiente dolor ajeno como para reconocerlo sin necesidad de que se lo expliquen dos veces.", "i": false}]}, {"type": "p", "runs": [{"t": "—Entonces no le voy a decir que no vaya. Pero le voy a decir esto: si de verdad quiere cruzar ese continente y volver, va a necesitar más que voluntad. Va a necesitar aprender rápido cosas que a mí me tomaron años de oficio. Vaya a Alizar. Ahí encontrará el gremio entero de los Restauradores, y quizás, si tiene suerte, alguien dispuesto a enseñarle en semanas lo que normalmente se aprende en años.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y usted? ¿Por qué no me acompaña?", "i": false}]}, {"type": "p", "runs": [{"t": "El hombre sonrió, una sonrisa cansada pero genuina.", "i": false}]}, {"type": "p", "runs": [{"t": "—Porque yo ya perdí mi propia batalla contra ese gris hace mucho tiempo, muchacho, y aprendí a hacer las paces con lo que no pude salvar. Pero usted todavía tiene una oportunidad que a mí se me escapó. No la desperdicie parándose a hablar con viejos como yo más de lo necesario.", "i": false}]}, {"type": "p", "runs": [{"t": "Le señaló el camino hacia el norte, hacia Alizar, y siguió su propio rumbo hacia el sur, dejando a Yesir con una dirección nueva y una determinación todavía más firme que la que había salido de Almagre.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "07-la-flor-de-ceniza.md", "num": "CAPÍTULO VII", "title": "LA FLOR DE CENIZA", "body": [{"type": "p", "runs": [{"t": "La celda de Danira no tenía barrotes. No los necesitaba.", "i": false}]}, {"type": "p", "runs": [{"t": "Estaba en lo alto de la torre más alta de Grisalda, en una habitación de piedra gris sin ninguna puerta que ella pudiera abrir desde dentro, con una sola ventana estrecha por donde entraba el mismo aire sin color de todo el castillo. Los Recolectores la habían tratado, desde el primer día, con una cortesía fría que resultaba casi más difícil de soportar que cualquier crueldad abierta: le llevaban comida, agua limpia, una manta para las noches frías, todo con la eficiencia práctica de quien cuida un recurso valioso, no una prisionera.", "i": false}]}, {"type": "p", "runs": [{"t": "Danira entendió, desde la primera noche, que su valor para ellos dependía enteramente de que llegara viva e intacta hasta la Luna sin Color. Y entendió, también, que esa misma dependencia era, quizás, la única ventaja que tenía.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—No van a quebrarme con silencio —se dijo a sí misma, la primera mañana, mirando las paredes grises de su celda con la misma determinación práctica con que había mirado, tantas veces, un muro que necesitaba restauración.", "i": false}]}, {"type": "p", "runs": [{"t": "Cerró los ojos, y dejó que un hilo delgado de su propio color —el violeta profundo que llevaba toda la vida aprendiendo a contener— le subiera por dentro de las venas hasta la punta de los dedos.", "i": false}]}, {"type": "p", "runs": [{"t": "No tenía pigmento. No tenía pinceles. No tenía nada de lo que un Iluminador normalmente necesitaba para trabajar.", "i": false}]}, {"type": "p", "runs": [{"t": "Pero ella no era una Iluminadora normal.", "i": false}]}, {"type": "p", "runs": [{"t": "Tocó el suelo de piedra gris de su celda, justo en la esquina más cercana a la ventana, y dejó salir, gota a gota, con un esfuerzo que le costó más de lo que jamás había admitido delante de nadie, el color suficiente para que, en el espacio de una uña, brotara una flor diminuta: pétalos violetas contra la piedra ceniza, tan pequeña que un Recolector descuidado podría no notarla nunca, pero viva, real, imposible en un lugar donde nada más crecía.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "La cuidó cada día, sin decírselo a nadie, alimentándola con hilos cada vez más pequeños de su propio color, aprendiendo a medir exactamente cuánto podía darle sin dejarse a sí misma demasiado débil para las tareas que sabía que tendría por delante.", "i": false}]}, {"type": "p", "runs": [{"t": "—Vas a durar —le decía a la flor, en voz baja, cada mañana, con la misma ternura que le hablaba a Yesir—. Vas a durar hasta que él llegue.", "i": false}]}, {"type": "p", "runs": [{"t": "Porque Danira sabía, con una certeza que ningún Recolector ni ningún Curador podía quitarle, que Yesir venía. No porque tuviera ninguna prueba concreta, ninguna carta, ningún mensaje que hubiera logrado cruzar los muros de Grisalda. Lo sabía de la misma manera en que sabía que el azafrán sabía a mediodía: con el cuerpo entero, más allá de cualquier razón que pudiera explicarlo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Al décimo día, uno de los Recolectores más jóvenes —un muchacho que no debía tener más de dieciocho años, con una cara que todavía no había aprendido del todo a esconder la compasión bajo la disciplina del uniforme gris— la sorprendió arrodillada junto a la flor, y por un instante Danira pensó que la iba a delatar, o peor, que la iba a aplastar bajo su bota como quien elimina una travesura.", "i": false}]}, {"type": "p", "runs": [{"t": "El muchacho se quedó mirando la flor un largo rato, en silencio, y después, sin decir una palabra, se giró y salió de la celda, cerrando la puerta despacio, como quien no quiere hacer ruido en un lugar que, sin saberlo del todo, acababa de reconocer como sagrado.", "i": false}]}, {"type": "p", "runs": [{"t": "Danira no supo, esa vez ni ninguna de las siguientes en que el mismo muchacho la sorprendió cuidando su pequeña rebelión y decidió, cada vez, mirar hacia otro lado, que ese pequeño gesto de humanidad —tan pequeño que ni el muchacho mismo se atrevería a llamarlo desobediencia— iba a resultar, meses después, decisivo para todo lo que estaba por venir.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Por las noches, cuando el castillo entero se quedaba en ese silencio gris que ya no la sorprendía tanto como al principio, Danira se tocaba la muñeca izquierda, buscando el Alba Doble bajo la piel, y lo encontraba siempre, apagado pero presente, latiendo con un pulso que ella había aprendido, sin que nadie se lo explicara, a leer como un mensaje: ", "i": false}, {"t": "sigo aquí, sigo caminando, sigo aquí.", "i": true}]}, {"type": "p", "runs": [{"t": "—Sigo aquí también, Yesir —susurraba de vuelta, cada noche, sin saber si de algún modo, a través de ese hilo delgado que los unía, sus palabras llegaban hasta él o se perdían en el aire gris de la torre—. Encuéntreme. Yo voy a seguir aquí, esperándolo, tanto tiempo como haga falta.", "i": false}]}, {"type": "p", "runs": [{"t": "Y en algún punto del camino, a leguas de distancia, Yesir, dormido junto a una fogata pequeña, sonreía sin saber por qué, como si algo tibio y violeta le hubiera rozado el pecho justo en ese instante.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "08-alizar.md", "num": "CAPÍTULO VIII", "title": "ALIZAR, LA CIUDAD QUE SE REPINTA", "body": [{"type": "p", "runs": [{"t": "Yesir vio Alizar por primera vez desde una colina, al amanecer, y el espectáculo lo detuvo en seco a pesar de la prisa que llevaba encima desde hacía dos semanas de camino.", "i": false}]}, {"type": "p", "runs": [{"t": "La capital de Pigmalia se extendía sobre siete colinas, con torres y cúpulas y fachadas de todos los colores imaginables, y en ese preciso instante —la Hora Grana bañándolo todo de rojo— cientos de figuras diminutas, vistas desde la distancia como hormigas trepando por los tejados, se movían con una coordinación que solo podía ser fruto de generaciones enteras de práctica: cuadrillas de Iluminadores y Fijadores repintando la ciudad entera antes de que el sol terminara de subir.", "i": false}]}, {"type": "p", "runs": [{"t": "—Cada amanecer —murmuró Yesir, recordando lo que Danira le había contado tantas veces, sin haberlo visto nunca con sus propios ojos—. Cada amanecer, sin falta.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Encontró el gremio de los Restauradores en un edificio cerca del puerto, un salón enorme lleno de bancos de trabajo, frascos etiquetados con una precisión casi obsesiva, y el mismo olor a linaza y cochinilla que él conocía de memoria desde su propio taller, multiplicado por cien.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Un Fijador de aldea, buscando entrenamiento urgente para cruzar la Marea Gris? —La mujer que lo recibió, una Restauradora de mediana edad con las manos más manchadas de pigmento que Yesir había visto en su vida, lo miró con una mezcla de escepticismo y curiosidad—. Eso no se aprende en semanas, muchacho. Nos toma años enseñar a alguien a sobrevivir ahí afuera.", "i": false}]}, {"type": "p", "runs": [{"t": "—No tengo años. Tengo, como mucho, hasta la próxima Luna sin Color.", "i": false}]}, {"type": "p", "runs": [{"t": "La mujer se quedó callada, con una expresión que cambió, poco a poco, de escepticismo a algo más parecido a la alarma.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Cómo sabe usted de la Luna sin Color?", "i": false}]}, {"type": "p", "runs": [{"t": "—Porque es la fecha en que van a usar a mi esposa en un ritual que le va a robar, para siempre, la capacidad de sentir amor. Es Manantial. Se la llevaron los Recolectores de Grisalda hace dos semanas.", "i": false}]}, {"type": "p", "runs": [{"t": "Un silencio pesado cayó sobre el salón entero. Varios Restauradores que trabajaban cerca dejaron sus pinceles a medio camino, mirando a Yesir con una atención nueva.", "i": false}]}, {"type": "p", "runs": [{"t": "—Una Manantial —repitió la mujer, en voz baja—. Llevábamos generaciones sin oír de una Manantial de verdad. Pensábamos que ya no quedaba ninguna.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Se llamaba Fresia, y era, según le explicaron los demás Restauradores con un respeto que no dejaba lugar a dudas, la mejor Fijadora que Alizar había producido en dos generaciones. Escuchó la historia completa de Yesir —Almagre, los faroles, las polillas, la entrega de Danira— sin interrumpir ni una sola vez, y cuando terminó, se puso de pie con una determinación repentina que sorprendió a todos en el salón.", "i": false}]}, {"type": "p", "runs": [{"t": "—Le voy a enseñar lo que sé —dijo—. No en años. En semanas, porque no tenemos más tiempo que ese. Va a ser agotador, va a dolerle, y probablemente va a odiarme antes de que termine. Pero si de verdad quiere tener alguna oportunidad de cruzar ese continente y volver con vida, junto con su esposa, esto es lo mínimo que puedo hacer.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Por qué me ayuda? No me conoce de nada.", "i": false}]}, {"type": "p", "runs": [{"t": "Fresia lo miró un largo momento, con una tristeza vieja que Yesir no supo interpretar del todo.", "i": false}]}, {"type": "p", "runs": [{"t": "—Porque yo también perdí a alguien, hace muchos años, por no saber a tiempo lo que sé ahora. No pienso quedarme sentada viendo a otro hombre cometer el mismo error por falta de instrucción, cuando tengo la instrucción entera en mis propias manos para dársela.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Las semanas siguientes fueron, tal como Fresia había prometido, agotadoras. Yesir aprendió a fijar colores bajo condiciones extremas —viento, lluvia, oscuridad total—, a extraer pigmento de fuentes que jamás habría considerado antes —la corteza de un árbol moribundo, el sudor de su propia frente, el eco de un recuerdo doloroso—, y sobre todo, aprendió algo que Fresia insistía en repetirle cada día, como una lección más importante que cualquier técnica:", "i": false}]}, {"type": "p", "runs": [{"t": "—El color que se extrae de un recuerdo compartido, Yesir, es el más poderoso de todos, porque no depende de una sola persona. Depende de dos. Si usted logra recordar algo que compartió de verdad con su esposa —no solo lo que usted vivió, sino lo que los dos vivieron juntos—, el pigmento que saque de ahí va a ser más fuerte que cualquier cosa que yo pueda enseñarle a fabricar solo.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Cómo se hace eso?", "i": false}]}, {"type": "p", "runs": [{"t": "—Se hace cerrando los ojos, y recordando de verdad, no solo con la cabeza sino con todo el cuerpo, hasta que el recuerdo deje de ser pasado y se vuelva, otra vez, presente.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir practicó esa noche, solo, en el cuarto que Fresia le había prestado, cerrando los ojos y dejando que la memoria de una tarde cualquiera —el guiso que sabía a un domingo de hacía diez años, la risa de Danira bajo la luz de la Hora Añil, la primera vez que se habían trenzado las Tintas de Alma— le subiera por dentro hasta las manos.", "i": false}]}, {"type": "p", "runs": [{"t": "Cuando abrió los ojos, tenía en las palmas un pigmento violeta-ámbar que no había existido en el mundo hasta ese preciso instante: una gota diminuta de Alba Doble, extraída no de ningún frasco sino de su propia memoria compartida.", "i": false}]}, {"type": "p", "runs": [{"t": "—Está listo —dijo Fresia, observándolo desde la puerta con una expresión que era, por primera vez desde que se conocían, orgullo puro—. Más listo de lo que cualquier alumno mío ha estado nunca en tan poco tiempo. Ahora vaya, Yesir. El continente que se apaga no va a esperar a que usted termine de sentirse preparado.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "09-el-primer-peaje.md", "num": "CAPÍTULO IX", "title": "EL PRIMER PEAJE", "body": [{"type": "p", "runs": [{"t": "Tres días al norte de Alizar, el camino se estrechaba entre dos acantilados de roca gris, y ahí, bloqueando el único paso posible, esperaba algo que no era del todo humano ni del todo bestia: un Guardián de la Frontera, criatura antigua nacida —según le había advertido Fresia antes de partir— en los primeros tiempos en que Grisalda había empezado a apagarse, cuando la línea entre lo vivo y lo perdido todavía no estaba del todo trazada.", "i": false}]}, {"type": "p", "runs": [{"t": "Tenía forma vagamente humana, envuelta en una capa que parecía tejida de la misma ceniza del suelo, y cuando Yesir se acercó, dos ojos sin color —ni siquiera grises, simplemente ausentes— se abrieron en lo que debía ser su cara.", "i": false}]}, {"type": "p", "runs": [{"t": "—Nadie cruza sin pagar —dijo, con una voz que sonaba como piedras rozándose—. El peaje de esta frontera es un recuerdo. Uno feliz. Entrégelo, y el paso es suyo.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Yesir dudó, con una mano ya sobre el pincel que Fresia le había regalado al partir, sin saber exactamente qué significaba \"entregar\" un recuerdo, ni qué le costaría después no tenerlo.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y si me niego?", "i": false}]}, {"type": "p", "runs": [{"t": "—Entonces la Marea Gris lo alcanza aquí mismo, sin necesidad de que yo mueva un dedo. El paso es la única grieta segura en toda esta frontera. El resto ya es territorio perdido.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir pensó en Danira, en la flor de ceniza que imaginaba floreciendo en algún rincón de Grisalda, en cada día que pasaba acercando más la fecha de la Luna sin Color, y entendió que no tenía tiempo para buscar otro camino.", "i": false}]}, {"type": "p", "runs": [{"t": "—Está bien. ¿Cómo se entrega un recuerdo?", "i": false}]}, {"type": "p", "runs": [{"t": "—Ciérrelo en pigmento, y démelo. El recuerdo queda conmigo. Usted sigue sabiendo que ocurrió, en teoría, pero deja de poder sentirlo del todo. Como una historia que le contaron sobre usted mismo, en vez de algo que vivió de verdad.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Yesir cerró los ojos y buscó, entre todos los recuerdos felices que tenía con Danira, uno que pudiera soportar perder.", "i": false}]}, {"type": "p", "runs": [{"t": "Pensó primero en su boda, en el Trenzado de Tintas, y descartó la idea de inmediato: ese no. Ese jamás. Pensó en la primera vez que se habían conocido, en un mercado de pigmentos donde ella había regateado con tanta ferocidad por un frasco de cinabrio que él se había enamorado antes incluso de saber su nombre —tampoco ese, no todavía, no cuando lo necesitaba tanto para seguir reconociéndola cuando la encontrara.", "i": false}]}, {"type": "p", "runs": [{"t": "Al fin, encontró uno: una tarde cualquiera, sin ninguna fecha especial, en que habían pasado horas enteras sentados en el patio sin hacer nada más que hablar de tonterías, riéndose de nada en particular, con la Hora Añil cayendo despacio sobre los dos. Un recuerdo hermoso, pero no irremplazable —de esos que uno acumula tantos, en un matrimonio largo, que perder uno solo no debería dejar un vacío insoportable.", "i": false}]}, {"type": "p", "runs": [{"t": "Lo cerró en pigmento, con las manos temblando, y se lo entregó al Guardián.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El Guardián tomó el pigmento y lo absorbió entero, sin ceremonia, y por un instante Yesir sintió algo parecido a un tirón suave detrás de los ojos, como si alguien le hubiera quitado, con mucho cuidado, una página de un libro que ya no podría releer.", "i": false}]}, {"type": "p", "runs": [{"t": "—El paso es suyo —dijo el Guardián, apartándose de la entrada al desfiladero—. Que le sirva de algo, forastero. Pocos llegan tan lejos con la determinación intacta.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir cruzó, con un peso nuevo en el pecho que no supo nombrar del todo: no dolor exactamente, sino una especie de hueco pequeño, la ausencia consciente de algo que sabía que había existido sin poder ya sentir por qué había importado.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Esa noche, acampando ya del otro lado de la frontera, en un territorio donde el gris empezaba a ganarle terreno definitivamente al color, Yesir se tocó la muñeca izquierda, buscando el consuelo del Alba Doble.", "i": false}]}, {"type": "p", "runs": [{"t": "Seguía ahí. Débil, pero ahí.", "i": false}]}, {"type": "p", "runs": [{"t": "—Perdí una tarde de las nuestras —le dijo, en voz baja, al color apagado bajo su piel, como si Danira pudiera oírlo de algún modo a través de ese hilo delgado que los unía—. No sé cuál. Sé que la perdí, pero ya no sé cuál era. Espero que no le importe. Espero que entienda que lo hice por llegar hasta usted más rápido.", "i": false}]}, {"type": "p", "runs": [{"t": "El pulso bajo su piel, el mismo que había aprendido a leer como un segundo latido, se agitó un instante, casi como si respondiera, y Yesir decidió, sin ninguna prueba real más que la fe pura, que Danira lo entendía. Que en algún lugar de esa torre gris, ella también sabía, sin que nadie se lo hubiera dicho, que él ya estaba pagando precios reales por llegar hasta ella, y que cada precio pagado era, a su manera, otra prueba de amor tan real como cualquier palabra dicha en voz alta.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "10-nebrisa.md", "num": "CAPÍTULO X", "title": "NÉBRISA", "body": [{"type": "p", "runs": [{"t": "Nébrisa no siempre había sido gris.", "i": false}]}, {"type": "p", "runs": [{"t": "Quince años atrás, Grisalda había sido el dominio más luminoso de todo Pigmalia, tan cargado de color que los viajeros cruzaban el reino entero solo para ver sus jardines en la Hora Grana, cuando el rojo del amanecer se mezclaba con las mil variedades de flores que el propio Amaranto, Fijador de manos firmes y risa fácil, se había dedicado a coleccionar durante años, una por una, hasta convertir el castillo entero en un jardín viviente.", "i": false}]}, {"type": "p", "runs": [{"t": "Se habían casado jóvenes, con un Trenzado de Tintas tan brillante —un dorado-esmeralda que la gente venía de leguas a admirar— que los ancianos del reino decían, sin exagerar demasiado, que era el color marital más hermoso que Pigmalia había producido en generaciones.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "La Herida Gris no había sido, al principio, más que un rumor lejano: una grieta pequeña en algún territorio fronterizo, donde por razones que ningún Iluminador lograba explicar del todo, el color había empezado a desaparecer. El Amaranto, con esa terquedad valiente que Nébrisa había amado desde el primer día, había insistido en ir a sellarla él mismo, convencido de que su don de Fijador —el más fuerte que Grisalda había visto en años— era exactamente lo que hacía falta.", "i": false}]}, {"type": "p", "runs": [{"t": "—Vuelvo antes de que se ponga el sol —le había prometido, besándola en la puerta del castillo, con la misma sonrisa fácil de siempre—. No te preocupes tanto, Nébrisa. Ya sabes que a mí las heridas grises no me asustan.", "i": false}]}, {"type": "p", "runs": [{"t": "No volvió antes de que se pusiera el sol. No volvió nunca.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Lo que Nébrisa supo después, contado por los pocos soldados que habían logrado regresar, era que el Amaranto había logrado sellar la Herida —había cumplido, en el fondo, exactamente lo que había prometido—, pero el esfuerzo le había costado algo que ningún Fijador, por fuerte que fuera, podía sobrevivir: fijar una herida tan grande requería entregar el propio color a cambio, y el Amaranto, sin dudarlo un instante, lo había entregado entero.", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa no había gritado cuando le dieron la noticia. No había llorado, tampoco, ni esa noche ni ninguna de las siguientes.", "i": false}]}, {"type": "p", "runs": [{"t": "Simplemente había dejado, poco a poco, de sentir. Y el duelo, tan absoluto que ni ella misma supo nunca calcular su verdadero tamaño, había empezado a vaciar de color, sin que nadie pudiera detenerlo, todo lo que la rodeaba: los jardines primero, después las torres, después el pueblo entero que dependía de Grisalda para vivir.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—¿Sabe usted, mi señora, que hay un joven guardia que se niega a reportar a la Manantial cuando la encuentra cuidando algo en su celda? —preguntó el Curador, una tarde, con ese tono suyo que siempre sonaba a información útil aunque nunca se supiera del todo con qué intención la ofrecía.", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa levantó la vista, sin mucho interés real.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Qué está cuidando?", "i": false}]}, {"type": "p", "runs": [{"t": "—Una flor, mi señora. La hace crecer de su propio color, en medio de una celda de piedra sin nada más vivo alrededor.", "i": false}]}, {"type": "p", "runs": [{"t": "Algo se movió en el pecho de Nébrisa, algo que llevaba quince años dormido y que no reconoció de inmediato.", "i": false}]}, {"type": "p", "runs": [{"t": "—Llévame a verla.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Subió a la torre esa misma noche, sin anunciarse, y encontró a Danira arrodillada junto a la ventana, con las manos ahuecadas alrededor de una flor violeta tan pequeña que Nébrisa tuvo que acercarse mucho para verla del todo.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Por qué se molesta? —preguntó, sin ninguna hostilidad real en la voz, más curiosidad genuina que otra cosa—. Sabe que la vamos a usar de todos modos. ¿De qué le sirve mantener viva una flor tan pequeña?", "i": false}]}, {"type": "p", "runs": [{"t": "Danira levantó la vista, sin ningún miedo visible, y respondió con una calma que sorprendió a Nébrisa más de lo que hubiera querido admitir.", "i": false}]}, {"type": "p", "runs": [{"t": "—Porque mientras esta flor siga viva, yo también sigo siendo yo misma, y no solo la fuente que ustedes quieren cosechar. —Hizo una pausa, estudiando a Nébrisa con una atención que no tenía nada de acusatoria—. Usted también perdió a alguien, ¿verdad? Se le nota. Nadie llega a vaciar de color un dominio entero por maldad simple. Solo el dolor de verdad hace eso.", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa se quedó callada un largo momento, sintiendo que algo se le apretaba en el pecho, algo que llevaba quince años sin permitirse sentir.", "i": false}]}, {"type": "p", "runs": [{"t": "—A mi esposo. Lo perdí sellando una Herida Gris, hace quince años.", "i": false}]}, {"type": "p", "runs": [{"t": "—Lo siento mucho.", "i": false}]}, {"type": "p", "runs": [{"t": "—No lo sienta. Nadie lo siente lo suficiente como para devolvérmelo. —Pero la voz de Nébrisa, al decirlo, ya no sonaba tan segura como quince años de repetir esa misma frase deberían haberla hecho sonar.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "—¿Y si consumirme no lo trae de vuelta? —preguntó Danira, con una suavidad que no pretendía herir sino, de algún modo, ayudar—. ¿Ha pensado en eso, mi señora? ¿Qué va a hacer, con todo ese color robado, si al final de todo su esposo sigue sin volver?", "i": false}]}, {"type": "p", "runs": [{"t": "Nébrisa no respondió. Se dio media vuelta y salió de la celda sin decir una palabra más, pero esa noche, por primera vez en quince años, no logró conciliar el sueño, dándole vueltas a una pregunta que el Curador, con todo su cuidado y toda su paciencia, se había asegurado siempre de que ella nunca llegara a hacerse en voz alta.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "11-el-peaje-doloroso.md", "num": "CAPÍTULO XI", "title": "EL PEAJE DOLOROSO", "body": [{"type": "p", "runs": [{"t": "El segundo Guardián que Yesir encontró, dos semanas más adentro del territorio apagado, no pedía recuerdos felices.", "i": false}]}, {"type": "p", "runs": [{"t": "—El peaje de esta frontera es distinto —dijo, con la misma voz de piedras rozándose que había tenido el primero, aunque esta criatura era más alta, más delgada, con una capa que parecía tejida de humo en vez de ceniza—. Aquí se paga con dolor. Entrégueme un recuerdo triste, uno de verdad, no cualquier tristeza pequeña que le sobre. Si intenta engañarme con algo que no le duela lo suficiente, lo voy a saber, y el paso se le va a cerrar para siempre.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir sintió que se le helaba algo por dentro, mucho más que con el primer peaje.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Por qué dolor?", "i": false}]}, {"type": "p", "runs": [{"t": "—Porque el dolor real revela más de una persona que cualquier felicidad. Cualquiera puede fingir un recuerdo feliz que en realidad nunca le importó tanto. Nadie finge de verdad un dolor que todavía le sangra. Este territorio no deja pasar a nadie que no esté dispuesto a mostrar, de verdad, lo que lo rompe por dentro.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Yesir cerró los ojos, y esta vez no tuvo que buscar mucho.", "i": false}]}, {"type": "p", "runs": [{"t": "Pensó en la noche, apenas unos meses atrás de aquella otra vida que ya le parecía tan lejana, en que Danira había estado enferma de una fiebre que ningún Iluminador del pueblo había sabido curar del todo, y él se había quedado tres noches enteras sin dormir, sentado junto a su cama, aterrado de una manera que no había sentido nunca antes, pensando —por primera vez en seis años de matrimonio— en lo que significaría de verdad perderla, no a manos de ningún villano ni de ninguna Marea Gris, sino simplemente a manos de la vida misma, tan frágil, tan capaz de arrebatarle a uno lo que más ama sin ningún aviso ni ninguna razón.", "i": false}]}, {"type": "p", "runs": [{"t": "Había sobrevivido, claro. La fiebre había cedido al cuarto día, y Danira se había reído de él, semanas después, por lo pálido que se había puesto viéndola delirar. Pero el miedo de esas tres noches seguía ahí, guardado, más real y más crudo que casi cualquier otro recuerdo que Yesir tuviera.", "i": false}]}, {"type": "p", "runs": [{"t": "—Este —dijo, cerrándolo en pigmento con manos que ya no temblaban tanto como la primera vez, aunque el pecho le doliera con una intensidad nueva—. Este es de verdad.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "El Guardián lo absorbió, y por un instante Yesir sintió algo distinto a la primera vez: no un vacío pequeño, sino un alivio extraño, casi como si soltar ese miedo específico —el más crudo, el más honesto de todos los que llevaba encima— le hubiera despejado un espacio que llevaba meses necesitando despejar.", "i": false}]}, {"type": "p", "runs": [{"t": "—El paso es suyo —dijo el Guardián—. Y le voy a decir algo que no le digo a todos, forastero: pocos entregan un dolor de verdad. La mayoría intenta escabullirse con tristezas pequeñas, esperando que yo no note la diferencia. Usted no. Usted entendió, sin que nadie se lo explicara, que a veces hay que mostrar la herida entera para que alguien confíe en que uno merece cruzar.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir asintió, sin saber muy bien qué responder, y cruzó la frontera, sintiendo, extrañamente, más liviano de lo que había estado en semanas.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Esa noche, ya profundamente dentro del territorio de la Marea Gris —donde el color había desaparecido casi por completo, dejando solo un mundo de sombras grises sobre un fondo más gris todavía—, Yesir se sentó junto a una fogata que parecía, ella misma, más apagada que ninguna otra que hubiera encendido en el camino, y sacó del bolsillo el cuenco pequeño con pétalos de amapola que había traído desde Almagre.", "i": false}]}, {"type": "p", "runs": [{"t": "Lo miró un largo rato, pensando en Danira extrayendo color de esos mismos pétalos cada mañana, con esa economía de movimientos que a él le seguía pareciendo, incluso ahora, uno de los espectáculos más hermosos que existían en Pigmalia.", "i": false}]}, {"type": "p", "runs": [{"t": "—Ya casi llego —le dijo, al cuenco, a la noche, a cualquiera que pudiera estar escuchando—. Ya casi llego, Danira. Aguante un poco más. Yo ya pagué lo que había que pagar. Ahora solo me falta caminar lo que falte caminar.", "i": false}]}, {"type": "p", "runs": [{"t": "Se tocó la muñeca izquierda, buscando el Alba Doble, y lo encontró ahí, más débil que nunca, apenas un hilo de luz bajo la piel, pero todavía, contra todo pronóstico razonable, encendido.", "i": false}]}, {"type": "p", "runs": [{"t": "Todavía ahí.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}]}, {"file": "12-el-guardia-que-miraba-hacia-otro-lado.md", "num": "CAPÍTULO XII", "title": "EL GUARDIA QUE MIRABA HACIA OTRO LADO", "body": [{"type": "p", "runs": [{"t": "A tres días de las ruinas de Grisalda, Yesir encontró al muchacho sentado junto al camino, con el uniforme gris de Recolector todavía puesto pero el capuchón bajo, mostrando una cara demasiado joven para la dureza que se suponía que ese uniforme debía llevar consigo.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir se detuvo, con una mano en el pincel, listo para defenderse si hacía falta, pero el muchacho no hizo ningún gesto amenazante. Se limitó a mirarlo, con una expresión que mezclaba alivio y miedo a partes iguales.", "i": false}]}, {"type": "p", "runs": [{"t": "—Usted es el esposo —dijo, no como pregunta sino como afirmación—. El Fijador de Almagre. Ella habla de usted todas las noches, en voz baja, como si rezara.", "i": false}]}, {"type": "p", "runs": [{"t": "Yesir sintió que el corazón le daba un vuelco.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿La ha visto? ¿Está bien?", "i": false}]}, {"type": "p", "runs": [{"t": "—Está viva. Está fuerte, más de lo que cualquiera esperaría de alguien en su situación. —El muchacho bajó la vista, con una vergüenza que le costaba disimular—. Me llamo Petrán. Soy Recolector desde hace dos años, desde que mi familia no tuvo otra manera de sobrevivir en Grisalda salvo enviarme al servicio del Curador. Pero llevo semanas mirando hacia otro lado cuando la encuentro cuidando esa flor suya, y ya no puedo seguir fingiendo que no me importa lo que le va a pasar.", "i": false}]}, {"type": "ornament", "text": "✦ ✦ ✦"}, {"type": "p", "runs": [{"t": "Se sentaron juntos junto al camino, y Petrán, con la voz baja de quien teme que hasta las piedras puedan delatarlo, le contó a Yesir todo lo que sabía: la fecha exacta de la Luna sin Color —siete días, ya no más—, la disposición del castillo, los turnos de guardia, y sobre todo, el verdadero papel del Curador en todo el plan.", "i": false}]}, {"type": "p", "runs": [{"t": "—Nébrisa cree que va a recuperar a su esposo —dijo Petrán—. Pero el Curador no cree eso ni por un segundo. Lo he oído hablar, cuando cree que nadie más lo escucha. Lo que él quiere es el poder de su esposa entero, para él, no para devolverle nada a nadie.", "i": false}]}, {"type": "p", "runs": [{"t": "—¿Y por qué me cuenta todo esto?", "i": false}]}, {"type": "p", "runs": [{"t": "Petrán se quedó callado un momento, mirando el horizonte gris que se extendía hasta donde alcanzaba la vista.", "i": false}]}, {"type": "p", "runs": [{"t": "—Porque crecí en un territorio sin color, señor. Nunca en mi vida he visto un amanecer de verdad, ni una flor que no fuera cultivada a fuerza de voluntad ajena en una celda de piedra. Y cuando veo a
